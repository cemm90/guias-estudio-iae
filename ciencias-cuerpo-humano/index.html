<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Guía de estudio interactiva y gamificada para la Prueba de Ciencias Naturales: sistema esquelético, muscular, nervioso y efectos del alcohol.">
<meta name="curso" content="4° Básico">
<meta name="asignatura" content="Ciencias Naturales">

<meta property="og:title" content="Guía Interactiva · Cuerpo Humano · Ciencias Naturales 4° Básico">
<meta property="og:description" content="Guía de estudio interactiva y gamificada para la Prueba de Ciencias Naturales: sistema esquelético, muscular, nervioso y efectos del alcohol.">
<meta property="og:locale" content="es_CL">
<title>Guía Interactiva · Cuerpo Humano · Ciencias Naturales 4° Básico</title>
<style>
/* =========================================================
   1. VARIABLES Y ESTILOS BASE
   ========================================================= */
:root{
  --azul:#1d6fd0;      --azul-claro:#e7f1fd;
  --rojo:#d63a3a;      --rojo-claro:#fdeaea;
  --morado:#7b3fbf;    --morado-claro:#f3ebfd;
  --verde:#128a6e;     --verde-claro:#e4f6f1;
  --amarillo:#f5a623;  --amarillo-claro:#fff5e3;
  --tinta:#1b2130;     --tinta-suave:#4a5468;
  --linea:#dfe4ee;     --fondo:#f4f6fb;  --blanco:#ffffff;
  --ok:#0f8a4d;        --ok-claro:#e3f7ec;
  --mal:#c62828;       --mal-claro:#fdeceb;
  --sombra:0 4px 16px rgba(20,30,60,.10);
  --sombra-alta:0 10px 30px rgba(20,30,60,.16);
  --radio:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,Verdana,sans-serif;
  background:var(--fondo); color:var(--tinta); line-height:1.6; font-size:17px;
  -webkit-font-smoothing:antialiased;
}
img,svg{max-width:100%}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--amarillo);outline-offset:2px;border-radius:8px}
.oculto{display:none !important}

/* =========================================================
   2. ENCABEZADO / HUD DE JUEGO
   ========================================================= */
#hud{
  position:sticky;top:0;z-index:50;background:var(--blanco);
  border-bottom:2px solid var(--linea);box-shadow:0 2px 10px rgba(20,30,60,.06);
}
.hud-fila{
  max-width:1000px;margin:0 auto;padding:10px 16px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.hud-logo{font-weight:bold;font-size:1.05rem;color:var(--morado);margin-right:auto;letter-spacing:-.3px}
.hud-logo small{display:block;font-weight:normal;font-size:.72rem;color:var(--tinta-suave);letter-spacing:0}
.chip{
  background:var(--fondo);border:2px solid var(--linea);border-radius:999px;
  padding:4px 12px;font-size:.85rem;font-weight:bold;white-space:nowrap;
}
.chip.xp{background:var(--amarillo-claro);border-color:#f2d296;color:#8a5a06}
.chip.racha{background:var(--rojo-claro);border-color:#f4c4c4;color:#a32626}
.chip.medallas{background:var(--morado-claro);border-color:#dcc9f4;color:#5b2c93}
.barra-global{height:8px;background:var(--linea);width:100%}
.barra-global > i{display:block;height:100%;background:linear-gradient(90deg,var(--morado),var(--azul));width:0;transition:width .5s ease}

/* =========================================================
   3. LAYOUT
   ========================================================= */
main{max-width:1000px;margin:0 auto;padding:20px 16px 70px}
.tarjeta{
  background:var(--blanco);border-radius:var(--radio);box-shadow:var(--sombra);
  padding:22px;margin-bottom:18px;border:1px solid var(--linea);
}
h1{font-size:1.9rem;line-height:1.25;margin-bottom:8px;letter-spacing:-.5px}
h2{font-size:1.4rem;margin-bottom:10px;line-height:1.3}
h3{font-size:1.12rem;margin:16px 0 6px;color:var(--tinta)}
p{margin-bottom:10px}
ul,ol{margin:0 0 12px 22px}
li{margin-bottom:6px}
.sub{color:var(--tinta-suave);font-size:.95rem}
.centro{text-align:center}

/* =========================================================
   4. BOTONES
   ========================================================= */
.btn{
  display:inline-block;background:var(--morado);color:#fff;font-weight:bold;
  padding:13px 24px;border-radius:999px;box-shadow:0 4px 0 rgba(0,0,0,.18);
  transition:transform .08s ease, filter .15s ease;text-align:center;
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.azul{background:var(--azul)} .btn.rojo{background:var(--rojo)}
.btn.verde{background:var(--verde)} .btn.amarillo{background:var(--amarillo);color:#4a3000}
.btn.gris{background:#7b8598}
.btn.grande{font-size:1.15rem;padding:16px 34px}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.fila-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}

/* =========================================================
   5. PORTADA
   ========================================================= */
.portada{
  background:linear-gradient(135deg,#7b3fbf 0%,#1d6fd0 60%,#128a6e 100%);
  color:#fff;border-radius:24px;padding:34px 24px;text-align:center;box-shadow:var(--sombra-alta);
  margin-bottom:20px;
}
.portada h1{font-size:2.15rem;margin-bottom:6px}
.portada p{opacity:.95}
.portada .btn{background:#fff;color:var(--morado);margin-top:14px}
.grid-temas{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:20px}
.mini-tema{background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.35);border-radius:14px;padding:12px;text-align:left}
.mini-tema b{display:block;font-size:1rem}
.mini-tema span{font-size:.85rem;opacity:.9}

/* =========================================================
   6. MAPA DE NIVELES
   ========================================================= */
.mapa{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.nivel{
  background:var(--blanco);border-radius:var(--radio);border:2px solid var(--linea);
  padding:18px;box-shadow:var(--sombra);position:relative;text-align:left;
  transition:transform .12s ease, box-shadow .12s ease;
}
.nivel:hover:not(.bloqueado){transform:translateY(-4px);box-shadow:var(--sombra-alta)}
.nivel .num{
  width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:bold;font-size:1.2rem;color:#fff;margin-bottom:10px;
}
.nivel h3{margin:0 0 4px;font-size:1.1rem}
.nivel .estrellas{font-size:1.1rem;letter-spacing:2px;margin-top:8px}
.nivel.bloqueado{opacity:.55;filter:grayscale(.6);cursor:not-allowed}
.nivel .candado{position:absolute;top:14px;right:16px;font-size:1.3rem}
.nivel .etiqueta{font-size:.78rem;font-weight:bold;text-transform:uppercase;letter-spacing:.5px;opacity:.75}

/* =========================================================
   7. PESTAÑAS DEL MÓDULO
   ========================================================= */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{
  padding:9px 16px;border-radius:999px;font-weight:bold;font-size:.92rem;
  background:var(--blanco);border:2px solid var(--linea);color:var(--tinta-suave);
}
.tab.activa{background:var(--morado);border-color:var(--morado);color:#fff}

/* Cajas de contenido */
.caja{border-left:6px solid var(--azul);background:var(--azul-claro);border-radius:12px;padding:14px 16px;margin:12px 0}
.caja.roja{border-color:var(--rojo);background:var(--rojo-claro)}
.caja.morada{border-color:var(--morado);background:var(--morado-claro)}
.caja.verde{border-color:var(--verde);background:var(--verde-claro)}
.caja.amarilla{border-color:var(--amarillo);background:var(--amarillo-claro)}
.caja b.titulo{display:block;font-size:1.02rem;margin-bottom:4px}
.dato{background:var(--amarillo-claro);border:2px dashed var(--amarillo);border-radius:12px;padding:12px 14px;margin:12px 0}
.dato b{color:#8a5a06}
.memoriza{background:var(--morado-claro);border:2px solid #dcc9f4;border-radius:12px;padding:12px 14px;margin:12px 0}

table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.94rem;background:var(--blanco)}
th,td{border:1px solid var(--linea);padding:9px 10px;text-align:left;vertical-align:top}
th{background:var(--morado);color:#fff;font-size:.9rem}
tr:nth-child(even) td{background:#fafbfe}
.tabla-scroll{overflow-x:auto}

.termino{background:#fff3cd;padding:0 4px;border-radius:4px;font-weight:bold}

/* --- Ilustraciones --- */
.ilus{margin:18px 0;text-align:center;background:#fbfcff;border:1px solid var(--linea);border-radius:14px;padding:12px 8px}
.ilus svg{max-width:100%;height:auto}
.ilus figcaption{font-size:.85rem;color:var(--tinta-suave);margin-top:8px;font-style:italic;padding:0 8px}
.ilus text{font-family:"Trebuchet MS",Verdana,sans-serif;font-size:13px;font-weight:bold;fill:#1b2130}
.ilus text.pq{font-size:11px;font-weight:normal;fill:#4a5468;font-style:normal}
.ilus text.blanco{fill:#fff}
.ilus .ptr{stroke:#9aa3b5;stroke-width:1.4;stroke-dasharray:4 3;fill:none}
.hero-img{width:100%;border-radius:18px;display:block;box-shadow:var(--sombra-alta);margin-bottom:14px}
.trofeo-img{width:190px;margin:0 auto 6px;display:block;filter:drop-shadow(0 6px 14px rgba(0,0,0,.28))}

/* =========================================================
   8. ACTIVIDADES
   ========================================================= */
.pregunta-caja{background:var(--blanco);border-radius:var(--radio);border:1px solid var(--linea);box-shadow:var(--sombra);padding:20px;margin-bottom:16px}
.meta-preg{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.nivel-dif{font-size:.74rem;font-weight:bold;text-transform:uppercase;padding:3px 10px;border-radius:999px;letter-spacing:.5px}
.nivel-dif.basico{background:var(--verde-claro);color:var(--verde)}
.nivel-dif.intermedio{background:var(--amarillo-claro);color:#8a5a06}
.nivel-dif.avanzado{background:var(--rojo-claro);color:var(--rojo)}
.enunciado{font-size:1.12rem;font-weight:bold;margin-bottom:14px;line-height:1.45}
.opciones{display:grid;gap:9px}
.opcion{
  text-align:left;background:var(--blanco);border:2px solid var(--linea);border-radius:12px;
  padding:12px 14px;transition:background .12s,border-color .12s;display:flex;gap:10px;align-items:flex-start;
}
.opcion:hover:not(:disabled){border-color:var(--morado);background:var(--morado-claro)}
.opcion .letra{
  flex:0 0 26px;height:26px;border-radius:50%;background:var(--linea);color:var(--tinta-suave);
  display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:.85rem;
}
.opcion.correcta{background:var(--ok-claro);border-color:var(--ok)}
.opcion.correcta .letra{background:var(--ok);color:#fff}
.opcion.incorrecta{background:var(--mal-claro);border-color:var(--mal)}
.opcion.incorrecta .letra{background:var(--mal);color:#fff}
.opcion:disabled{cursor:default}
.feedback{margin-top:14px;padding:13px 15px;border-radius:12px;font-size:.97rem;animation:aparecer .25s ease}
.feedback.bien{background:var(--ok-claro);border-left:6px solid var(--ok)}
.feedback.mal{background:var(--mal-claro);border-left:6px solid var(--mal)}
.feedback b{display:block;margin-bottom:3px}
@keyframes aparecer{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.progreso-quiz{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:.88rem;font-weight:bold;color:var(--tinta-suave)}
.progreso-quiz .barra{flex:1;height:10px;background:var(--linea);border-radius:999px;overflow:hidden}
.progreso-quiz .barra > i{display:block;height:100%;background:var(--morado);width:0;transition:width .35s ease}

/* Flashcards */
.flash-zona{perspective:1200px;margin:0 auto 14px;max-width:520px}
.flash{
  position:relative;width:100%;min-height:210px;transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.4,.2,.2,1);cursor:pointer;
}
.flash.girada{transform:rotateY(180deg)}
.flash > div{
  position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radio);
  padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  box-shadow:var(--sombra-alta);
}
.flash .frente{background:linear-gradient(135deg,#7b3fbf,#1d6fd0);color:#fff}
.flash .reverso{background:var(--blanco);border:3px solid var(--morado);transform:rotateY(180deg)}
.flash .frente span,.flash .reverso span{font-size:.78rem;text-transform:uppercase;letter-spacing:1px;opacity:.8;margin-bottom:8px}
.flash .frente b{font-size:1.3rem;line-height:1.35}
.flash .reverso p{font-size:1.02rem;margin:0}

/* Relacionar */
.relacionar{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rel-col{display:grid;gap:8px;align-content:start}
.rel-item{
  text-align:left;background:var(--blanco);border:2px solid var(--linea);border-radius:12px;padding:11px 12px;font-size:.94rem;
}
.rel-item:hover:not(:disabled){border-color:var(--azul);background:var(--azul-claro)}
.rel-item.sel{border-color:var(--morado);background:var(--morado-claro);font-weight:bold}
.rel-item.hecho{background:var(--ok-claro);border-color:var(--ok);opacity:.75;cursor:default}
.rel-item.error{border-color:var(--mal);background:var(--mal-claro);animation:temblar .3s}
@keyframes temblar{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* Ordenar */
.orden-lista{display:grid;gap:8px;margin-bottom:12px}
.orden-item{text-align:left;background:var(--blanco);border:2px solid var(--linea);border-radius:12px;padding:11px 12px}
.orden-item:hover:not(:disabled){border-color:var(--verde);background:var(--verde-claro)}
.orden-item.usado{opacity:.4;cursor:default}
.orden-destino{min-height:52px;border:2px dashed var(--linea);border-radius:12px;padding:8px;display:grid;gap:6px;margin-bottom:10px;background:#fbfcff}
.orden-destino .puesto{background:var(--morado-claro);border:2px solid var(--morado);border-radius:10px;padding:9px 11px;font-size:.93rem}

/* Identificar (SVG) */
.svg-zona{background:var(--blanco);border:2px solid var(--linea);border-radius:var(--radio);padding:10px;text-align:center}
.punto{cursor:pointer}
.punto circle{fill:var(--amarillo);stroke:#fff;stroke-width:2.5;transition:fill .15s,r .15s}
.punto:hover circle{fill:var(--morado)}
.punto.acertado circle{fill:var(--ok)}
.punto text{font-size:11px;font-weight:bold;fill:#fff;pointer-events:none}

/* Resultados */
.resultado-hero{text-align:center;padding:26px 18px;border-radius:24px;color:#fff;box-shadow:var(--sombra-alta);margin-bottom:18px}
.resultado-hero .emoji{font-size:3.4rem;display:block;line-height:1}
.resultado-hero h2{color:#fff;font-size:1.8rem;margin:6px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:16px 0}
.stat{background:var(--blanco);border:1px solid var(--linea);border-radius:14px;padding:14px;text-align:center;box-shadow:var(--sombra)}
.stat b{display:block;font-size:1.7rem;line-height:1.1;color:var(--morado)}
.stat span{font-size:.83rem;color:var(--tinta-suave)}
.medalla{display:inline-flex;align-items:center;gap:7px;background:var(--amarillo-claro);border:2px solid var(--amarillo);border-radius:999px;padding:6px 14px;margin:4px;font-size:.88rem;font-weight:bold;color:#8a5a06}
.repaso-item{background:var(--blanco);border-left:6px solid var(--rojo);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--sombra)}
.repaso-item.bueno{border-color:var(--ok)}

/* Aviso emergente */
#toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(140%);
  background:var(--tinta);color:#fff;padding:12px 22px;border-radius:999px;font-weight:bold;
  box-shadow:var(--sombra-alta);z-index:100;transition:transform .35s cubic-bezier(.2,1.3,.4,1);max-width:90vw;text-align:center;
}
#toast.ver{transform:translateX(-50%) translateY(0)}

footer{text-align:center;padding:26px 16px;color:var(--tinta-suave);font-size:.83rem}

@media(max-width:620px){
  body{font-size:16px}
  h1{font-size:1.55rem} .portada h1{font-size:1.7rem}
  .relacionar{grid-template-columns:1fr}
  .hud-logo small{display:none}
  .tarjeta{padding:16px}
}
@media print{ #hud,.fila-btns,.btn{display:none} }
</style>
</head>

<header id="hud">
  <div class="hud-fila">
    <div class="hud-logo">🧠 Cuerpo Humano<small>Ciencias Naturales · 4° Básico</small></div>
    <span class="chip xp" id="chip-xp">⭐ 0 XP</span>
    <span class="chip racha" id="chip-racha">🔥 0</span>
    <span class="chip medallas" id="chip-medallas">🏅 0</span>
  </div>
  <div class="barra-global"><i id="barra-global"></i></div>
</header>

<main id="app"><!-- Todo el contenido se dibuja con JavaScript --></main>

<footer>
  Guía de estudio interactiva · Construida a partir del texto escolar (Unidad 1) y la guía formativa del Departamento de Ciencias Naturales.
</footer>

<script>
/* =========================================================================
   GUÍA DE ESTUDIO INTERACTIVA — CUERPO HUMANO (4° Básico)

     A) DATOS      → CONTENIDO (4 módulos) + SIMULACRO
     B) ESTADO     → progreso, XP, medallas
     C) UTILIDADES → mezclar, toast, guardar
     D) MOTOR      → pantallas y actividades
   Para agregar contenido nuevo basta con editar el objeto CONTENIDO.
   ========================================================================= */

/* =============== A00) IMÁGENES INCRUSTADAS (base64, funcionan offline) ===
   Generadas con IA para esta guía. Van embebidas para que el archivo

{
  id:"nervioso",
  titulo:"Sistema nervioso",
  apodo:"Detective de Estímulos",
  icono:"🧠",
  color:"var(--morado)",
  colorClaro:"var(--morado-claro)",
  clase:"morada",
  intro:"Es el centro de control del cuerpo: recibe los estímulos, los procesa y elabora una respuesta.",

  secciones:[
    {t:"¿Qué hace el sistema nervioso?", h:`
      <p>El <b>sistema nervioso</b> controla <b>todo lo que haces</b>: la respiración, el caminar, lo que piensas y lo que sientes.</p>
      <p>Funciona <b>recopilando e interpretando señales</b>, tanto del interior de tu organismo como del mundo que te rodea,
      y <b>coordina una respuesta adecuada</b>.</p>
      <div class="caja morada"><b class="titulo">⚡ ¿Qué es un estímulo?</b>
        Un <b>estímulo</b> es <b>cualquier cosa que puede provocar una respuesta en nuestro cuerpo</b>.
        Los percibimos a través de los <b>órganos de los sentidos</b>: puede ser un sonido, una imagen, un olor, un sabor o un toque.</div>
      <p>Cuando un estímulo llega a los órganos de los sentidos se produce una <b>señal</b>. Esa señal la recibe el sistema nervioso,
      que la <b>procesa</b> y elabora una <b>respuesta rápida</b>.</p>`},

    {t:"Las partes del sistema nervioso", h:`
      <p>El sistema nervioso está compuesto por: el <span class="termino">encéfalo</span>, la <span class="termino">médula espinal</span> y los <span class="termino">nervios</span>.</p>
      ${ILUS.nervioso}
      <div class="caja morada"><b class="titulo">🧠 Encéfalo</b>
        Es el <b>órgano de mayor tamaño</b> del sistema nervioso y está protegido por el <b>cráneo</b>.
        Está compuesto por <b>tres partes</b>: el <b>cerebro</b>, el <b>cerebelo</b> y el <b>tronco encefálico</b>.
        <ul style="margin-top:8px">
          <li><b>Cerebro:</b> ocupa la mayor parte del encéfalo. Es el <b>centro de control</b>. Coordina y controla los
              <b>movimientos voluntarios</b>, percibe sensaciones (tacto, luz, sonidos, olores, gustos, dolor, calor y frío),
              elabora respuestas a los estímulos y participa en los <b>procesos de aprendizaje</b>.</li>
          <li><b>Cerebelo</b> y <b>tronco encefálico:</b> las otras dos partes que completan el encéfalo.</li>
        </ul></div>
      ${ILUS.encefalo}
      <div class="caja morada"><b class="titulo">🧬 Médula espinal</b>
        Es como un <b>«cordón»</b> protegido por las <b>vértebras</b> que forman la columna vertebral.
        Es la <b>autopista principal</b> que conecta con el cerebro. Sus funciones son:
        <b>conducir la información nerviosa</b> y <b>elaborar respuestas involuntarias sencillas</b> llamadas <b>reflejos</b>
        (movimientos rápidos y automáticos).</div>
      <div class="caja morada"><b class="titulo">🕸️ Nervios</b>
        Son <b>largas fibras</b> que recorren todo el cuerpo. Se encargan de <b>transmitir señales o información nerviosa</b>
        desde y hacia las diferentes partes del cuerpo, el encéfalo o la médula espinal.</div>
      <div class="dato"><b>🛡️ ¿Quién protege a quién?</b> El <b>cráneo</b> protege el <b>encéfalo</b>.
        La <b>columna vertebral</b> (vértebras) protege la <b>médula espinal</b>. ¡Aquí se conecta con el Módulo 1!</div>`},

    {t:"Respuestas voluntarias e involuntarias", h:`
      ${ILUS.comparacion}
      <div class="tabla-scroll"><table>
        <tr><th>Criterio</th><th>Respuesta VOLUNTARIA</th><th>Respuesta INVOLUNTARIA</th></tr>
        <tr><td><b>Tipo de control</b></td><td>Consciente: tú decides</td><td>Inconsciente: es automática</td></tr>
        <tr><td><b>Quién la elabora</b></td><td>El <b>cerebro</b></td><td>La <b>médula espinal</b></td></tr>
        <tr><td><b>Velocidad</b></td><td>Necesita que lo pienses</td><td>Muy rápida y automática</td></tr>
        <tr><td><b>Ejemplos</b></td><td>Caminar, saltar, agitar la mano, masticar, abrigarse, levantarse de la cama</td><td>Latidos del corazón, respirar, parpadear, retirar el pie al pisar una espina, la pupila que se achica con la luz</td></tr>
      </table></div>
      <div class="caja verde"><b class="titulo">✅ Se parecen en que…</b>
        En ambas el estímulo es captado por los <b>órganos de los sentidos</b> (receptores) y en ambas se transmite

  return {xp:0, racha:0, mejorRacha:0, medallas:[], modulos:{},
          simulacro:null, inicio:Date.now(), correctas:0, incorrectas:0};
}
function cargar(){
  try{ const g = localStorage.getItem(CLAVE); if(g) return Object.assign(estadoInicial(), JSON.parse(g)); }
  catch(e){ /* si no hay localStorage, se juega igual sin guardar */ }
  return estadoInicial();
}

  try{ localStorage.setItem(CLAVE, JSON.stringify(E)); }catch(e){}
}
let E = cargar();

function modEstado(id){
  if(!E.modulos[id]) E.modulos[id] = {estrellas:0, pct:0, completado:false, flash:false, relacionar:false, ordenar:false, identificar:false};
  return E.modulos[id];
}

const app = document.getElementById("app");

/** Mezcla aleatoria (Fisher-Yates) */
function mezclar(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
let tToast;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("ver");
  clearTimeout(tToast); tToast = setTimeout(()=>t.classList.remove("ver"), 2200);
}
function sumarXP(n){ E.xp += n; guardar(); pintarHUD(); }
function ganarMedalla(id){
  if(E.medallas.includes(id)) return;
  E.medallas.push(id); guardar(); pintarHUD();
  toast("🏅 ¡Nueva medalla: " + MEDALLAS[id].n + "!");
}
function pintarHUD(){
  $("#chip-xp").textContent = "⭐ " + E.xp + " XP";
  $("#chip-racha").textContent = "🔥 " + E.racha;
  $("#chip-medallas").textContent = "🏅 " + E.medallas.length;
  const hechos = CONTENIDO.filter(m => modEstado(m.id).completado).length;
  const total = CONTENIDO.length + 1;                    // 4 módulos + simulacro
  const pct = Math.round(((hechos + (E.simulacro?1:0)) / total) * 100);
  $("#barra-global").style.width = pct + "%";
}
function tiempoJugado(){
  const s = Math.max(0, Math.floor((Date.now() - E.inicio)/1000));
  return String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0");
}

/* Juego: relacionar conceptos */
function juegoRelacionar(m){
  const caja = document.createElement("div");
  caja.className = "tarjeta";
  const izq = mezclar(m.relacionar.pares), der = mezclar(m.relacionar.pares);
  caja.innerHTML = `
    <h2 style="color:${m.color}">🔗 ${m.relacionar.titulo}</h2>
    <p class="sub">Haz clic en un concepto de la izquierda y luego en su pareja de la derecha.</p>
    <div class="relacionar">
      <div class="rel-col">${izq.map(p=>`<button class="rel-item" data-lado="a" data-k="${p.a}">${p.a}</button>`).join("")}</div>
      <div class="rel-col">${der.map(p=>`<button class="rel-item" data-lado="b" data-k="${p.a}">${p.b}</button>`).join("")}</div>
    </div>
    <p class="sub" style="margin-top:12px" id="rel-info">Parejas encontradas: 0 de ${m.relacionar.pares.length}</p>`;

  let selA = null, selB = null, hechas = 0, errores = 0;
  const items = caja.querySelectorAll(".rel-item");
  items.forEach(b => b.onclick = ()=>{
    if(b.classList.contains("hecho")) return;
    const lado = b.dataset.lado;
    if(lado==="a"){ if(selA) selA.classList.remove("sel"); selA=b; }
    else          { if(selB) selB.classList.remove("sel"); selB=b; }
    b.classList.add("sel");
    if(selA && selB){
      const a=selA, bb=selB; selA=null; selB=null;
      if(a.dataset.k === bb.dataset.k){
        a.classList.remove("sel"); bb.classList.remove("sel");
        a.classList.add("hecho"); bb.classList.add("hecho");
        a.disabled = true; bb.disabled = true;
        hechas++; sumarXP(8);
        caja.querySelector("#rel-info").textContent = `Parejas encontradas: ${hechas} de ${m.relacionar.pares.length}`;
        if(hechas === m.relacionar.pares.length){
          sumarXP(25); ganarMedalla("emparejador");
          if(!modEstado(m.id).relacionar){ modEstado(m.id).relacionar = true; guardar(); }
          caja.querySelector("#rel-info").innerHTML =
            `<b style="color:var(--ok)">✅ ¡Completado! ${errores===0?"Sin ningún error. ¡Impecable!":"Errores: "+errores}</b>`;
        }
      } else {
        errores++;
        [a,bb].forEach(x=>{ x.classList.remove("sel"); x.classList.add("error");
          setTimeout(()=>x.classList.remove("error"), 450); });
        toast("❌ Esa pareja no corresponde. ¡Inténtalo otra vez!");
      }
    }
  });
  return caja;
}

/* Juego: identificar estructuras sobre un esquema SVG */
function juegoIdentificar(m){
  const cfg = m.identificar;
  const caja = document.createElement("div");
  caja.className = "tarjeta";
  caja.innerHTML = `
    <h2 style="color:${m.color}">🔬 ${cfg.titulo}</h2>
    <p class="sub">${cfg.instruccion}</p>
    <div class="caja ${m.clase}" id="ident-pedido"></div>
    <div class="svg-zona">${SVGS[cfg.svg]}</div>
    <p class="sub" style="margin-top:10px" id="ident-info"></p>`;

  const coords = PUNTOS[cfg.svg];
  const g = caja.querySelector(".puntos");
  cfg.items.forEach((it,n)=>{
    const [x,y] = coords[it.id];
    const grupo = document.createElementNS("http://www.w3.org/2000/svg","g");
    grupo.setAttribute("class","punto"); grupo.setAttribute("data-id", it.id);
    grupo.setAttribute("tabindex","0"); grupo.setAttribute("role","button");
    grupo.setAttribute("aria-label","Punto " + (n+1));
    grupo.innerHTML = `<circle cx="${x}" cy="${y}" r="12"></circle>
                       <text x="${x}" y="${y+4}" text-anchor="middle">${n+1}</text>`;
    g.appendChild(grupo);
  });

  const orden = mezclar(cfg.items);
  let i = 0, fallos = 0;
  const pedido = caja.querySelector("#ident-pedido");
  const info = caja.querySelector("#ident-info");

  function pedir(){
    if(i >= orden.length){
      pedido.innerHTML = `<b class="titulo" style="color:var(--ok)">✅ ¡Identificaste todas las estructuras!</b>
        ${fallos===0 ? "Y sin ningún error. ¡Excelente!" : "Errores cometidos: " + fallos + ". Vuelve a repasar el esquema."}`;
      info.textContent = "";
      sumarXP(30); ganarMedalla("anatomista");
      if(!modEstado(m.id).identificar){ modEstado(m.id).identificar = true; guardar(); }
      return;
    }
    pedido.innerHTML = `<b class="titulo">👉 Busca: ${orden[i].nombre}</b><span class="sub">Pista: ${orden[i].pista}</span>`;
    info.textContent = `Estructura ${i+1} de ${orden.length}`;
  }
  function intentar(grupo){
    if(i >= orden.length || grupo.classList.contains("acertado")) return;
    if(grupo.dataset.id === orden[i].id){
      grupo.classList.add("acertado"); sumarXP(10);
      toast(azar(ANIMOS_BIEN) + " " + orden[i].nombre + " ✔");
      i++; pedir();
    } else {
      fallos++; toast("❌ Ese punto no es " + orden[i].nombre + ". Revisa la pista.");
    }
  }
  caja.querySelectorAll(".punto").forEach(p=>{
    p.addEventListener("click", ()=>intentar(p));
    p.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); intentar(p); } });
  });
  pedir();
  return caja;
}

/* =============== F) MOTOR DE PREGUNTAS ================================== */

let QZ = null;   // estado del cuestionario en curso

/** Normaliza cualquier pregunta a un formato común con opciones mezcladas */
function prepararPregunta(q){
  if(q.tipo === "vf"){
    return {enun:q.p, nivel:q.nivel, tema:q.tema,
            ops:[{t:"✅ Verdadero", ok:q.r===true}, {t:"❌ Falso", ok:q.r===false}],
            exp:q.exp, tipo:"vf"};
  }
  const ops = q.ops.map((t,idx)=>({t, ok: idx===q.c, mal: q.mal ? q.mal[idx] : null}));
  return {enun:q.p, nivel:q.nivel, tema:q.tema, ops:mezclar(ops), exp:q.exp, tipo:q.tipo};
}

function iniciarQuiz(idx){
  const m = CONTENIDO[idx];
  QZ = {origen:"modulo", modIdx:idx, lista:mezclar(m.preguntas).map(prepararPregunta),
        i:0, ok:0, respondida:false, porTema:{}};
  dibujarPregunta();
}
function iniciarSimulacro(){
  QZ = {origen:"simulacro", lista:mezclar(SIMULACRO).map(prepararPregunta),
        i:0, ok:0, respondida:false, porTema:{}};
  app.innerHTML = `
    <div class="tarjeta" style="border-top:6px solid var(--verde)">
      <h1>🏁 Simulacro de prueba</h1>
      <p>Este simulacro tiene <b>${SIMULACRO.length} preguntas</b> mezcladas de los cuatro temas y de distinta dificultad.
         Responde con calma: después de cada respuesta verás la explicación.</p>
      <div class="dato"><b>Consejo:</b> lee el enunciado completo antes de mirar las alternativas. Si dudas entre dos,
        descarta primero la que sabes que es falsa.</div>
      <div class="fila-btns"><button class="btn verde grande" id="ir">▶ Empezar el simulacro</button>
      <button class="btn gris" id="volver">🗺️ Volver</button></div>
    </div>`;
  $("#ir").onclick = ()=> ir(dibujarPregunta);
  $("#volver").onclick = ()=> ir(pantallaMapa);
}

function dibujarPregunta(){
  const q = QZ.lista[QZ.i];
  const total = QZ.lista.length;
  const pct = Math.round((QZ.i/total)*100);
  const esSim = QZ.origen==="simulacro";
  const m = esSim ? null : CONTENIDO[QZ.modIdx];
  const color = esSim ? "var(--verde)" : m.color;
  const letras = ["A","B","C","D"];

  app.innerHTML = `
  <div class="tarjeta" style="border-top:6px solid ${color}">
    <div class="progreso-quiz">
      <span>${esSim?"🏁 Simulacro":m.icono+" "+m.titulo}</span>
      <div class="barra"><i style="width:${pct}%;background:${color}"></i></div>
      <span>${QZ.i+1}/${total}</span>
    </div>
    <div class="pregunta-caja" style="box-shadow:none;border:none;padding:0">
      <div class="meta-preg">
        <span class="nivel-dif ${q.nivel}">${q.nivel}</span>
        ${q.tema?`<span class="sub">${q.tema}</span>`:""}
      </div>
      <p class="enunciado">${q.enun}</p>
      <div class="opciones" id="ops">
        ${q.ops.map((o,i)=>`<button class="opcion" data-i="${i}">
            <span class="letra">${letras[i]||"•"}</span><span>${o.t}</span></button>`).join("")}
      </div>
      <div id="fb"></div>
    </div>
  </div>
  <div class="fila-btns"><button class="btn gris" id="salir">Salir sin terminar</button></div>`;

  $("#salir").onclick = ()=>{ if(confirm("¿Salir? Se perderá el avance de este cuestionario.")) ir(pantallaMapa); };

  const botones = document.querySelectorAll(".opcion");
  botones.forEach(b => b.onclick = ()=> responder(parseInt(b.dataset.i,10), botones, q));
}

function responder(idx, botones, q){
  if(QZ.respondida) return;
  QZ.respondida = true;
  const elegido = q.ops[idx];
  const acierto = elegido.ok;

  botones.forEach((b,i)=>{
    b.disabled = true;
    if(q.ops[i].ok) b.classList.add("correcta");
    else if(i===idx) b.classList.add("incorrecta");
  });

  /* Registro por tema (para el informe del simulacro) */
  const tema = q.tema || (QZ.origen==="modulo" ? CONTENIDO[QZ.modIdx].titulo : "General");
  if(!QZ.porTema[tema]) QZ.porTema[tema] = {ok:0, total:0};
  QZ.porTema[tema].total++;

  let extra = "";
  if(acierto){
    QZ.ok++; QZ.porTema[tema].ok++; E.correctas++; E.racha++;
    E.mejorRacha = Math.max(E.mejorRacha, E.racha);
    let xp = 10;
    if(E.racha>=3){ xp += 5; extra = ` <b>+5 XP de bonificación por racha de ${E.racha} 🔥</b>`; }
    sumarXP(xp);
    if(E.racha===5)  ganarMedalla("racha5");
    if(E.racha>=10)  ganarMedalla("racha10");
  } else {
    E.incorrectas++; E.racha = 0; guardar();
  }

  const razonMal = (!acierto && elegido.mal) ? `<br><b>¿Por qué no?</b> ${elegido.mal}` : "";
  const correcta = q.ops.find(o=>o.ok).t;
  $("#fb").innerHTML = `
    <div class="feedback ${acierto?"bien":"mal"}">
      <b>${acierto ? "✅ " + azar(ANIMOS_BIEN) : "❌ " + azar(ANIMOS_MAL)}</b>
      ${acierto ? "" : `La respuesta correcta era: <b>${correcta}</b>.${razonMal}<br>`}
      ${q.exp}${extra}
    </div>
    <div class="fila-btns"><button class="btn" id="sig">${QZ.i+1 < QZ.lista.length ? "Siguiente pregunta →" : "Ver mis resultados 🎉"}</button></div>`;

  $("#sig").onclick = ()=>{
    QZ.i++; QZ.respondida = false;
    if(QZ.i < QZ.lista.length) ir(dibujarPregunta);
    else ir(QZ.origen==="simulacro" ? pantallaFinal : pantallaResultadoModulo);
  };
  pintarHUD();
}

/* ---------- Resultado de un módulo ---------- */
function pantallaResultadoModulo(){
  const m = CONTENIDO[QZ.modIdx];
  const st = modEstado(m.id);
  const total = QZ.lista.length;
  const pct = Math.round((QZ.ok/total)*100);
  const est = calcEstrellas(pct);

  if(pct > st.pct){ st.pct = pct; st.estrellas = est; }
  st.completado = true;
  sumarXP(40 + est*20);
  guardar();

  if(pct===100) ganarMedalla("perfecto");
  ganarMedalla("primerPaso");
  if(CONTENIDO.every(x=>modEstado(x.id).completado)) ganarMedalla("todos");

  const siguiente = QZ.modIdx + 1;
  const hayMas = siguiente < CONTENIDO.length;

  app.innerHTML = `
  <div class="resultado-hero" style="background:linear-gradient(135deg, ${m.color}, #2b3550)">
    <span class="emoji">${pct>=90?"🏆":pct>=70?"🎉":pct>=50?"👍":"💪"}</span>
    <h2>${pct>=90?"¡Nivel dominado!":pct>=70?"¡Muy buen trabajo!":pct>=50?"¡Vas bien!":"¡A repasar y volver!"}</h2>
    <p style="font-size:1.6rem;letter-spacing:4px">${estrellasTxt(est)}</p>
    <p>${m.icono} ${m.titulo}</p>
  </div>
  <div class="stats">
    <div class="stat"><b>${pct}%</b><span>de logro</span></div>
    <div class="stat"><b>${QZ.ok}</b><span>correctas</span></div>
    <div class="stat"><b>${total-QZ.ok}</b><span>incorrectas</span></div>
    <div class="stat"><b>${E.xp}</b><span>XP total</span></div>
  </div>
  <div class="tarjeta">
    <h2>📝 Repaso rápido de este módulo</h2>
    <ul>${m.resumen.map(r=>`<li>${r}</li>`).join("")}</ul>
    ${pct<70?`<div class="dato"><b>💡 Recomendación:</b> vuelve a la pestaña <b>📖 Aprender</b> de este nivel y repasa
      las <b>🎯 tarjetas de memoria</b> antes de intentarlo de nuevo. ¡Con una segunda vuelta lo vas a lograr!</div>`:""}
  </div>
  <div class="fila-btns">
    <button class="btn amarillo" id="repetir">🔁 Repetir evaluación</button>
    <button class="btn gris" id="revisar">📖 Volver a estudiar</button>
    ${hayMas?`<button class="btn" id="siguiente">▶ Nivel ${siguiente+1}</button>`
             :`<button class="btn verde" id="simulacro">🏁 Ir al simulacro</button>`}
    <button class="btn gris" id="mapa">🗺️ Mapa</button>
  </div>`;

  $("#repetir").onclick = ()=> ir(()=>iniciarQuiz(QZ.modIdx));
  $("#revisar").onclick = ()=> ir(()=>pantallaModulo(QZ.modIdx,"aprender"));
  $("#mapa").onclick = ()=> ir(pantallaMapa);
  if(hayMas) $("#siguiente").onclick = ()=> ir(()=>pantallaModulo(siguiente,"aprender"));
  else       $("#simulacro").onclick = ()=> ir(iniciarSimulacro);
}

/* ---------- Resultado final del simulacro ---------- */
function pantallaFinal(){
  const total = QZ.lista.length;
  const pct = Math.round((QZ.ok/total)*100);
  const est = calcEstrellas(pct);
  const nota = Math.max(1, Math.min(7, Math.round((1 + (6 * QZ.ok / total)) * 10) / 10));

  if(!E.simulacro || pct > E.simulacro.pct) E.simulacro = {pct, ok:QZ.ok, total, porTema:QZ.porTema};
  sumarXP(60 + est*25);
  if(pct>=60) ganarMedalla("aprobado");
  if(pct>=90) ganarMedalla("experto");
  guardar();

  const temas = Object.keys(QZ.porTema).map(t=>{
    const d = QZ.porTema[t], p = Math.round((d.ok/d.total)*100);
    return {t, p, ...d};
  }).sort((a,b)=>a.p-b.p);

  const debiles = temas.filter(x=>x.p<70);

  app.innerHTML = `
  <div class="resultado-hero" style="background:linear-gradient(135deg,#7b3fbf,#128a6e)">
    ${pct>=60 ? `<img class="trofeo-img" src="${IMG_TROFEO}" alt="Trofeo dorado con un cerebro sonriente con birrete">`
              : `<span class="emoji">💪</span>`}
    <h2>${pct>=90?"¡Científico experto!":pct>=70?"¡Muy buen resultado!":pct>=60?"¡Aprobado!":"¡Sigue practicando!"}</h2>
    <p style="font-size:1.7rem;letter-spacing:5px">${estrellasTxt(est)}</p>
    <p>Simulacro de prueba · Cuerpo Humano</p>
  </div>
  <div class="stats">
    <div class="stat"><b>${pct}%</b><span>de logro</span></div>
    <div class="stat"><b>${QZ.ok}/${total}</b><span>correctas</span></div>
    <div class="stat"><b>${nota}</b><span>nota referencial</span></div>
    <div class="stat"><b>${tiempoJugado()}</b><span>tiempo total</span></div>
    <div class="stat"><b>${E.xp}</b><span>XP acumulados</span></div>
    <div class="stat"><b>${E.mejorRacha}</b><span>mejor racha 🔥</span></div>
  </div>

  <div class="tarjeta">
    <h2>📊 ¿Qué temas necesito repasar?</h2>
    ${temas.map(x=>`
      <div class="repaso-item ${x.p>=70?"bueno":""}">
        <b>${x.t}</b> — ${x.ok} de ${x.total} correctas (${x.p}%)<br>
        <span class="sub">${x.p>=90?"¡Dominado! Solo repasa las tarjetas antes de la prueba."
          : x.p>=70?"Bien, pero conviene revisar el resumen del módulo."
          : "⚠️ Prioridad de repaso: vuelve a este módulo y rehaz su evaluación."}</span>
      </div>`).join("")}
    ${debiles.length===0
      ? `<div class="dato"><b>🎯 ¡Excelente!</b> No hay temas débiles. Repasa las tarjetas de memoria el día antes y descansa bien.</div>`
      : `<div class="dato"><b>🎯 Tu plan de estudio:</b> repasa primero
         <b>${debiles.map(d=>d.t).join("</b>, luego <b>")}</b>. Haz la pestaña <b>Aprender</b> y luego <b>Evaluar</b> de esos niveles.</div>`}
  </div>

  <div class="tarjeta">
    <h2>🏅 Medallas obtenidas (${E.medallas.length} de ${Object.keys(MEDALLAS).length})</h2>
    <div>${E.medallas.length ? E.medallas.map(id=>`<span class="medalla" title="${MEDALLAS[id].d}">${MEDALLAS[id].i} ${MEDALLAS[id].n}</span>`).join("")
                             : `<p class="sub">Aún no tienes medallas. ¡Juega los niveles para conseguirlas!</p>`}</div>
    <h3>Por conseguir</h3>
    <p class="sub">${Object.keys(MEDALLAS).filter(k=>!E.medallas.includes(k)).map(k=>MEDALLAS[k].i+" "+MEDALLAS[k].n).join(" · ") || "¡Las tienes todas! 🏆"}</p>
  </div>

  <div class="tarjeta">
    <h2>✅ Checklist final antes de la prueba</h2>
    <ul>
      <li>Sé qué forma el sistema esquelético y sus 3 funciones (soporte, protección, movimiento).</li>
      <li>Distingo <b>ligamento</b> (hueso–hueso) de <b>tendón</b> (músculo–hueso).</li>
      <li>Sé qué pasa con el bíceps y el tríceps en la flexión y en la extensión.</li>
      <li>Puedo nombrar las partes del sistema nervioso y decir qué hace cada una.</li>
      <li>Distingo respuesta voluntaria (cerebro) de involuntaria (médula espinal).</li>
      <li>Me sé de memoria la secuencia: estímulo → receptor → médula espinal → efector.</li>
      <li>Puedo nombrar al menos 5 efectos del alcohol en el organismo.</li>
    </ul>
  </div>

  <div class="fila-btns">
    <button class="btn amarillo" id="repetir">🔁 Repetir simulacro</button>
    <button class="btn gris" id="mapa">🗺️ Volver al mapa</button>
    <button class="btn rojo" id="reset">♻️ Volver a jugar desde cero</button>
  </div>`;

  $("#repetir").onclick = ()=> ir(iniciarSimulacro);
  $("#mapa").onclick = ()=> ir(pantallaMapa);
  $("#reset").onclick = ()=>{
    if(confirm("Esto borrará tu progreso, XP y medallas. ¿Continuar?")){
      E = estadoInicial(); guardar(); ir(pantallaInicio);
    }
  };
}

/* =============== G) ARRANQUE ============================================ */
pintarHUD();
pantallaInicio();
</script>
</body>
</html>
