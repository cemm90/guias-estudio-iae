<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Guías de estudio interactivas y gamificadas para repasar antes de las pruebas: Lenguaje, Matemática, Ciencias, Historia e Inglés.">
<meta name="theme-color" content="#6C3FB5">
<meta property="og:type" content="website">
<meta property="og:title" content="Guías de Estudio Interactivas">
<meta property="og:description" content="Guías de estudio interactivas y gamificadas para repasar antes de las pruebas: Lenguaje, Matemática, Ciencias, Historia e Inglés.">
<meta property="og:locale" content="es_CL">
<title>Guías de Estudio Interactivas</title>
<style>
/* ============================================================
   PORTADA — Índice de guías de estudio interactivas
   Un solo archivo, sin dependencias externas (funciona offline)
   ============================================================ */
:root{
  --morado:#6C3FB5;
  --morado-osc:#4A2680;
  --morado-claro:#EDE4FF;
  --naranjo:#FF8A3D;
  --verde:#2FA84F;
  --gris:#5B5B6B;
  --texto:#26243B;
  --fondo:#F5F1FF;
  --sombra:0 6px 18px rgba(76,38,128,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Trebuchet MS","Verdana","Segoe UI",sans-serif;
  background:var(--fondo);color:var(--texto);line-height:1.55;font-size:17px;
  min-height:100vh;display:flex;flex-direction:column;
}
a{text-decoration:none;color:inherit}

header{
  background:linear-gradient(135deg,var(--morado),#8E5BD6);
  color:#fff;padding:38px 20px 32px;text-align:center;
  box-shadow:0 4px 14px rgba(0,0,0,.18);
}
header .emo{font-size:52px;display:block;margin-bottom:6px}
header h1{font-size:33px;line-height:1.2;margin-bottom:6px}
header p{font-size:18px;opacity:.93}

.wrap{max-width:960px;margin:0 auto;padding:24px 16px;width:100%;flex:1}

/* ---------- Filtros ---------- */
.filtroGrupo{margin-bottom:14px}
.filtroTit{
  font-size:13px;font-weight:bold;color:var(--gris);text-transform:uppercase;
  letter-spacing:.6px;text-align:center;margin-bottom:7px;
}
.filtros{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.filtro{
  background:#fff;border:3px solid var(--morado-claro);color:var(--morado-osc);
  border-radius:24px;padding:7px 16px;font-size:15px;font-weight:bold;
  font-family:inherit;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:6px;
}
.filtro:hover{background:var(--morado-claro)}
.filtro.activo{background:var(--morado);border-color:var(--morado);color:#fff}
.filtro:focus-visible{outline:3px solid var(--naranjo);outline-offset:2px}
.filtro .n{
  background:var(--morado-claro);color:var(--morado-osc);border-radius:12px;
  padding:0 7px;font-size:12.5px;min-width:20px;text-align:center;
}
.filtro.activo .n{background:rgba(255,255,255,.28);color:#fff}
.filtro:disabled{opacity:.35;cursor:not-allowed}

.resumen{text-align:center;color:var(--gris);font-size:14.5px;margin-bottom:16px}
.limpiar{
  background:none;border:none;color:var(--morado);font-family:inherit;
  font-size:14.5px;font-weight:bold;text-decoration:underline;cursor:pointer;padding:2px 6px;
}

/* ---------- Tarjetas ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:17px}
.guia{
  background:#fff;border-radius:18px;padding:20px;box-shadow:var(--sombra);
  border-top:7px solid var(--morado);display:flex;flex-direction:column;
  transition:transform .16s, box-shadow .16s;position:relative;
}
.guia:hover{transform:translateY(-5px);box-shadow:0 12px 26px rgba(76,38,128,.22)}
.guia:focus-visible{outline:3px solid var(--naranjo);outline-offset:3px}
.guia .emo{font-size:40px;line-height:1;margin-bottom:8px}
.guia .asig{font-size:20px;font-weight:bold;color:var(--morado-osc);margin-bottom:2px}
.guia .curso{font-size:14.5px;color:var(--gris);margin-bottom:9px}
.guia .desc{font-size:15.5px;flex:1;margin-bottom:13px}
.guia .metas{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:13px}
.tag{background:var(--morado-claro);color:var(--morado-osc);border-radius:14px;
  padding:2px 10px;font-size:12.5px;font-weight:bold}
.guia .accion{
  background:var(--naranjo);color:#fff;text-align:center;font-weight:bold;
  padding:11px;border-radius:12px;font-size:16.5px;box-shadow:0 3px 0 #C9631F;
}
.guia:hover .accion{background:#F97C28}

.guia.pronto{border-top-color:#C9C6D8;opacity:.72;cursor:default}
.guia.pronto:hover{transform:none;box-shadow:var(--sombra)}
.guia.pronto .accion{background:#B4B1C4;box-shadow:0 3px 0 #93909F;cursor:default}
.guia .estado{
  position:absolute;top:14px;right:14px;font-size:12px;font-weight:bold;
  background:var(--verde);color:#fff;border-radius:14px;padding:3px 10px;
}
.guia.pronto .estado{background:#B4B1C4}

.vacio{text-align:center;color:var(--gris);padding:40px 12px;font-size:17px}

footer{text-align:center;padding:22px 16px 30px;color:var(--gris);font-size:14px}
footer b{color:var(--morado-osc)}

@media(max-width:620px){
  header h1{font-size:26px}
  header .emo{font-size:42px}
  body{font-size:16px}
  .grid{grid-template-columns:1fr}
  .filtro{font-size:14px;padding:6px 13px}
}
</style>
</head>
<body>

<header>
  <span class="emo">📚</span>
  <h1>Guías de Estudio Interactivas</h1>
  <p>Repasa jugando y llega preparado a la prueba</p>
</header>

<div class="wrap">
  <div id="zonaFiltros"></div>
  <p class="resumen" id="resumen"></p>
  <div class="grid" id="grid"></div>
</div>

<footer>
  Material de repaso creado a partir de las guías del colegio.<br>
  Funciona en computador, tablet y celular · <b>no necesita internet una vez abierta</b>.
</footer>

<script>
/* ============================================================
   NO EDITES EL BLOQUE DE ABAJO A MANO.
   Lo genera el script `actualizar-portada.js` a partir del
   archivo `guia.json` que hay dentro de la carpeta de cada guía.

   Para agregar o cambiar una guía:
     1. Edita el guia.json de su carpeta
     2. Ejecuta:  node actualizar-portada.js
   ============================================================ */
/* GUIAS:INICIO */
const GUIAS = [
  {
    "asignatura": "Ciencias Naturales",
    "curso": "4° Básico",
    "semestre": "Segundo Semestre",
    "unidad": "Unidad · El Cuerpo Humano",
    "emoji": "🔬",
    "color": "#2FA84F",
    "desc": "Guía de estudio interactiva y gamificada para la Prueba de Ciencias Naturales: sistema esquelético, muscular, nervioso y efectos del alcohol.",
    "tags": [
      "Guía de repaso"
    ],
    "carpeta": "ciencias-cuerpo-humano",
    "listo": true
  },
  {
    "asignatura": "Ciencias Naturales",
    "curso": "4° Básico",
    "semestre": "Primer Semestre",
    "unidad": "Síntesis · Materia y Fuerza",
    "emoji": "🔬",
    "color": "#2FA84F",
    "desc": "Guía de estudio interactiva y gamificada de Ciencias Naturales para 4° Básico: la materia y sus propiedades físicas, los tres estados de la materia, y la fuerza y sus efectos, con flashcards y ejercicios.",
    "tags": [
      "Guía de repaso"
    ],
    "carpeta": "ciencias-sintesis",
    "listo": true
  },
  {
    "asignatura": "Historia y Cs. Sociales",
    "curso": "4° Básico",
    "semestre": "Segundo Semestre",
    "unidad": "Unidad · El Reino Maya",
    "emoji": "🗺️",
    "color": "#E0713A",
    "desc": "Guía de estudio interactiva sobre el Reino Maya para 4° Básico: ubicación geográfica, agricultura de tala y roza, organización social, dioses, ciencia, escritura y arte, con niveles y medallas.",
    "tags": [
      "15 tarjetas"
    ],
    "carpeta": "historia-mayas",
    "listo": true
  },
  {
    "asignatura": "Inglés",
    "curso": "4° Básico",
    "semestre": "Segundo Semestre",
    "unidad": "Unit 5 · School Life",
    "emoji": "🌍",
    "color": "#D64545",
    "desc": "Interactive English study guide for Unit 5, 4th grade: school places, asking for directions, object pronouns, must and must not, and going to school, with flashcards, matching and memory games.",
    "tags": [
      "Guía de repaso"
    ],
    "carpeta": "ingles-unidad5",
    "listo": true
  },
  {
    "asignatura": "Lenguaje y Comunicación",
    "curso": "4° Básico",
    "semestre": "Segundo Semestre",
    "unidad": "Unidad 2 · Lecciones 1, 2 y 3",
    "emoji": "🪄",
    "color": "#6C3FB5",
    "desc": "Comprensión de textos literarios y no literarios (información explícita, implícita e inferencias) · Textos instructivos y normativos: estructura y propósito comunicativo y más.",
    "tags": [
      "115 actividades",
      "58 tarjetas",
      "7 niveles"
    ],
    "carpeta": "lenguaje-s2-u2",
    "listo": true
  },
  {
    "asignatura": "Matemática",
    "curso": "4° Básico",
    "semestre": "Segundo Semestre",
    "unidad": "Prueba 1",
    "emoji": "🔢",
    "color": "#1E88E5",
    "desc": "Guía interactiva de Matemática para 4° Básico: números, tablas de multiplicar, vistas 3D, redes de cuerpos geométricos, medición del tiempo, operatoria y resolución de problemas.",
    "tags": [
      "7 niveles"
    ],
    "carpeta": "matematicas-operatorias-problemas-hora",
    "listo": true
  }
];
/* GUIAS:FIN */

/* ---------- Filtros ----------
   Para agregar un filtro nuevo basta con sumar una línea a GRUPOS:
   el campo debe existir en los datos de la guía (lo pone el guia.json).  */
const TODOS = "__todos__";

const GRUPOS = [
  { campo:"curso",      titulo:"Curso",      todos:"Todos los cursos" },
  { campo:"asignatura", titulo:"Asignatura", todos:"Todas" },
  { campo:"semestre",   titulo:"Semestre",   todos:"Todos" }
];

/* Estado inicial: ningún filtro aplicado (se arma desde GRUPOS para
   que nunca quede un campo sin inicializar).                        */
const filtros = Object.fromEntries(GRUPOS.map(gr => [gr.campo, TODOS]));

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

/* Guías que pasan los filtros, ignorando opcionalmente uno de ellos.
   Sirve para contar cuántas quedarían al tocar cada botón.        */
function filtrar(exceptoCampo){
  return GUIAS.filter(g =>
    GRUPOS.every(gr =>
      gr.campo === exceptoCampo ||
      filtros[gr.campo] === TODOS ||
      g[gr.campo] === filtros[gr.campo]
    )
  );
}

function valoresDe(campo){
  return [...new Set(GUIAS.map(g => g[campo]).filter(Boolean))]
         .sort((a,b) => String(a).localeCompare(String(b), "es"));
}

function pintarFiltros(){
  const zona = document.getElementById("zonaFiltros");

  const html = GRUPOS.map(gr => {
    const valores = valoresDe(gr.campo);
    if(valores.length < 2) return "";           // con un solo valor no tiene sentido filtrar

    const base = filtrar(gr.campo);             // resto de filtros ya aplicados
    const activo = filtros[gr.campo];

    const botones = [
      `<button class="filtro ${activo===TODOS?"activo":""}"
               aria-pressed="${activo===TODOS}"
               onclick="elegir('${gr.campo}','${TODOS}')">
         ${esc(gr.todos)} <span class="n">${base.length}</span>
       </button>`,
      ...valores.map(v => {
        const n = base.filter(g => g[gr.campo] === v).length;
        return `<button class="filtro ${activo===v?"activo":""}"
                        aria-pressed="${activo===v}"
                        ${n===0 && activo!==v ? "disabled" : ""}
                        onclick="elegir('${gr.campo}','${esc(v)}')">
                  ${esc(v)} <span class="n">${n}</span>
                </button>`;
      })
    ].join("");

    return `<div class="filtroGrupo">
              <p class="filtroTit">${esc(gr.titulo)}</p>
              <div class="filtros">${botones}</div>
            </div>`;
  }).join("");

  zona.innerHTML = html;
}

function pintarGuias(){
  const lista = filtrar();
  const grid = document.getElementById("grid");
  const resumen = document.getElementById("resumen");

  const hayFiltro = GRUPOS.some(gr => filtros[gr.campo] !== TODOS);
  resumen.innerHTML = !GUIAS.length ? "" :
    `Mostrando <b>${lista.length}</b> de <b>${GUIAS.length}</b> guías` +
    (hayFiltro ? ` · <button class="limpiar" onclick="limpiarFiltros()">Ver todas</button>` : "");

  if(!lista.length){
    grid.innerHTML = `<p class="vacio">${GUIAS.length
      ? "No hay guías que coincidan con esta combinación de filtros."
      : "Todavía no hay guías publicadas."}</p>`;
    return;
  }

  grid.innerHTML = lista.map(g => {
    const tags = (g.tags||[]).map(t => `<span class="tag">${esc(t)}</span>`).join("");
    const interior = `
      <span class="estado">${g.listo ? "Disponible" : "Próximamente"}</span>
      <span class="emo">${g.emoji||"📘"}</span>
      <span class="asig">${esc(g.asignatura)}</span>
      <span class="curso">${esc(g.curso)} · ${esc(g.unidad)}</span>
      <span class="desc">${esc(g.desc)}</span>
      <span class="metas">${tags}</span>
      <span class="accion">${g.listo ? "▶️ Empezar a repasar" : "🔒 Aún no disponible"}</span>`;

    return g.listo
      ? `<a class="guia" style="border-top-color:${esc(g.color||"#6C3FB5")}" href="${esc(g.carpeta)}/">${interior}</a>`
      : `<div class="guia pronto" aria-disabled="true">${interior}</div>`;
  }).join("");
}

function elegir(campo, valor){
  filtros[campo] = (filtros[campo] === valor) ? TODOS : valor;   // volver a tocarlo lo desactiva
  render();
}

function limpiarFiltros(){
  GRUPOS.forEach(gr => filtros[gr.campo] = TODOS);
  render();
}

function render(){
  pintarFiltros();
  pintarGuias();
}

render();
</script>

</body>
</html>
