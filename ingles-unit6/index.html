<style>
/* ============================================================
   ESTILOS — Guía interactiva Unit 6 "Vacation Plans"
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --azul:#1565c0; --azul-claro:#42a5f5; --azul-suave:#e3f2fd;
  --naranjo:#f57c00; --amarillo:#ffc107; --verde:#2e7d32; --verde-claro:#66bb6a;
  --rojo:#c62828; --morado:#6a1b9a; --turquesa:#00897b;
  --texto:#1a2733; --gris:#5b6b7a; --borde:#d7e3ec;
  --sombra:0 4px 14px rgba(21,101,192,.13);
}
body{
  font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;
  background:linear-gradient(160deg,#e0f4ff 0%,#f3fbff 40%,#fff6e6 100%);
  color:var(--texto);min-height:100vh;padding:14px;line-height:1.55;
}
.app{max-width:900px;margin:0 auto}

/* ---------- Encabezado / HUD ---------- */
.hud{
  background:#fff;border-radius:18px;box-shadow:var(--sombra);
  padding:12px 16px;margin-bottom:16px;position:sticky;top:8px;z-index:50;
  border:2px solid var(--borde);
}
.hud-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.hud-title{font-size:1rem;font-weight:bold;color:var(--azul)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{
  background:var(--azul-suave);border-radius:12px;padding:5px 11px;
  font-size:.9rem;font-weight:bold;color:var(--azul);white-space:nowrap;
}
.stat.xp{background:#fff3e0;color:var(--naranjo)}
.stat.racha{background:#e8f5e9;color:var(--verde)}
.barra{
  height:14px;background:#dfeaf3;border-radius:10px;overflow:hidden;margin-top:10px;
}
.barra span{
  display:block;height:100%;width:0%;border-radius:10px;
  background:linear-gradient(90deg,var(--verde-claro),var(--amarillo),var(--naranjo));
  transition:width .5s ease;
}
.barra-label{font-size:.78rem;color:var(--gris);margin-top:4px;text-align:right}

/* ---------- Tarjetas ---------- */
.card{
  background:#fff;border-radius:20px;box-shadow:var(--sombra);
  padding:22px;margin-bottom:16px;border:2px solid var(--borde);
  animation:aparecer .35s ease;
}
@keyframes aparecer{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1{font-size:1.7rem;color:var(--azul);margin-bottom:8px;line-height:1.25}
h2{font-size:1.3rem;color:var(--azul);margin-bottom:10px}
h3{font-size:1.05rem;color:var(--naranjo);margin:14px 0 6px}
p{margin-bottom:9px}
.sub{color:var(--gris);font-size:.95rem}
.en{color:var(--morado);font-weight:bold}
.es{color:var(--gris);font-style:italic}

/* ---------- Botones ---------- */
button{font-family:inherit;font-size:1rem;cursor:pointer;border:none}
.btn{
  background:linear-gradient(135deg,var(--azul),var(--azul-claro));color:#fff;
  padding:13px 24px;border-radius:14px;font-weight:bold;font-size:1.02rem;
  box-shadow:0 4px 0 #0d47a1;transition:transform .12s,box-shadow .12s;margin:5px 5px 5px 0;
}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0d47a1}
.btn.verde{background:linear-gradient(135deg,#2e7d32,#66bb6a);box-shadow:0 4px 0 #1b5e20}
.btn.naranjo{background:linear-gradient(135deg,#ef6c00,#ffb300);box-shadow:0 4px 0 #e65100}
.btn.gris{background:linear-gradient(135deg,#607d8b,#90a4ae);box-shadow:0 4px 0 #455a64}
.btn:focus-visible{outline:4px solid #ffca28;outline-offset:3px}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}

/* ---------- Mapa de niveles ---------- */
.niveles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.nivel{
  background:#fff;border:3px solid var(--borde);border-radius:16px;padding:14px;
  text-align:left;display:flex;gap:12px;align-items:center;width:100%;transition:.15s;
}
.nivel:not(.bloqueado):hover{border-color:var(--azul-claro);transform:translateY(-2px)}
.nivel.bloqueado{opacity:.5;cursor:not-allowed;background:#f2f5f7}
.nivel.listo{border-color:var(--verde-claro);background:#f1f9f2}
.nivel .icono{font-size:2rem;flex-shrink:0}
.nivel .txt strong{display:block;font-size:1rem;color:var(--azul)}
.nivel .txt small{color:var(--gris);font-size:.83rem}

/* ---------- Opciones de respuesta ---------- */
.opciones{display:grid;gap:10px;margin-top:14px}
.opcion{
  background:#fff;border:3px solid var(--borde);border-radius:14px;
  padding:14px 16px;text-align:left;font-size:1.03rem;transition:.15s;width:100%;
}
.opcion:hover:not(:disabled){border-color:var(--azul-claro);background:var(--azul-suave)}
.opcion:focus-visible{outline:4px solid #ffca28;outline-offset:2px}
.opcion.correcta{border-color:var(--verde);background:#e8f5e9;font-weight:bold}
.opcion.incorrecta{border-color:var(--rojo);background:#ffebee}
.opciones.dos{grid-template-columns:1fr 1fr}

/* ---------- Retroalimentación ---------- */
.feedback{
  margin-top:14px;padding:14px 16px;border-radius:14px;font-size:1rem;
  animation:aparecer .3s ease;border-left:7px solid;
}
.feedback.bien{background:#e8f5e9;border-color:var(--verde);color:#1b5e20}
.feedback.mal{background:#ffebee;border-color:var(--rojo);color:#8e1a1a}
.feedback strong{display:block;margin-bottom:3px;font-size:1.08rem}

/* ---------- Cajas de contenido ---------- */
.caja{background:var(--azul-suave);border-radius:14px;padding:14px 16px;margin:10px 0;border-left:6px solid var(--azul-claro)}
.caja.dato{background:#fff8e1;border-color:var(--amarillo)}
.caja.resumen{background:#e8f5e9;border-color:var(--verde-claro)}
.caja.truco{background:#f3e5f5;border-color:var(--morado)}
.caja h4{color:var(--azul);margin-bottom:6px;font-size:1rem}
.caja.dato h4{color:#b8860b}.caja.resumen h4{color:var(--verde)}.caja.truco h4{color:var(--morado)}
ul,ol{margin:6px 0 6px 22px}li{margin-bottom:5px}

.tabla{width:100%;border-collapse:collapse;margin:10px 0;font-size:.95rem}
.tabla th,.tabla td{border:2px solid var(--borde);padding:8px 10px;text-align:left}
.tabla th{background:var(--azul-suave);color:var(--azul)}

/* ---------- Flashcards ---------- */
.flash-zona{perspective:1200px;margin:16px 0}
.flash{
  position:relative;height:190px;cursor:pointer;transform-style:preserve-3d;
  transition:transform .5s;
}
.flash.girada{transform:rotateY(180deg)}
.flash .cara{
  position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:18px;text-align:center;box-shadow:var(--sombra);
}
.flash .frente{background:linear-gradient(135deg,#42a5f5,#1565c0);color:#fff}
.flash .atras{background:linear-gradient(135deg,#66bb6a,#2e7d32);color:#fff;transform:rotateY(180deg)}
.flash .cara .grande{font-size:1.5rem;font-weight:bold;margin-bottom:6px}
.flash .cara .chico{font-size:.9rem;opacity:.9}
.flash-nav{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}

/* ---------- Completar ---------- */
input[type=text]{
  font-family:inherit;font-size:1.05rem;padding:9px 12px;border:3px solid var(--borde);
  border-radius:12px;min-width:160px;color:var(--texto);
}
input[type=text]:focus{outline:none;border-color:var(--azul-claro)}
.frase{font-size:1.15rem;margin:14px 0;line-height:2}
.banco{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.chip{
  background:#fff3e0;border:2px solid var(--naranjo);border-radius:20px;
  padding:6px 13px;font-size:.92rem;color:#e65100;font-weight:bold;
}

/* ---------- Emparejar ---------- */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:8px}
.mitem{
  background:#fff;border:3px solid var(--borde);border-radius:12px;padding:11px;
  font-size:.95rem;text-align:left;transition:.15s;width:100%;
}
.mitem:hover:not(:disabled){border-color:var(--azul-claro)}
.mitem.sel{border-color:var(--naranjo);background:#fff3e0}
.mitem.ok{border-color:var(--verde);background:#e8f5e9;opacity:.65;cursor:default}
.mitem.err{border-color:var(--rojo);background:#ffebee;animation:temblor .3s}
@keyframes temblor{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---------- Ordenar ---------- */
.orden-zona{min-height:60px;background:var(--azul-suave);border:3px dashed var(--azul-claro);
  border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:7px;align-items:flex-start}
.palabra{
  background:#fff;border:2px solid var(--azul);border-radius:11px;padding:8px 13px;
  font-size:1rem;color:var(--azul);font-weight:bold;
}
.palabra:hover{background:var(--azul-suave)}

/* ---------- Medallas ---------- */
.medallas{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px}
.medalla{
  background:#fff8e1;border:3px solid var(--amarillo);border-radius:14px;
  padding:9px 13px;font-size:.9rem;font-weight:bold;color:#8d6e00;
}
.medalla.off{background:#f2f5f7;border-color:var(--borde);color:#a9b6c1}

/* ---------- Final ---------- */
.resultados{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px;margin:14px 0}
.res{background:var(--azul-suave);border-radius:14px;padding:14px;text-align:center}
.res .num{font-size:1.8rem;font-weight:bold;color:var(--azul);display:block}
.res .lab{font-size:.85rem;color:var(--gris)}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:99;
  background:#1b5e20;color:#fff;padding:12px 20px;border-radius:30px;font-weight:bold;
  box-shadow:0 6px 20px rgba(0,0,0,.25);animation:aparecer .3s ease;
}
.oculto{display:none!important}
@media(max-width:560px){
  body{padding:8px}
  .card{padding:16px}
  h1{font-size:1.35rem}
  .opciones.dos{grid-template-columns:1fr}
  .match{grid-template-columns:1fr 1fr;gap:7px}
  .mitem{font-size:.85rem;padding:9px 7px}
}
</style>
</head>

<script>

{

{

  sub:"El clima + Why don't we…? / I'd rather… (Functional Language)",
  teoria:`
    <p>Para decidir qué hacer, primero miramos <strong>el clima</strong> y después <strong>proponemos un plan</strong>.</p>
    <div class="caja"><h4>🌦️ The weather</h4>
      <ul>
        <li>☀️ <span class="en">sunny</span> — soleado</li>
        <li>🔥 <span class="en">hot</span> — caluroso</li>
        <li>☁️ <span class="en">cloudy</span> — nublado</li>
        <li>🌧️ <span class="en">rainy</span> — lluvioso</li>
      </ul>
      <p>Se usan con <strong>It's</strong>: <span class="en">It's sunny today.</span></p>
    </div>
    <div class="caja"><h4>💬 Proponer y preferir</h4>
      <p><span class="en">Why don't we + verbo?</span> = ¿Por qué no…? (proponer un plan)<br>
      <span class="en">I'd rather + verbo.</span> = Yo preferiría… (decir lo que prefieres)</p>
      <p><strong>Diálogo del libro (p. 61):</strong></p>
      <ul>
        <li>— What can we do today?</li>
        <li>— It's sunny. <span class="en">Why don't we</span> go hiking?</li>
        <li>— <span class="en">I'd rather</span> go to the beach.</li>
        <li>— OK. Good idea!</li>
      </ul>
    </div>
    <div class="caja resumen"><h4>📌 Resumen rápido</h4>
      <p>Después de <strong>Why don't we</strong> y de <strong>I'd rather</strong> el verbo va <strong>sin "to"</strong> y sin cambios: <em>Why don't we <u>go</u>…? / I'd rather <u>have</u>…</em></p></div>

      <p><strong>I'd</strong> es la forma corta de <strong>I would</strong>. Y ojo: aunque <em>"Why don't we…?"</em> parece negativa, ¡en realidad es una invitación amable!</p></div>

      <p>En inglés el clima casi siempre necesita el sujeto <strong>it</strong>: "It's rainy". No existe decir solo "Is rainy" — el <em>it</em> es obligatorio aunque no se traduzca.</p></div>`,

  teoria:`
    <p>Usamos <strong>going to</strong> para hablar de <strong>planes futuros</strong>: cosas que ya decidimos hacer.</p>
    <div class="caja"><h4>📐 La fórmula</h4>
      <p><strong>Sujeto + am/is/are + going to + verbo</strong></p>
      <table class="tabla">
        <tr><th>Tipo</th><th>Ejemplo</th></tr>
        <tr><td>✔️ Afirmativo</td><td class="en">I'm going to go snorkeling.</td></tr>
        <tr><td>❌ Negativo</td><td class="en">I'm not going to see a show.</td></tr>
        <tr><td>❓ Pregunta</td><td class="en">What are you going to do on vacation?</td></tr>
      </table>
    </div>
    <div class="caja resumen"><h4>📌 Resumen rápido</h4>
      <p>Con <strong>I</strong> siempre va <strong>am</strong> (I'm / I'm not). Con <strong>you</strong> siempre va <strong>are</strong> (you're / you aren't). Después de "going to" el verbo va <strong>en infinitivo sin to</strong>: <em>going to <u>go</u></em>, <em>going to <u>see</u></em>.</p></div>
    <div class="caja truco"><h4>🧠 Truco</h4>
      <p>¡Ojo con la doble "go"! <span class="en">I'm going to <u>go</u> hiking</span> — el primer "going" es la estructura del futuro, el segundo "go" es la actividad. Suena raro pero está correcto.</p></div>
    <div class="caja dato"><h4>💡 Dato curioso</h4>
      <p>Al hablar rápido, los angloparlantes dicen <em>"gonna"</em> en vez de "going to": <em>I'm gonna go snorkeling</em>. Se entiende y es muy común… ¡pero en la prueba escribe siempre <strong>going to</strong>!</p></div>`,

    <p>La estructura es la misma, pero <strong>cambia el verbo be</strong> según la persona.</p>
    <div class="caja"><h4>📐 Tabla completa</h4>
      <table class="tabla">

        <tr><td>I</td><td class="en">I'm going to…</td><td class="en">I'm not going to…</td></tr>
        <tr><td>He / She / It</td><td class="en">He's going to…</td><td class="en">He isn't going to…</td></tr>
        <tr><td>We / They / You</td><td class="en">They're going to…</td><td class="en">They aren't going to…</td></tr>
      </table>
      <p>Ejemplos del libro (p. 63):<br>
      ✔️ <span class="en">He's going to go hiking.</span> ❌ <span class="en">He isn't going to go snorkeling.</span><br>
      ✔️ <span class="en">They're going to go sightseeing.</span> ❌ <span class="en">They aren't going to go to the beach.</span></p>
    </div>
    <div class="caja"><h4>🕐 Time words</h4>
      <p>Con <em>going to</em> usamos palabras de tiempo futuro: <span class="en">tomorrow</span> (mañana), <span class="en">next weekend</span> (el próximo fin de semana), <span class="en">next week / next month</span>.</p>

let estado = {
  xp:0, puntos:0, racha:0, mejorRacha:0,
  correctas:0, incorrectas:0,
  nivelActual:0, actIdx:0,

  medallas:[], inicio:null,

const TOTAL_ACTIVIDADES = NIVELES.reduce((s,n)=>s+n.actividades.length,0);
let hechas = 0;

/* ============================================================
   3. UTILIDADES
   ============================================================ */
const $ = id => document.getElementById(id);
function mezclar(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function alAzar(a){return a[Math.floor(Math.random()*a.length)];}
function norm(s){return (s||"").toLowerCase().trim().replace(/[.,!?]/g,"").replace(/[''´`]/g,"'").replace(/\s+/g," ");}

function toast(msg){
  const t=document.createElement("div");t.className="toast";t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),2600);
}
function darMedalla(id){
  if(estado.medallas.includes(id))return;
  estado.medallas.push(id);
  const m=MEDALLAS.find(x=>x.id===id);
  if(m) toast("🏅 ¡Medalla desbloqueada: "+m.nombre+"!");
}
function actualizarHUD(){
  $("stXP").textContent="⭐ "+estado.xp+" XP";
  $("stPuntos").textContent="🏆 "+estado.puntos+" pts";
  $("stRacha").textContent="🔥 "+estado.racha;
  const pct = TOTAL_ACTIVIDADES ? Math.round(hechas/TOTAL_ACTIVIDADES*100) : 0;
  $("barraProg").style.width=pct+"%";
  $("barraLabel").textContent=hechas+" / "+TOTAL_ACTIVIDADES+" actividades ("+pct+"%)";
}
function sumarAcierto(pts){
  estado.correctas++; estado.racha++; hechas++;
  estado.mejorRacha=Math.max(estado.mejorRacha,estado.racha);
  let bonus=0;
  if(estado.racha>0 && estado.racha%5===0){bonus=25;toast("🔥 ¡Racha de "+estado.racha+"! +25 XP extra");}
  estado.xp+=pts+bonus; estado.puntos+=pts*10+bonus*5;
  darMedalla("primera");
  if(estado.racha>=5)darMedalla("racha5");
  if(estado.racha>=10)darMedalla("racha10");
  actualizarHUD();
}
function sumarError(){
  estado.incorrectas++; estado.racha=0; estado.erroresNivel++; hechas++;
  const nid=NIVELES[estado.nivelActual].id;
  estado.erroresPorNivel[nid]=(estado.erroresPorNivel[nid]||0)+1;
  actualizarHUD();
}

function empezar(){
  estado.inicio = Date.now();
  $("hud").classList.remove("oculto");
  actualizarHUD();
  mapaNiveles();
}

function mapaNiveles(){
  const cards = NIVELES.map((n,i)=>{
    const listo = estado.nivelesCompletos.includes(n.id);
    const abierto = i===0 || estado.nivelesCompletos.includes(NIVELES[i-1].id);
    const cls = listo?"nivel listo":(abierto?"nivel":"nivel bloqueado");
    const marca = listo?" ✅":(abierto?"":" 🔒");
    return `<button class="${cls}" ${abierto?"":"disabled"} onclick="abrirNivel(${i})">
      <span class="icono">${abierto?n.icono:"🔒"}</span>
      <span class="txt"><strong>${n.titulo}${marca}</strong><small>${n.sub}</small></span>
    </button>`;
  }).join("");
  const todos = estado.nivelesCompletos.length===NIVELES.length;
  render(`
  <div class="card">
    <h2>🗺️ Mapa de niveles</h2>
    <p class="sub">Completa un nivel para desbloquear el siguiente.</p>
    <div class="niveles" style="margin-top:14px">${cards}</div>
    ${todos?`<div style="margin-top:16px"><button class="btn verde" onclick="pantallaFinal()">🏁 Ver mis resultados finales</button></div>`:""}

      <button class="btn gris" onclick="pantallaMedallas()">🏅 Medallas</button>
      <button class="btn gris" onclick="reiniciar()">🔄 Reiniciar todo</button>
    </div>
  </div>`);
}

function pantallaMedallas(){
  const lista = MEDALLAS.map(m=>{
    const tiene = estado.medallas.includes(m.id);
    return `<div class="medalla ${tiene?"":"off"}">${tiene?m.nombre:"🔒 "+m.nombre.replace(/^\S+\s/,"")}<br><small style="font-weight:normal">${m.cond}</small></div>`;
  }).join("");
  render(`<div class="card">
    <h2>🏅 Mis medallas</h2>
    <p class="sub">Tienes ${estado.medallas.length} de ${MEDALLAS.length}.</p>
    <div class="medallas">${lista}</div>
    <div style="margin-top:16px"><button class="btn" onclick="${estado.inicio?"mapaNiveles()":"pantallaInicio()"}">← Volver</button></div>
  </div>`);
}

  estado.nivelActual=i; estado.actIdx=0; estado.erroresNivel=0;

    <div class="flash-zona">
      <div class="flash" id="flashCard" onclick="this.classList.toggle('girada')" tabindex="0"
           onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.classList.toggle('girada')}">
        <div class="cara frente"><div class="grande">${f.frente}</div><div class="chico">👆 Toca para ver el significado</div></div>
        <div class="cara atras"><div class="grande">${f.atras}</div><div class="chico">👆 Toca para volver</div></div>
      </div>
    </div>
    <div class="flash-nav">
      <button class="btn gris" onclick="moverFlash(-1)" ${flashIdx===0?"disabled":""}>⬅️ Anterior</button>
      <button class="btn" onclick="moverFlash(1)" ${flashIdx===flashSet.length-1?"disabled":""}>Siguiente ➡️</button>
      <button class="btn naranjo" onclick="verFlashcards()">🔀 Mezclar</button>
      <button class="btn verde" onclick="siguienteActividad()">▶️ Ir a las actividades</button>
    </div>
  </div>`);
}
function moverFlash(d){ flashIdx=Math.max(0,Math.min(flashSet.length-1,flashIdx+d)); dibujarFlash(); }

/* ============================================================
   5. MOTOR DE ACTIVIDADES
   ============================================================ */
function siguienteActividad(){
  const n = NIVELES[estado.nivelActual];
  if(estado.actIdx >= n.actividades.length){ return finNivel(); }
  const act = n.actividades[estado.actIdx];
  const cab = `<p class="sub">${n.icono} ${n.titulo} · Actividad ${estado.actIdx+1} de ${n.actividades.length}</p>`;
  switch(act.tipo){
    case "mc":      actMC(act,cab); break;
    case "tf":      actTF(act,cab); break;
    case "fill":    actFill(act,cab); break;
    case "match":   actMatch(act,cab); break;
    case "orden":   actOrden(act,cab); break;
    case "memoria": actMemoria(act,cab); break;
    default:        avanzar();
  }
}
function avanzar(){ estado.actIdx++; siguienteActividad(); }

function botonSiguiente(){
  return `<div style="margin-top:14px"><button class="btn" id="btnSig" onclick="avanzar()">Siguiente ➡️</button></div>`;
}

/* ---------- Selección múltiple ---------- */
function actMC(act,cab){
  const idx = mezclar(act.opts.map((_,i)=>i));
  render(`<div class="card">${cab}
    <h2>🔤 Elige la respuesta correcta</h2>
    <p style="font-size:1.12rem;margin-top:10px">${act.p}</p>
    <div class="opciones" id="ops">
      ${idx.map(i=>`<button class="opcion" onclick="respMC(this,${i},${act.ok})">${act.opts[i]}</button>`).join("")}
    </div>
    <div id="fb"></div>
  </div>`);
  window._actMC = act;
}
function respMC(btn,elegida,correcta){
  const act = window._actMC;
  document.querySelectorAll("#ops .opcion").forEach(b=>b.disabled=true);
  if(elegida===correcta){
    btn.classList.add("correcta"); sumarAcierto(10);
    $("fb").innerHTML=`<div class="feedback bien"><strong>${alAzar(ELOGIOS_OK)}</strong>${act.bien||""}</div>`+botonSiguiente();
  }else{
    btn.classList.add("incorrecta"); sumarError();
    document.querySelectorAll("#ops .opcion").forEach(b=>{ if(b.textContent===act.opts[correcta]) b.classList.add("correcta"); });
    const porque = (act.mal && act.mal[elegida]) ? act.mal[elegida] : "";
    $("fb").innerHTML=`<div class="feedback mal"><strong>${alAzar(ELOGIOS_MAL)}</strong>
      ${porque?"❌ "+porque+"<br>":""}✅ La respuesta correcta es <strong>${act.opts[correcta]}</strong>. ${act.bien||""}</div>`+botonSiguiente();
  }
}

/* ---------- Verdadero / Falso ---------- */
function actTF(act,cab){
  render(`<div class="card">${cab}
    <h2>✅❌ ¿Verdadero o falso?</h2>
    <p style="font-size:1.12rem;margin-top:10px">${act.p}</p>
    <div class="opciones dos" id="ops">
      <button class="opcion" style="text-align:center" onclick="respTF(this,true)">✅ Verdadero</button>
      <button class="opcion" style="text-align:center" onclick="respTF(this,false)">❌ Falso</button>
    </div>
    <div id="fb"></div>
  </div>`);
  window._actTF = act;
}
function respTF(btn,val){
  const act=window._actTF;
  document.querySelectorAll("#ops .opcion").forEach(b=>b.disabled=true);
  if(val===act.ok){
    btn.classList.add("correcta"); sumarAcierto(8);
    $("fb").innerHTML=`<div class="feedback bien"><strong>${alAzar(ELOGIOS_OK)}</strong>${act.exp}</div>`+botonSiguiente();
  }else{
    btn.classList.add("incorrecta"); sumarError();
    $("fb").innerHTML=`<div class="feedback mal"><strong>${alAzar(ELOGIOS_MAL)}</strong>${act.exp}</div>`+botonSiguiente();
  }
}

/* ---------- Completar espacios ---------- */
function actFill(act,cab){
  const items = mezclar(act.items);
  window._actFill = items;
  render(`<div class="card">${cab}
    <h2>✏️ Completa las oraciones</h2>
    <p class="sub">Escribe la palabra que falta. Usa el banco de palabras como ayuda.</p>
    <div class="banco">${mezclar(act.banco).map(w=>`<span class="chip">${w}</span>`).join("")}</div>
    ${items.map((it,i)=>`<div class="frase">${i+1}. ${it.frase.replace("___",`<input type="text" id="f${i}" aria-label="Respuesta ${i+1}" autocomplete="off">`)}
      <span id="mark${i}"></span></div>`).join("")}
    <button class="btn verde" onclick="respFill()">Revisar ✔️</button>
    <div id="fb"></div>
  </div>`);
}
function respFill(){
  const items = window._actFill;
  let ok=0, detalle="";
  items.forEach((it,i)=>{
    const inp=$("f"+i); if(!inp) return;
    inp.disabled=true;
    const acepta=(it.acepta||[it.ok]).map(norm);
    if(!acepta.includes(norm(it.ok))) acepta.push(norm(it.ok));
    const bien = acepta.includes(norm(inp.value));
    inp.style.borderColor = bien ? "#2e7d32" : "#c62828";
    inp.style.background = bien ? "#e8f5e9" : "#ffebee";
    $("mark"+i).innerHTML = bien ? " ✅" : ` ❌ → <strong style="color:#2e7d32">${it.ok}</strong>`;
    if(bien) ok++; else detalle += `<li>${it.frase.replace("___","<strong>"+it.ok+"</strong>")}</li>`;
  });
  const total=items.length;
  if(ok===total){ sumarAcierto(12); }
  else { if(ok>0){estado.xp+=ok*3;estado.puntos+=ok*20;} sumarError(); }
  actualizarHUD();
  $("fb").innerHTML = ok===total
    ? `<div class="feedback bien"><strong>${alAzar(ELOGIOS_OK)}</strong>¡${ok}/${total} correctas! Dominaste este ejercicio.</div>`+botonSiguiente()
    : `<div class="feedback mal"><strong>Obtuviste ${ok}/${total}</strong>Repasa estas oraciones:<ul>${detalle}</ul></div>`+botonSiguiente();
}

/* ---------- Emparejar ---------- */
let matchSel=null, matchOk=0, matchTotal=0, matchFallos=0;
function actMatch(act,cab){
  matchSel=null; matchOk=0; matchFallos=0; matchTotal=act.pares.length;
  const izq = mezclar(act.pares.map((p,i)=>({t:p[0],i})));
  const der = mezclar(act.pares.map((p,i)=>({t:p[1],i})));
  render(`<div class="card">${cab}
    <h2>🔗 ${act.titulo}</h2>
    <p class="sub">Toca una tarjeta de la izquierda y luego su pareja a la derecha.</p>
    <div class="match" style="margin-top:12px">
      <div class="col">${izq.map(o=>`<button class="mitem" data-lado="a" data-i="${o.i}" onclick="clicMatch(this)">${o.t}</button>`).join("")}</div>
      <div class="col">${der.map(o=>`<button class="mitem" data-lado="b" data-i="${o.i}" onclick="clicMatch(this)">${o.t}</button>`).join("")}</div>
    </div>
    <div id="fb"></div>
  </div>`);
}
function clicMatch(btn){
  if(btn.classList.contains("ok"))return;
  if(!matchSel){
    if(btn.dataset.lado!=="a"){ btn.classList.add("err"); setTimeout(()=>btn.classList.remove("err"),300); return; }
    document.querySelectorAll(".mitem.sel").forEach(b=>b.classList.remove("sel"));
    btn.classList.add("sel"); matchSel=btn; return;
  }
  if(btn.dataset.lado==="a"){ matchSel.classList.remove("sel"); btn.classList.add("sel"); matchSel=btn; return; }
  if(btn.dataset.i===matchSel.dataset.i){
    btn.classList.add("ok"); matchSel.classList.add("ok"); matchSel.classList.remove("sel");
    matchSel=null; matchOk++;
    if(matchOk===matchTotal){
      if(matchFallos===0){ sumarAcierto(15); $("fb").innerHTML=`<div class="feedback bien"><strong>${alAzar(ELOGIOS_OK)}</strong>¡Todos los pares correctos y sin errores! 🎯</div>`+botonSiguiente(); }
      else { sumarError(); $("fb").innerHTML=`<div class="feedback mal"><strong>¡Completado!</strong>Uniste todos los pares, pero con ${matchFallos} intento(s) fallido(s). Repasa esas palabras.</div>`+botonSiguiente(); }
    }
  }else{
    matchFallos++;
    btn.classList.add("err"); setTimeout(()=>btn.classList.remove("err"),320);
    matchSel.classList.remove("sel"); matchSel=null;
  }
}

/* ---------- Ordenar palabras ---------- */
let ordenActual=[];
function actOrden(act,cab){
  ordenActual=[];
  window._actOrden=act;
  render(`<div class="card">${cab}
    <h2>🧩 ${act.titulo}</h2>
    <p class="sub">Toca las palabras en el orden correcto. Toca una palabra de la zona azul para devolverla.</p>
    <div class="orden-zona" id="zona"></div>
    <div class="banco" id="pool" style="margin-top:12px">
      ${mezclar(act.palabras).map((w,i)=>`<button class="palabra" data-w="${w}" onclick="tomarPalabra(this)">${w}</button>`).join("")}
    </div>
    <button class="btn verde" onclick="respOrden()">Revisar ✔️</button>
    <div id="fb"></div>
  </div>`);
}
function tomarPalabra(btn){
  const w=btn.dataset.w; ordenActual.push(w); btn.remove();
  const z=$("zona");
  const el=document.createElement("button");
  el.className="palabra"; el.textContent=w; el.dataset.w=w;
  el.onclick=()=>{ const k=ordenActual.lastIndexOf(w); if(k>-1)ordenActual.splice(k,1); el.remove();
    const p=document.createElement("button"); p.className="palabra"; p.dataset.w=w; p.textContent=w; p.onclick=()=>tomarPalabra(p); $("pool").appendChild(p); };
  z.appendChild(el);
}
function respOrden(){
  const act=window._actOrden;
  const usuario=ordenActual.join(" ");
  const bien = norm(usuario)===norm(act.ok);
  if(bien){ sumarAcierto(12);
    $("fb").innerHTML=`<div class="feedback bien"><strong>${alAzar(ELOGIOS_OK)}</strong>"${act.ok.replace(" ?","?").replace(" .",".")}" ✅<br>${act.exp}</div>`+botonSiguiente();
  }else{ sumarError();
    $("fb").innerHTML=`<div class="feedback mal"><strong>${alAzar(ELOGIOS_MAL)}</strong>
      Tu orden: <em>${usuario||"(vacío)"}</em><br>
      ✅ Correcto: <strong>${act.ok.replace(" ?","?").replace(" .",".")}</strong><br>${act.exp}</div>`+botonSiguiente();
  }
  document.querySelectorAll("#pool .palabra, #zona .palabra").forEach(b=>b.disabled=true);
}

/* ---------- Memorama ---------- */
let memVolteadas=[], memOk=0, memIntentos=0, memBloqueo=false;
function actMemoria(act,cab){
  memVolteadas=[]; memOk=0; memIntentos=0; memBloqueo=false;
  const cartas = mezclar(act.pares.flatMap((p,i)=>[{t:p[0],i},{t:p[1],i}]));
  render(`<div class="card">${cab}
    <h2>🧠 ${act.titulo}</h2>
    <p class="sub">Voltea dos tarjetas y encuentra las parejas English–Español.</p>
    <div class="match" id="mem" style="grid-template-columns:repeat(4,1fr);margin-top:12px">
      ${cartas.map((c,k)=>`<button class="mitem" style="text-align:center;min-height:64px" data-i="${c.i}" data-k="${k}" onclick="clicMem(this)">❔</button>`).join("")}
    </div>
    <div id="fb"></div>
  </div>`);
  window._memCartas = cartas;
  window._memTotal = act.pares.length;
}
function clicMem(btn){
  if(memBloqueo||btn.classList.contains("ok")||memVolteadas.includes(btn))return;
  const c = window._memCartas[+btn.dataset.k];
  btn.textContent=c.t; btn.classList.add("sel");
  memVolteadas.push(btn);
  if(memVolteadas.length===2){
    memIntentos++;
    const [a,b]=memVolteadas;
    if(a.dataset.i===b.dataset.i){
      a.classList.remove("sel");b.classList.remove("sel");
      a.classList.add("ok");b.classList.add("ok");
      memVolteadas=[]; memOk++;
      if(memOk===window._memTotal){
        const perfecto = memIntentos<=window._memTotal+2;
        if(perfecto){ sumarAcierto(15); $("fb").innerHTML=`<div class="feedback bien"><strong>${alAzar(ELOGIOS_OK)}</strong>¡Memorama completo en ${memIntentos} intentos! Excelente memoria. 🧠</div>`+botonSiguiente(); }
        else { sumarAcierto(8); $("fb").innerHTML=`<div class="feedback bien"><strong>¡Completado!</strong>Lo lograste en ${memIntentos} intentos. Repasa el vocabulario para ir más rápido.</div>`+botonSiguiente(); }
      }
    }else{
      memBloqueo=true;
      setTimeout(()=>{ memVolteadas.forEach(x=>{x.textContent="❔";x.classList.remove("sel")}); memVolteadas=[]; memBloqueo=false; },800);
    }
  }
}

/* ============================================================
   6. FIN DE NIVEL Y PANTALLA FINAL
   ============================================================ */
function finNivel(){
  const n=NIVELES[estado.nivelActual];
  if(!estado.nivelesCompletos.includes(n.id)) estado.nivelesCompletos.push(n.id);
  let bonus=50; estado.xp+=bonus; estado.puntos+=200;
  let msgPerf="";
  if(estado.erroresNivel===0){ darMedalla("perfecto"); estado.xp+=75; estado.puntos+=300; msgPerf="<p>💎 <strong>¡Nivel perfecto!</strong> Sin ningún error. +75 XP extra.</p>"; }
  if(n.id==="n1")darMedalla("nivel1");
  if(n.id==="n3")darMedalla("nivel3");
  if(n.id==="n5")darMedalla("nivel5");
  if(estado.nivelesCompletos.length===NIVELES.length)darMedalla("final");
  actualizarHUD();
  const hayMas = estado.nivelActual < NIVELES.length-1;
  render(`<div class="card" style="text-align:center">
    <div style="font-size:3rem">${estado.erroresNivel===0?"💎":"🎉"}</div>
    <h1>¡Nivel completado!</h1>
    <p class="sub">${n.titulo}</p>
    <div class="resultados">
      <div class="res"><span class="num">${n.actividades.length-estado.erroresNivel}</span><span class="lab">actividades bien</span></div>
      <div class="res"><span class="num">${estado.erroresNivel}</span><span class="lab">con errores</span></div>
      <div class="res"><span class="num">+${bonus}</span><span class="lab">XP de bonus</span></div>
    </div>
    ${msgPerf}
    <div style="margin-top:10px">
      ${hayMas?`<button class="btn verde" onclick="abrirNivel(${estado.nivelActual+1})">▶️ Siguiente nivel: ${NIVELES[estado.nivelActual+1].titulo.split("— ")[1]}</button>`:`<button class="btn verde" onclick="pantallaFinal()">🏁 Ver resultados finales</button>`}
      <button class="btn gris" onclick="mapaNiveles()">🗺️ Mapa de niveles</button>
      <button class="btn naranjo" onclick="abrirNivel(${estado.nivelActual})">🔁 Repetir este nivel</button>
    </div>
  </div>`);
}

function pantallaFinal(){
  const seg = Math.round((Date.now()-estado.inicio)/1000);
  const mm = Math.floor(seg/60), ss = seg%60;
  const total = estado.correctas+estado.incorrectas;
  const pct = total?Math.round(estado.correctas/total*100):0;
  let rango, emoji;
  if(pct>=90){rango="Unit 6 Master 👑";emoji="👑";}
  else if(pct>=75){rango="Vacation Expert 🌟";emoji="🌟";}
  else if(pct>=60){rango="Good Traveler 😃";emoji="😃";}
  else {rango="Beginner Explorer 🌱";emoji="🌱";}

  // Recomendaciones según temas más débiles
  const nombresNivel = {n1:"vocabulario de actividades (Lesson 1)",n2:"el clima y Why don't we…? / I'd rather…",
    n3:"going to con I / you",n4:"going to con he / she / we / they",
    n5:"cosas para empacar y preposiciones",n6:"preguntas Yes/No y la historia",n7:"repaso general"};
  const debiles = Object.entries(estado.erroresPorNivel).sort((a,b)=>b[1]-a[1]).filter(e=>e[1]>0).slice(0,3);
  const reco = debiles.length
    ? `<ul>${debiles.map(([id,e])=>`<li>Repasa <strong>${nombresNivel[id]}</strong> — tuviste ${e} error(es) ahí.</li>`).join("")}</ul>`
    : "<p>¡No tuviste temas débiles! Solo repasa las flashcards antes de la prueba. 🎯</p>";

  const meds = MEDALLAS.filter(m=>estado.medallas.includes(m.id)).map(m=>`<div class="medalla">${m.nombre}</div>`).join("") || "<p class='sub'>Aún sin medallas.</p>";

  render(`<div class="card" style="text-align:center">
    <div style="font-size:3.4rem">${emoji}</div>
    <h1>¡Terminaste la Unit 6!</h1>
    <p class="sub">Tu rango: <strong>${rango}</strong></p>
    <div class="resultados">
      <div class="res"><span class="num">${estado.puntos}</span><span class="lab">puntos</span></div>
      <div class="res"><span class="num">${estado.xp}</span><span class="lab">XP</span></div>
      <div class="res"><span class="num">${pct}%</span><span class="lab">de logro</span></div>
      <div class="res"><span class="num">${estado.correctas}</span><span class="lab">correctas</span></div>
      <div class="res"><span class="num">${estado.incorrectas}</span><span class="lab">con errores</span></div>
      <div class="res"><span class="num">${estado.mejorRacha}</span><span class="lab">mejor racha 🔥</span></div>
      <div class="res"><span class="num">${mm}:${String(ss).padStart(2,"0")}</span><span class="lab">tiempo</span></div>
      <div class="res"><span class="num">${estado.nivelesCompletos.length}/${NIVELES.length}</span><span class="lab">niveles</span></div>
    </div>
    <div class="caja resumen" style="text-align:left"><h4>📚 Recomendaciones para estudiar</h4>${reco}</div>
    <div class="caja" style="text-align:left"><h4>🏅 Medallas obtenidas</h4><div class="medallas">${meds}</div></div>
    <div style="margin-top:14px">
      <button class="btn verde" onclick="reiniciar()">🔄 Volver a jugar</button>
      <button class="btn gris" onclick="mapaNiveles()">🗺️ Mapa de niveles</button>
    </div>
  </div>`);
}

function reiniciar(){
  estado = {xp:0,puntos:0,racha:0,mejorRacha:0,correctas:0,incorrectas:0,nivelActual:0,actIdx:0,
            nivelesCompletos:[],erroresNivel:0,medallas:[],inicio:null,erroresPorNivel:{}};
  hechas=0; actualizarHUD(); pantallaInicio();
}

/* ---- Arranque ---- */
pantallaInicio();
</script>
</body>
</html>
