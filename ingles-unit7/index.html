<style>
:root{
  --brand:#16A34A; --brand-d:#0F7A37; --brand-l:#DCFCE7;
  --ink:#12241A; --ink-2:#4A5D53; --line:#D8E6DD;
  --bg:#F2F8F4; --card:#FFFFFF;
  --ok:#16A34A; --ok-bg:#DCFCE7;
  --no:#DC2626; --no-bg:#FEE2E2;
  --gold:#F59E0B; --violet:#7C3AED; --blue:#2563EB;
  --r:18px; --sh:0 4px 18px rgba(16,60,35,.10);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font); background:var(--bg); color:var(--ink);
  font-size:17px; line-height:1.55; min-height:100vh;
}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* ---------- Layout ---------- */
.wrap{max-width:860px;margin:0 auto;padding:14px 14px 90px}
.hidden{display:none !important}

/* ---------- Topbar ---------- */
#topbar{
  position:sticky;top:0;z-index:50;background:rgba(242,248,244,.95);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
}
.tb-in{max-width:860px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--card);
  border:1px solid var(--line);border-radius:999px;padding:5px 12px;
  font-size:14px;font-weight:700;box-shadow:var(--sh)
}
.chip.xp{color:var(--violet)} .chip.pts{color:var(--brand-d)} .chip.streak{color:var(--gold)}
.bar{flex:1 1 160px;height:12px;background:#fff;border:1px solid var(--line);border-radius:999px;overflow:hidden;min-width:120px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),#4ADE80);transition:width .45s ease}
.btn-exit{background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700;color:var(--ink-2)}

/* ---------- Cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px;margin-bottom:16px}
h1{font-size:30px;line-height:1.2;margin:.2em 0 .3em}
h2{font-size:23px;margin:.2em 0 .5em}
h3{font-size:19px;margin:1.1em 0 .4em}
p{margin:.5em 0}
.muted{color:var(--ink-2)}
.small{font-size:15px}
.center{text-align:center}

/* ---------- Buttons ---------- */
.btn{
  display:inline-block;background:var(--brand);color:#fff;border:none;
  border-radius:14px;padding:14px 24px;font-weight:800;font-size:17px;
  box-shadow:0 4px 0 var(--brand-d);transition:transform .08s, box-shadow .08s
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brand-d)}
.btn.sec{background:#fff;color:var(--brand-d);border:2px solid var(--brand);box-shadow:0 4px 0 #C9E9D5}
.btn.ghost{background:#fff;color:var(--ink-2);border:1px solid var(--line);box-shadow:none;font-weight:700}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}

/* ---------- Welcome ---------- */
.hero{
  background:linear-gradient(150deg,var(--brand),#0EA5E9);
  color:#fff;border-radius:22px;padding:28px 22px;text-align:center;box-shadow:var(--sh)
}
.hero h1{color:#fff;margin:.1em 0}
.hero .emoji{font-size:56px;line-height:1}
.hero p{color:#EAFBF1}
.pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.pill{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}

/* ---------- Level map ---------- */
.levels{display:grid;gap:12px}
@media(min-width:640px){.levels{grid-template-columns:1fr 1fr}}
.lvl{
  display:flex;gap:14px;align-items:center;text-align:left;width:100%;
  background:var(--card);border:2px solid var(--line);border-radius:var(--r);
  padding:14px;box-shadow:var(--sh);transition:transform .1s,border-color .1s
}
.lvl:hover:not([disabled]){transform:translateY(-2px);border-color:var(--brand)}
.lvl[disabled]{opacity:.55;filter:grayscale(.6)}
.lvl .ic{font-size:34px;flex:0 0 auto;width:56px;height:56px;display:grid;place-items:center;background:var(--brand-l);border-radius:16px}
.lvl .tx{flex:1;min-width:0}
.lvl .tx b{display:block;font-size:17px}
.lvl .tx span{font-size:14px;color:var(--ink-2);display:block}
.stars{font-size:15px;letter-spacing:1px;color:var(--gold)}

/* ---------- Teoría ---------- */
.box{border-radius:14px;padding:14px 16px;margin:12px 0;border:1px solid var(--line)}
.box.res{background:#EFF6FF;border-color:#BFDBFE}
.box.ej{background:#FFF7ED;border-color:#FED7AA}
.box.dato{background:#F5F3FF;border-color:#DDD6FE}
.box h4{margin:0 0 6px;font-size:16px;text-transform:uppercase;letter-spacing:.4px}
.box ul{margin:.4em 0;padding-left:1.2em}
.box li{margin:.25em 0}
code,.k{background:var(--brand-l);border-radius:6px;padding:1px 7px;font-weight:800;color:var(--brand-d);font-family:inherit}

/* ---------- Actividades ---------- */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;font-size:14px;font-weight:700;color:var(--ink-2)}
.badge{background:var(--brand-l);color:var(--brand-d);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:800}
.q{font-size:20px;font-weight:700;margin:6px 0 14px;line-height:1.4}
.opts{display:grid;gap:10px}
.opt{
  text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;
  padding:14px 16px;font-weight:600;transition:border-color .1s,background .1s;width:100%
}
.opt:hover:not(.done){border-color:var(--brand)}
.opt.sel{border-color:var(--blue);background:#EFF6FF}
.opt.good{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--no);background:var(--no-bg)}
.opt.done{cursor:default}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fb{border-radius:14px;padding:12px 14px;margin-top:14px;font-weight:600;border:1px solid}
.fb.good{background:var(--ok-bg);border-color:#86EFAC;color:#14532D}
.fb.bad{background:var(--no-bg);border-color:#FCA5A5;color:#7F1D1D}
input[type=text]{
  font-family:inherit;font-size:18px;padding:11px 13px;border:2px solid var(--line);
  border-radius:12px;width:100%;max-width:280px;background:#fff;color:var(--ink)
}
input[type=text]:focus{outline:none;border-color:var(--brand)}
.inline-q{font-size:20px;font-weight:700;line-height:1.9}
.hintword{display:inline-flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.hintword span{background:#F1F5F9;border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:14px;font-weight:700}

/* Match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:grid;gap:8px;align-content:start}
.mit{
  background:#fff;border:2px solid var(--line);border-radius:12px;padding:11px 12px;
  font-weight:700;font-size:16px;text-align:left;width:100%
}
.mit.sel{border-color:var(--blue);background:#EFF6FF}
.mit.good{border-color:var(--ok);background:var(--ok-bg);cursor:default}
.mit.shake{animation:sk .3s}
@keyframes sk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* Order */
.ordlist{display:grid;gap:8px;margin:10px 0}
.ordit{
  display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);
  border-radius:12px;padding:10px 12px;font-weight:600;text-align:left
}
.ordit .n{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--brand-l);color:var(--brand-d);display:grid;place-items:center;font-weight:800;font-size:14px}
.ordit .mv{display:flex;gap:4px;margin-left:auto}
.mvb{border:1px solid var(--line);background:#fff;border-radius:8px;width:34px;height:34px;font-weight:800;color:var(--ink-2)}
.ordit.good{border-color:var(--ok);background:var(--ok-bg)}
.ordit.bad{border-color:var(--no);background:var(--no-bg)}

/* Flashcards */
.fcbox{perspective:1200px;margin:10px auto;max-width:460px}
.fc{
  position:relative;width:100%;min-height:190px;transform-style:preserve-3d;
  transition:transform .5s;cursor:pointer
}
.fc.flip{transform:rotateY(180deg)}
.fcf,.fcb{
  position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;
  display:grid;place-items:center;text-align:center;padding:20px;font-weight:800;
  border:2px solid var(--line);box-shadow:var(--sh)
}
.fcf{background:#fff;font-size:26px}
.fcb{background:var(--brand-l);transform:rotateY(180deg);font-size:21px;color:var(--brand-d)}
.fcnav{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:12px;flex-wrap:wrap}
.fcnav .btn{padding:10px 14px;font-size:15px}

/* Memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:520px){.mem{grid-template-columns:repeat(3,1fr)}}
.mcard{
  aspect-ratio:1/1;border:2px solid var(--line);border-radius:14px;background:var(--brand);
  color:#fff;font-weight:800;font-size:15px;display:grid;place-items:center;padding:6px;
  text-align:center;word-break:break-word;line-height:1.2
}
.mcard.open{background:#fff;color:var(--ink);border-color:var(--blue)}
.mcard.done{background:var(--ok-bg);color:var(--brand-d);border-color:var(--ok);cursor:default}

/* Toast */
#toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(120%);
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:800;
  z-index:99;transition:transform .35s;box-shadow:var(--sh);max-width:92vw;text-align:center
}
#toast.show{transform:translateX(-50%) translateY(0)}

/* Final */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
@media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--brand-d)}
.stat span{font-size:13px;color:var(--ink-2)}
.medals{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.medal{background:#FFFBEB;border:1px solid #FDE68A;border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px}
.rec{background:#FFF7ED;border:1px solid #FED7AA;border-radius:14px;padding:12px 14px;margin-top:10px}
.rec ul{margin:.3em 0;padding-left:1.2em}
footer{text-align:center;color:var(--ink-2);font-size:13px;padding:18px 0}
.timer{font-weight:900;color:var(--no)}
</style>
</head>

/* ==========================================================================
   3) ESTADO DEL JUEGO
   ========================================================================== */
const S = {
  pts:0, xp:0, streak:0, bestStreak:0,
  ok:0, bad:0, t0:null,
  lvlDone:[],       // índices completados
  lvlStars:{},      // idx -> estrellas
  lvlStats:{},      // idx -> {ok,bad}
  medals:new Set(),
  cur:null, qi:0, curOk:0, curBad:0
};
const el = id => document.getElementById(id);
const $screen = () => el('screen');

/* ---------- utilidades ---------- */
function shuffle(a){const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function norm(s){return String(s).toLowerCase().trim().replace(/[.,!?;:]+$/,'').replace(/\s+/g,' ').replace(/[’‘]/g,"'");}
function toast(msg){const t=el('toast');t.innerHTML=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1900);}
const PRAISE=["¡Excelente! 🎉","¡Muy bien! 👏","¡Perfecto! ⭐","¡Genial! 🚀","¡Lo lograste! 💪","¡Increíble! 🌟","¡Sigue así! 🔥"];
const praise=()=>PRAISE[Math.floor(Math.random()*PRAISE.length)];

/* ---------- HUD ---------- */
function hud(){
  el('uiPts').textContent=S.pts;
  el('uiXp').textContent=S.xp;
  el('uiStreak').textContent=S.streak;
  const total=NIVELES.length;
  el('uiBar').style.width=Math.round(S.lvlDone.length/total*100)+'%';
}
function award(base){
  let g=base;
  if(S.streak>=3) g+=5;
  if(S.streak>=5) g+=10;
  S.pts+=g; S.xp+=g;
  hud();
  return g;
}
function correct(extra){
  S.ok++; S.curOk++; S.streak++;
  if(S.streak>S.bestStreak) S.bestStreak=S.streak;
  const g=award(extra||10);
  if(S.streak===3) toast("🔥 ¡Racha de 3! +5 bonus");
  if(S.streak===5) toast("🔥🔥 ¡Racha de 5! +10 bonus");
  return g;
}
function wrong(){ S.bad++; S.curBad++; S.streak=0; hud(); }

function pantallaInicio(){

/* ---------- Router de actividades ---------- */
function render(){
  const l=NIVELES[S.cur];
  if(S.qi>=l.acts.length){ return pantallaNivelCompleto(); }
  const a=l.acts[S.qi];
  const head=`<div class="qhead"><span class="badge">Nivel ${S.cur+1} · ${S.qi+1}/${l.acts.length}</span><span>${esc(l.nombre)}</span></div>`;
  const box=document.createElement('div');
  box.className='card';
  box.innerHTML=head+'<div id="body"></div>';
  $screen().innerHTML=''; $screen().appendChild(box);
  ({mc:rMC,tf:rTF,fill:rFill,match:rMatch,order:rOrder,memory:rMemory,flash:rFlash})[a.t](a,el('body'));
  window.scrollTo(0,0);
}
function next(){ S.qi++; render(); }
function btnNext(cont,label){
  const d=document.createElement('div'); d.className='btn-row';
  d.innerHTML=`<button class="btn" id="nx">${label||'Siguiente ▶'}</button>`;
  cont.appendChild(d); el('nx').onclick=next; el('nx').focus();
}

/* ---------- Selección múltiple ---------- */
function rMC(a,c){
  const idx=shuffle(a.o.map((_,i)=>i));
  c.innerHTML=`<div class="q">${a.q}</div><div class="opts" id="op"></div><div id="fb"></div>`;
  const op=el('op');
  idx.forEach(i=>{
    const b=document.createElement('button');
    b.className='opt'; b.innerHTML=esc(a.o[i]);
    b.onclick=()=>{
      op.querySelectorAll('.opt').forEach(x=>{x.classList.add('done');x.onclick=null;});
      const good = i===a.c;
      b.classList.add(good?'good':'bad');
      op.querySelectorAll('.opt').forEach((x,k)=>{ if(esc(a.o[a.c])===x.innerHTML) x.classList.add('good'); });
      if(good){ const g=correct(10); el('fb').innerHTML=`<div class="fb good">${praise()} ${a.e} <br><b>+${g} pts</b></div>`; }
      else{ wrong(); const w=(a.w&&a.w[i])?a.w[i]:''; el('fb').innerHTML=`<div class="fb bad">❌ ${w?w+'<br>':''}<b>Respuesta correcta:</b> ${esc(a.o[a.c])}. ${a.e}</div>`; }
      btnNext(c);
    };
    op.appendChild(b);
  });
}

/* ---------- Verdadero / Falso ---------- */
function rTF(a,c){
  c.innerHTML=`<div class="q">${a.q}</div>
    <div class="tfrow" id="op">
      <button class="opt center" data-v="1">✅ True</button>
      <button class="opt center" data-v="0">❌ False</button>
    </div><div id="fb"></div>`;
  el('op').querySelectorAll('.opt').forEach(b=>{
    b.onclick=()=>{
      const v=b.dataset.v==='1';
      el('op').querySelectorAll('.opt').forEach(x=>{x.classList.add('done');x.onclick=null;});
      const good = v===a.c;
      b.classList.add(good?'good':'bad');
      if(good){ const g=correct(10); el('fb').innerHTML=`<div class="fb good">${praise()} ${a.e} <br><b>+${g} pts</b></div>`; }
      else{ wrong(); el('fb').innerHTML=`<div class="fb bad">❌ La respuesta correcta es <b>${a.c?'True':'False'}</b>. ${a.e}</div>`; }
      btnNext(c);
    };
  });
}

/* ---------- Completar ---------- */
function rFill(a,c){
  const hints=(a.hint&&a.hint.length)?`<div class="hintword">${a.hint.map(h=>`<span>${esc(h)}</span>`).join('')}</div>`:'';
  c.innerHTML=`<div class="qhead"><span></span><span>✍️ Completa</span></div>
    <div class="inline-q">${a.q.replace(/___+/g,'<b style="color:var(--brand-d)">_____</b>')}</div>
    ${hints}
    <div style="margin-top:12px"><input type="text" id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escribe aquí…"></div>
    <div class="btn-row" style="justify-content:flex-start"><button class="btn" id="chk">Comprobar</button></div>
    <div id="fb"></div>`;
  const inp=el('inp'); inp.focus();
  const check=()=>{
    const val=norm(inp.value);
    if(!val) return;
    el('chk').disabled=true; inp.disabled=true;
    const good=a.a.some(x=>norm(x)===val);
    if(good){ const g=correct(10); el('fb').innerHTML=`<div class="fb good">${praise()} ${a.e} <br><b>+${g} pts</b></div>`; }
    else{ wrong(); el('fb').innerHTML=`<div class="fb bad">❌ Escribiste “${esc(inp.value)}”. <b>Respuesta correcta:</b> ${esc(a.a[0])}. ${a.e}</div>`; }
    btnNext(c);
  };
  el('chk').onclick=check;
  inp.onkeydown=e=>{ if(e.key==='Enter') check(); };
}

/* ---------- Relacionar ---------- */
function rMatch(a,c){
  const L=shuffle(a.pairs.map((p,i)=>({t:p[0],i})));
  const R=shuffle(a.pairs.map((p,i)=>({t:p[1],i})));
  c.innerHTML=`<div class="q">🔗 ${esc(a.title)}</div>
    <p class="muted small">Toca una palabra de la izquierda y luego su pareja de la derecha.</p>
    <div class="match">
      <div class="mcol" id="L">${L.map(o=>`<button class="mit" data-i="${o.i}">${esc(o.t)}</button>`).join('')}</div>
      <div class="mcol" id="R">${R.map(o=>`<button class="mit" data-i="${o.i}">${esc(o.t)}</button>`).join('')}</div>
    </div><div id="fb"></div>`;
  let sel=null, left=a.pairs.length;
  const pick=(b,side)=>{
    if(b.classList.contains('good')) return;
    if(!sel){ sel={b,side,i:b.dataset.i}; b.classList.add('sel'); return; }
    if(sel.side===side){ sel.b.classList.remove('sel'); sel={b,side,i:b.dataset.i}; b.classList.add('sel'); return; }
    if(sel.i===b.dataset.i){
      sel.b.classList.remove('sel'); sel.b.classList.add('good'); b.classList.add('good');
      const g=correct(6); left--; sel=null;
      if(left===0){ el('fb').innerHTML=`<div class="fb good">${praise()} ¡Completaste todas las parejas!</div>`; btnNext(c); }
    } else {
      wrong(); b.classList.add('shake'); sel.b.classList.add('shake');
      const s1=sel.b; setTimeout(()=>{b.classList.remove('shake');s1.classList.remove('shake');s1.classList.remove('sel');},320);
      sel=null;
      el('fb').innerHTML=`<div class="fb bad">❌ Esa pareja no corresponde. ¡Inténtalo de nuevo!</div>`;
    }
  };
  el('L').querySelectorAll('.mit').forEach(b=>b.onclick=()=>pick(b,'L'));
  el('R').querySelectorAll('.mit').forEach(b=>b.onclick=()=>pick(b,'R'));
}

/* ---------- Ordenar ---------- */
function rOrder(a,c){
  let cur=shuffle(a.items);
  if(cur.join('|')===a.items.join('|')) cur=shuffle(a.items);
  c.innerHTML=`<div class="q">🔢 ${esc(a.title)}</div>
    <p class="muted small">Usa ▲ y ▼ para mover cada elemento hasta dejarlo en el orden correcto.</p>
    <div class="ordlist" id="ol"></div>
    <div class="btn-row" style="justify-content:flex-start"><button class="btn" id="chk">Comprobar</button></div>
    <div id="fb"></div>`;
  const draw=()=>{
    el('ol').innerHTML=cur.map((t,i)=>`<div class="ordit"><span class="n">${i+1}</span><span>${esc(t)}</span>
      <span class="mv"><button class="mvb" data-d="-1" data-i="${i}" aria-label="Subir">▲</button><button class="mvb" data-d="1" data-i="${i}" aria-label="Bajar">▼</button></span></div>`).join('');
    el('ol').querySelectorAll('.mvb').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i, j=i+(+b.dataset.d);
      if(j<0||j>=cur.length) return;
      [cur[i],cur[j]]=[cur[j],cur[i]]; draw();
    });
  };
  draw();
  el('chk').onclick=()=>{
    el('chk').disabled=true;
    const rows=el('ol').querySelectorAll('.ordit');
    let hits=0;
    cur.forEach((t,i)=>{ const ok=t===a.items[i]; if(ok)hits++; rows[i].classList.add(ok?'good':'bad'); });
    rows.forEach(r=>r.querySelectorAll('.mvb').forEach(b=>b.disabled=true));
    if(hits===a.items.length){ const g=correct(15); el('fb').innerHTML=`<div class="fb good">${praise()} ¡Orden perfecto! <b>+${g} pts</b></div>`; }
    else{ wrong(); el('fb').innerHTML=`<div class="fb bad">❌ Acertaste ${hits} de ${a.items.length}. <b>Orden correcto:</b><br>${a.items.map((t,i)=>`${i+1}. ${esc(t)}`).join('<br>')}</div>`; }
    btnNext(c);
  };
}

/* ---------- Memorice ---------- */
function rMemory(a,c){
  const deck=shuffle(a.pairs.flatMap((p,i)=>[{t:p[0],i},{t:p[1],i}]));
  c.innerHTML=`<div class="q">🧠 ${esc(a.title)}</div>
    <p class="muted small">Da vuelta dos tarjetas y encuentra las parejas.</p>
    <div class="mem" id="mem">${deck.map((d,k)=>`<button class="mcard" data-i="${d.i}" data-k="${k}">?</button>`).join('')}</div>
    <div id="fb"></div>`;
  let open=[], lock=false, left=a.pairs.length;
  el('mem').querySelectorAll('.mcard').forEach((b,k)=>{
    b.onclick=()=>{
      if(lock||b.classList.contains('done')||b.classList.contains('open')) return;
      b.classList.add('open'); b.textContent=deck[k].t; open.push({b,i:b.dataset.i});
      if(open.length===2){
        lock=true;
        if(open[0].i===open[1].i){
          setTimeout(()=>{
            open.forEach(o=>{o.b.classList.remove('open');o.b.classList.add('done');});
            const g=correct(8); left--; open=[]; lock=false;
            if(left===0){ el('fb').innerHTML=`<div class="fb good">${praise()} ¡Encontraste todas las parejas!</div>`; btnNext(c); }
          },420);
        } else {
          wrong();
          setTimeout(()=>{ open.forEach(o=>{o.b.classList.remove('open');o.b.textContent='?';}); open=[]; lock=false; },850);
        }
      }
    };
  });
}

/* ---------- Flashcards ---------- */
function rFlash(a,c){
  let cards=shuffle(a.cards), i=0, seen=new Set();
  c.innerHTML=`<div class="q">🃏 ${esc(a.title)}</div>
    <p class="muted small">Toca la tarjeta para darla vuelta. Revisa todas para avanzar.</p>
    <div class="fcbox"><div class="fc" id="fc" tabindex="0" role="button" aria-label="Girar tarjeta">
      <div class="fcf" id="ff"></div><div class="fcb" id="fb2"></div></div></div>
    <div class="fcnav">
      <button class="btn ghost" id="prev">‹ Anterior</button>
      <span class="badge" id="cnt"></span>
      <button class="btn ghost" id="nxt">Siguiente ›</button>
    </div>
    <div class="fcnav"><button class="btn ghost" id="mix">🔀 Mezclar</button></div>
    <div id="fbz"></div>`;
  const fc=el('fc');
  const draw=()=>{
    fc.classList.remove('flip');
    el('ff').innerHTML=esc(cards[i][0]);
    el('fb2').innerHTML=esc(cards[i][1]);
    el('cnt').textContent=`${i+1} / ${cards.length}`;
    seen.add(cards[i][0]);
    if(seen.size===cards.length && !c._done){
      c._done=true;
      const g=award(20); S.ok++; S.curOk++;
      el('fbz').innerHTML=`<div class="fb good">🎉 ¡Revisaste todas las flashcards! <b>+${g} pts</b></div>`;
      btnNext(c,'Continuar ▶');
    }
  };
  fc.onclick=()=>fc.classList.toggle('flip');
  fc.onkeydown=e=>{ if(e.key===' '||e.key==='Enter'){e.preventDefault();fc.classList.toggle('flip');} };
  el('prev').onclick=()=>{ i=(i-1+cards.length)%cards.length; draw(); };
  el('nxt').onclick=()=>{ i=(i+1)%cards.length; draw(); };
  el('mix').onclick=()=>{ cards=shuffle(cards); i=0; draw(); toast('🔀 Tarjetas mezcladas'); };
  draw();
}

/* ---------- Nivel completo ---------- */
function pantallaNivelCompleto(){
  const i=S.cur, l=NIVELES[i];
  const tot=S.curOk+S.curBad;
  const pct=tot?Math.round(S.curOk/tot*100):100;
  const stars = pct>=90?3 : pct>=70?2 : 1;
  const prev=S.lvlStars[i]||0;
  S.lvlStars[i]=Math.max(prev,stars);
  S.lvlStats[i]={ok:S.curOk,bad:S.curBad,pct};
  if(!S.lvlDone.includes(i)) S.lvlDone.push(i);
  let bonus=50; let extra='';
  if(S.curBad===0){ bonus+=50; extra='<div class="medal">💎 ¡Nivel perfecto! +50 bonus</div>'; S.medals.add('💎 Nivel perfecto: '+l.nombre); }
  S.pts+=bonus; S.xp+=bonus; hud();
  if(S.lvlDone.length===NIVELES.length) S.medals.add('🏆 Unidad 7 completa');
  if(S.bestStreak>=8) S.medals.add('🔥 Racha de 8 o más');

  const last=S.lvlDone.length===NIVELES.length;
  $screen().innerHTML=`
  <div class="card center">
    <div style="font-size:56px">${stars===3?'🏅':stars===2?'🎉':'👍'}</div>
    <h2>¡Nivel ${i+1} completado!</h2>
    <p class="muted">${esc(l.nombre)}</p>
    <div class="stars" style="font-size:30px">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    <div class="stats">
      <div class="stat"><b>${S.curOk}</b><span>Aciertos</span></div>
      <div class="stat"><b>${S.curBad}</b><span>Errores</span></div>
      <div class="stat"><b>${pct}%</b><span>Logro</span></div>
      <div class="stat"><b>+${bonus}</b><span>Bonus nivel</span></div>
    </div>
    <div class="medals">${extra}</div>
    <div class="btn-row">
      <button class="btn ghost" id="rep">↺ Repetir nivel</button>
      <button class="btn sec" id="mapa">🗺️ Mapa</button>
      ${last?'<button class="btn" id="fin">Ver resultado final 🏆</button>':'<button class="btn" id="sig">Siguiente nivel ▶</button>'}
    </div>
  </div>`;
  el('rep').onclick=()=>abrirNivel(i);
  el('mapa').onclick=pantallaMapa;
  if(last) el('fin').onclick=pantallaFinal; else el('sig').onclick=()=>abrirNivel(i+1);
  window.scrollTo(0,0);
}

/* ---------- Pantalla final ---------- */
function pantallaFinal(){
  const tot=S.ok+S.bad;
  const pct=tot?Math.round(S.ok/tot*100):0;
  const mins=S.t0?Math.max(1,Math.round((Date.now()-S.t0)/60000)):0;
  const nivel = pct>=90?'🦅 Animal Expert' : pct>=75?'🦁 Animal Explorer' : pct>=55?'🐢 Animal Learner' : '🦥 Animal Beginner';
  if(pct>=90) S.medals.add('🦅 Animal Expert');
  if(S.bestStreak>=5) S.medals.add('🔥 Racha máxima: '+S.bestStreak);

  const debiles=Object.entries(S.lvlStats)
    .map(([i,st])=>({i:+i,...st}))
    .filter(x=>x.pct<80)
    .sort((a,b)=>a.pct-b.pct);
  const recs = debiles.length
    ? `<ul>${debiles.map(d=>`<li>Repasa <b>${esc(NIVELES[d.i].nombre)}</b> (${d.pct}% de aciertos) — ${esc(NIVELES[d.i].sub)}</li>`).join('')}</ul>`
    : `<p>¡Dominas todos los temas de la Unit 7! Repite la guía sin mirar la teoría para llegar aún más segura/o a la prueba. 💪</p>`;

  el('topbar').classList.add('hidden');
  $screen().innerHTML=`
  <div class="hero"><div class="emoji">🏆</div><h1>¡Terminaste la Unit 7!</h1><p>${nivel}</p></div>
  <div class="card">
    <h2>📊 Tus estadísticas</h2>
    <div class="stats">
      <div class="stat"><b>${S.pts}</b><span>Puntos</span></div>
      <div class="stat"><b>${S.xp}</b><span>XP</span></div>
      <div class="stat"><b>${S.ok}</b><span>Correctas</span></div>
      <div class="stat"><b>${S.bad}</b><span>Incorrectas</span></div>
      <div class="stat"><b>${pct}%</b><span>Logro</span></div>
      <div class="stat"><b>${S.bestStreak}</b><span>Mejor racha</span></div>
      <div class="stat"><b>${S.lvlDone.length}/${NIVELES.length}</b><span>Niveles</span></div>
      <div class="stat"><b>${mins}</b><span>Minutos</span></div>
    </div>
    <h3>🏅 Medallas</h3>
    <div class="medals">${[...S.medals].map(m=>`<span class="medal">${esc(m)}</span>`).join('')||'<span class="muted small">Sigue jugando para ganar medallas.</span>'}</div>
    <h3>⭐ Estrellas por nivel</h3>
    <ul class="small">${NIVELES.map((l,i)=>`<li>${l.emoji} <b>${esc(l.nombre)}</b> — ${'★'.repeat(S.lvlStars[i]||0)}${'☆'.repeat(3-(S.lvlStars[i]||0))} ${S.lvlStats[i]?`(${S.lvlStats[i].pct}%)`:''}</li>`).join('')}</ul>
    <div class="rec"><h4>📚 Recomendaciones para tu prueba</h4>${recs}</div>
    <div class="btn-row">
      <button class="btn sec" id="mapa">🗺️ Volver al mapa</button>
      <button class="btn" id="again">↺ Volver a jugar</button>
    </div>
  </div>
  <footer>${esc(window.GUIA_META.semestre)} · ${esc(window.GUIA_META.curso)} · ${esc(window.GUIA_META.unidad)}</footer>`;
  el('mapa').onclick=()=>{pantallaMapa();};
  el('again').onclick=reiniciar;
  window.scrollTo(0,0);
}

function reiniciar(){
  S.pts=0;S.xp=0;S.streak=0;S.bestStreak=0;S.ok=0;S.bad=0;S.t0=null;
  S.lvlDone=[];S.lvlStars={};S.lvlStats={};S.medals=new Set();
  S.cur=null;S.qi=0;S.curOk=0;S.curBad=0;
  hud(); pantallaInicio(); toast('↺ Todo reiniciado');
}
