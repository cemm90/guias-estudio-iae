<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detective Lector · La calle más aburrida del mundo</title>
<style>
/* ============================================================
   GUÍA DE ESTUDIO INTERACTIVA — 4° BÁSICO
   Comprensión de textos literarios
   Libro base: "La calle más aburrida del mundo" (J. I. Valenzuela)
   ============================================================ */

:root{
  --noche:#151a3a;
  --noche2:#1e2555;
  --morado:#5b3bb5;
  --morado-cl:#7c5ce0;
  --amarillo:#ffc93c;
  --amarillo-osc:#e0a500;
  --verde:#1faa59;
  --verde-cl:#d6f5e3;
  --rojo:#d93838;
  --rojo-cl:#fde0e0;
  --azul:#2563c9;
  --azul-cl:#dce8ff;
  --papel:#fffdf7;
  --texto:#22243d;
  --texto-sv:#5a5d7a;
  --borde:#e3e0d4;
  --sombra:0 6px 0 rgba(0,0,0,.12);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:"Trebuchet MS","Verdana","Segoe UI",sans-serif;
  background:var(--noche);
  background-image:
    radial-gradient(circle at 12% 18%, rgba(124,92,224,.35) 0, transparent 42%),
    radial-gradient(circle at 88% 82%, rgba(255,201,60,.18) 0, transparent 45%);
  background-attachment:fixed;
  color:var(--texto);
  min-height:100vh;
  padding:0 0 60px;
  font-size:17px;
  line-height:1.55;
}

/* ---------- BARRA SUPERIOR ---------- */
#barra{
  position:sticky;top:0;z-index:50;
  background:rgba(21,26,58,.96);
  border-bottom:3px solid var(--morado);
  padding:8px 12px;
}
#barra.oculto{display:none}
.barra-in{max-width:920px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.marcador{
  display:flex;align-items:center;gap:5px;
  background:rgba(255,255,255,.10);
  color:#fff;border-radius:12px;padding:5px 11px;
  font-weight:bold;font-size:15px;white-space:nowrap;
}
.marcador .num{color:var(--amarillo);font-size:17px}
#racha-caja.encendida{background:rgba(255,201,60,.28);box-shadow:0 0 0 2px var(--amarillo) inset}
.progreso-ext{flex:1;min-width:130px;height:16px;background:rgba(255,255,255,.15);border-radius:20px;overflow:hidden}
.progreso-int{height:100%;width:0%;border-radius:20px;background:linear-gradient(90deg,var(--verde),var(--amarillo));transition:width .45s ease}
#etiqueta-nivel{color:#cfd2ff;font-size:14px;font-weight:bold;width:100%;text-align:center}

/* ---------- CONTENEDOR ---------- */
main{max-width:920px;margin:0 auto;padding:18px 14px}
.tarjeta{
  background:var(--papel);
  border-radius:22px;
  padding:26px 24px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
  border:3px solid rgba(255,255,255,.6);
  margin-bottom:18px;
  animation:entra .35s ease;
}
@keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1{font-size:32px;line-height:1.15;color:var(--morado);margin-bottom:8px}
h2{font-size:25px;color:var(--morado);margin-bottom:10px}
h3{font-size:20px;color:var(--azul);margin:16px 0 8px}
p{margin-bottom:12px}
.sub{color:var(--texto-sv);font-size:16px}
.centro{text-align:center}

/* ---------- BOTONES ---------- */
button{font-family:inherit}
.btn{
  display:inline-block;border:none;cursor:pointer;
  background:var(--morado);color:#fff;
  font-size:19px;font-weight:bold;
  padding:14px 26px;border-radius:16px;
  box-shadow:0 5px 0 #3d2585;
  transition:transform .08s, box-shadow .08s;
  margin:6px 4px;
}
.btn:hover{background:var(--morado-cl)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #3d2585}
.btn.grande{font-size:22px;padding:17px 38px}
.btn.amarillo{background:var(--amarillo);color:#4a3200;box-shadow:0 5px 0 var(--amarillo-osc)}
.btn.amarillo:hover{background:#ffd766}
.btn.verde{background:var(--verde);box-shadow:0 5px 0 #147a3f}
.btn.gris{background:#8a8ca8;box-shadow:0 5px 0 #63657d}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.opcion:focus-visible,.par-btn:focus-visible,.palabra:focus-visible{
  outline:4px solid var(--azul);outline-offset:3px;
}

/* ---------- MAPA DE NIVELES ---------- */
.mapa{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px;margin-top:16px}
.nivel-card{
  background:#fff;border:3px solid var(--borde);border-radius:18px;
  padding:16px;text-align:left;cursor:pointer;position:relative;
  transition:transform .12s, border-color .12s;
}
.nivel-card:hover:not(.bloqueado){transform:translateY(-4px);border-color:var(--morado)}
.nivel-card.bloqueado{opacity:.55;cursor:not-allowed;background:#f0efe9}
.nivel-card.completo{border-color:var(--verde);background:var(--verde-cl)}
.nivel-emoji{font-size:34px;display:block;margin-bottom:4px}
.nivel-num{font-size:13px;font-weight:bold;color:var(--texto-sv);text-transform:uppercase;letter-spacing:1px}
.nivel-nom{font-size:19px;font-weight:bold;color:var(--morado);line-height:1.2;margin:2px 0 4px}
.nivel-hab{font-size:14px;color:var(--texto-sv)}
.candado{position:absolute;top:12px;right:14px;font-size:20px}
.estrellitas{font-size:17px;letter-spacing:2px;margin-top:6px}

/* ---------- LECCIÓN ---------- */
.caja{border-radius:16px;padding:15px 17px;margin:12px 0;border-left:7px solid}
.caja.resumen{background:var(--azul-cl);border-color:var(--azul)}
.caja.ejemplo{background:#fff6da;border-color:var(--amarillo-osc)}
.caja.dato{background:#f2e9ff;border-color:var(--morado-cl)}
.caja h4{font-size:17px;margin-bottom:5px;color:var(--texto)}
.caja p:last-child{margin-bottom:0}
.cita{font-style:italic;background:#f6f4ec;border-radius:10px;padding:10px 14px;border-left:5px solid var(--borde);margin:10px 0}

/* ---------- ACTIVIDADES ---------- */
.tipo-tag{
  display:inline-block;background:var(--morado);color:#fff;
  font-size:13px;font-weight:bold;letter-spacing:1px;text-transform:uppercase;
  padding:4px 12px;border-radius:20px;margin-bottom:12px;
}
.pregunta{font-size:21px;font-weight:bold;margin-bottom:14px;line-height:1.35}
.opciones{display:flex;flex-direction:column;gap:10px}
.opcion{
  text-align:left;background:#fff;border:3px solid var(--borde);
  border-radius:14px;padding:14px 16px;font-size:17px;cursor:pointer;
  transition:border-color .12s, background .12s;width:100%;
}
.opcion:hover:not(:disabled){border-color:var(--morado-cl);background:#faf7ff}
.opcion.correcta{border-color:var(--verde);background:var(--verde-cl)}
.opcion.incorrecta{border-color:var(--rojo);background:var(--rojo-cl)}
.opcion .letra{
  display:inline-flex;align-items:center;justify-content:center;
  width:28px;height:28px;border-radius:50%;background:var(--morado);color:#fff;
  font-weight:bold;margin-right:10px;font-size:15px;flex-shrink:0;
}
.vf-fila{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.vf-fila .opcion{width:auto;min-width:165px;text-align:center;font-size:20px;font-weight:bold}
.afirmacion{font-size:21px;background:#f6f4ec;border-radius:14px;padding:16px;margin-bottom:16px;line-height:1.4}

.feedback{border-radius:14px;padding:14px 16px;margin-top:14px;font-size:16px;animation:entra .25s}
.feedback.bien{background:var(--verde-cl);border-left:7px solid var(--verde)}
.feedback.mal{background:var(--rojo-cl);border-left:7px solid var(--rojo)}
.feedback strong{display:block;font-size:18px;margin-bottom:3px}

/* ---------- FLASHCARDS ---------- */
.flash-zona{perspective:1200px;margin:14px 0}
.flash{
  position:relative;width:100%;min-height:210px;cursor:pointer;
  transform-style:preserve-3d;transition:transform .55s;
}
.flash.girada{transform:rotateY(180deg)}
.flash-cara{
  position:absolute;inset:0;backface-visibility:hidden;
  border-radius:18px;padding:22px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
}
.flash-frente{background:linear-gradient(150deg,var(--morado),var(--morado-cl));color:#fff;font-size:22px;font-weight:bold}
.flash-dorso{background:linear-gradient(150deg,var(--amarillo),#ffe08a);color:#4a3200;font-size:19px;transform:rotateY(180deg)}
.flash-pista{font-size:14px;opacity:.85;margin-top:12px;font-weight:normal}
.flash-nav{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
.contador{font-weight:bold;color:var(--texto-sv);min-width:70px;text-align:center}

/* ---------- COMPLETAR ---------- */
.frase-completar{font-size:21px;line-height:1.9;background:#f6f4ec;border-radius:14px;padding:18px;margin-bottom:14px}
.hueco{display:inline-block;min-width:110px;border-bottom:4px dotted var(--morado);text-align:center;font-weight:bold;color:var(--morado);padding:0 6px}
.hueco.lleno{border-bottom-style:solid}
.banco{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.palabra{
  background:#fff;border:3px solid var(--borde);border-radius:12px;
  padding:10px 16px;font-size:17px;font-weight:bold;cursor:pointer;color:var(--texto);
}
.palabra:hover:not(:disabled){border-color:var(--morado);background:#faf7ff}
.palabra.usada{opacity:.35;cursor:not-allowed}

/* ---------- RELACIONAR ---------- */
.relacionar{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.col-tit{font-weight:bold;color:var(--texto-sv);font-size:14px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.par-btn{
  display:block;width:100%;text-align:left;background:#fff;
  border:3px solid var(--borde);border-radius:12px;padding:11px 13px;
  font-size:16px;cursor:pointer;margin-bottom:9px;color:var(--texto);line-height:1.3;
}
.par-btn:hover:not(:disabled){border-color:var(--morado-cl)}
.par-btn.elegido{border-color:var(--azul);background:var(--azul-cl)}
.par-btn.ok{border-color:var(--verde);background:var(--verde-cl);cursor:default}
.par-btn.error{animation:tiembla .4s}
@keyframes tiembla{0%,100%{transform:none}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* ---------- ORDENAR ---------- */
.orden-lista{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.orden-item{
  display:flex;align-items:center;gap:10px;background:#fff;
  border:3px solid var(--borde);border-radius:12px;padding:11px 13px;font-size:16px;
}
.orden-item .idx{
  width:30px;height:30px;border-radius:50%;background:var(--amarillo);color:#4a3200;
  display:flex;align-items:center;justify-content:center;font-weight:bold;flex-shrink:0;
}
.orden-item .txt{flex:1;line-height:1.3}
.flechas{display:flex;flex-direction:column;gap:3px}
.mini{background:var(--morado);color:#fff;border:none;border-radius:7px;width:34px;height:24px;cursor:pointer;font-size:13px}
.mini:disabled{opacity:.3;cursor:not-allowed}
.orden-item.ok{border-color:var(--verde);background:var(--verde-cl)}
.orden-item.no{border-color:var(--rojo);background:var(--rojo-cl)}

/* ---------- LECTURA ---------- */
.texto-lectura{
  background:#fffdf3;border:3px solid var(--borde);border-radius:16px;
  padding:20px;margin-bottom:16px;max-height:340px;overflow-y:auto;font-size:17px;line-height:1.7;
}
.texto-lectura h4{font-size:20px;color:var(--morado);margin-bottom:4px;text-align:center}
.texto-lectura .autor{text-align:center;color:var(--texto-sv);font-size:14px;margin-bottom:12px}

/* ---------- PANTALLAS DE RESULTADO ---------- */
.medalla-grande{font-size:74px;line-height:1;margin-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px;margin:18px 0}
.stat{background:#fff;border:3px solid var(--borde);border-radius:16px;padding:14px;text-align:center}
.stat .valor{font-size:29px;font-weight:bold;color:var(--morado);line-height:1.1}
.stat .etiq{font-size:13px;color:var(--texto-sv);text-transform:uppercase;letter-spacing:1px;margin-top:3px}
.medallero{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0}
.medalla{background:#fff;border:3px solid var(--amarillo);border-radius:14px;padding:9px 14px;font-size:15px;font-weight:bold}
.consejo{background:#fff6da;border-left:7px solid var(--amarillo-osc);border-radius:12px;padding:13px 16px;margin:9px 0;font-size:16px}
.cronometro{
  display:inline-block;background:var(--rojo);color:#fff;font-weight:bold;
  padding:6px 16px;border-radius:20px;font-size:19px;margin-bottom:10px;
}
.cronometro.calma{background:var(--verde)}

/* ---------- VARIOS ---------- */
.tabla-comp{width:100%;border-collapse:collapse;margin:12px 0;font-size:16px}
.tabla-comp th,.tabla-comp td{border:2px solid var(--borde);padding:9px 11px;text-align:left}
.tabla-comp th{background:var(--morado);color:#fff}
.tabla-comp tr:nth-child(even) td{background:#f6f4ec}
ul.lista{margin:0 0 12px 22px}
ul.lista li{margin-bottom:6px}
.pie{text-align:center;color:#b9bce0;font-size:14px;padding:10px}
.toast{
  position:fixed;left:50%;top:104px;transform:translateX(-50%);
  background:var(--amarillo);color:#4a3200;font-weight:bold;
  padding:11px 22px;border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.3);
  z-index:200;animation:sube 2.2s forwards;pointer-events:none;font-size:17px;
}
@keyframes sube{0%{opacity:0;transform:translate(-50%,14px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}

@media(max-width:600px){
  body{font-size:16px}
  h1{font-size:26px}
  .tarjeta{padding:20px 16px}
  .relacionar{grid-template-columns:1fr}
  .pregunta{font-size:19px}
  .btn{font-size:17px;padding:13px 20px}
}
</style>
</head>
<body>

<div id="barra" class="oculto">
  <div class="barra-in">
    <div class="marcador">🏆 <span class="num" id="m-puntos">0</span></div>
    <div class="marcador">⭐ <span class="num" id="m-xp">0</span> XP</div>
    <div class="marcador" id="racha-caja">🔥 <span class="num" id="m-racha">0</span></div>
    <div class="progreso-ext"><div class="progreso-int" id="m-barra"></div></div>
    <div id="etiqueta-nivel"></div>
  </div>
</div>

<main id="app"></main>
<div class="pie">Guía de estudio interactiva · Comprensión de textos literarios · 4° básico</div>

<script>
/* ============================================================
   1) DATOS — Todo el contenido vive aquí.
      Para ampliar la guía basta con agregar objetos a NIVELES.
   ============================================================ */

const LIBRO = {
  titulo:"La calle más aburrida del mundo",
  autor:"José Ignacio Valenzuela",
  ilustrador:"Luis San Vicente"
};

/* Textos originales complementarios (Nivel 8): sirven para practicar
   las mismas habilidades con lecturas NUEVAS, como en la prueba. */
const TEXTOS_NUEVOS = [
  {
    titulo:"El misterio de la mochila azul",
    autor:"Texto de práctica",
    cuerpo:`Camila llegó al colegio con una idea fija en la cabeza: descubrir quién se llevaba las colaciones de la sala.\n\nDesde hacía una semana, cada vez que el curso volvía del recreo, alguna mochila aparecía abierta y faltaba un pan, una manzana o una barra de cereal. Nadie decía nada, pero todos se miraban de reojo. La sala 4°B, que antes era la más alegre del segundo piso, se había vuelto un lugar silencioso y desconfiado.\n\nCamila decidió actuar. Se quedó escondida detrás de la puerta durante el recreo, con su cuaderno de tapas rojas en la mano, dispuesta a anotar todo lo que viera. Pasaron cinco minutos larguísimos. Diez. Entonces escuchó un ruido suave, como el de una hoja arrastrada por el viento.\n\nUna paloma gorda entró por la ventana que siempre quedaba abierta, caminó tranquilamente sobre los pupitres y se metió de cabeza en la mochila azul de Matías, la única que nunca se cerraba bien. Salió con medio pan en el pico y voló de vuelta al patio, sin ninguna prisa.\n\nCamila se quedó con la boca abierta. Después se rió sola, tan fuerte que la escucharon desde el pasillo.\n\nAl día siguiente, el curso puso una malla en la ventana y Matías aprendió a cerrar su mochila. La sala volvió a llenarse de risas, y Camila guardó su cuaderno de tapas rojas para el próximo caso.`,
    preguntas:[
      {tipo:"mc", pregunta:"¿Qué hacía Camila escondida detrás de la puerta?", opciones:[
        {t:"Esperaba para descubrir quién abría las mochilas.", ok:true, fb:"¡Exacto! El texto lo dice de forma explícita: se quedó escondida «dispuesta a anotar todo lo que viera»."},
        {t:"Se escondía porque no quería salir a recreo.", ok:false, fb:"No. Ella eligió quedarse por una razón: investigar el misterio de las colaciones."},
        {t:"Buscaba su cuaderno de tapas rojas.", ok:false, fb:"No: el cuaderno lo llevaba en la mano para anotar pistas."},
        {t:"Esperaba a que llegara la profesora.", ok:false, fb:"El texto nunca menciona a la profesora."}]},
      {tipo:"mc", pregunta:"¿Cómo era el ambiente de la sala 4°B ANTES de que empezaran los robos?", opciones:[
        {t:"Alegre y con confianza entre compañeros.", ok:true, fb:"¡Muy bien! El texto dice que «antes era la más alegre del segundo piso», y que después se volvió silenciosa y desconfiada."},
        {t:"Siempre fue silenciosa y desconfiada.", ok:false, fb:"Ese es el ambiente de DESPUÉS. La palabra «antes» marca el cambio."},
        {t:"Era una sala vacía y sin ventanas.", ok:false, fb:"Justamente había una ventana que quedaba siempre abierta."},
        {t:"Era una sala donde nadie se hablaba nunca.", ok:false, fb:"El texto dice que era la más alegre, así que sí se hablaban."}]},
      {tipo:"mc", pregunta:"¿Por qué la ladrona elegía siempre la mochila de Matías?", opciones:[
        {t:"Porque era la única que no se cerraba bien.", ok:true, fb:"¡Inferencia perfecta! El texto da la pista («la única que nunca se cerraba bien») y tú sacas la conclusión."},
        {t:"Porque era de color azul y a las palomas les gusta el azul.", ok:false, fb:"El texto no dice nada sobre el gusto de la paloma por los colores. Eso sería inventar."},
        {t:"Porque Matías siempre traía las mejores colaciones.", ok:false, fb:"No se menciona qué colación traía Matías comparada con las demás."},
        {t:"Porque estaba más cerca de la ventana.", ok:false, fb:"El texto no dice dónde estaba ubicada la mochila."}]},
      {tipo:"vf", afirmacion:"El culpable de las desapariciones era un compañero de curso.", ok:false, fb:"Falso: la culpable era una paloma que entraba por la ventana. ¡Igual que en el caso de Toñito, el «ladrón» era un animal!"},
      {tipo:"vf", afirmacion:"Gracias a lo que descubrió Camila, el curso pudo solucionar el problema.", ok:true, fb:"Verdadero: pusieron una malla en la ventana y Matías aprendió a cerrar su mochila. Esa es la SOLUCIÓN del relato."},
      {tipo:"mc", pregunta:"¿Qué opinión sobre Camila se puede defender MEJOR con el texto?", opciones:[
        {t:"Es perseverante, porque esperó escondida sin rendirse hasta descubrir la verdad.", ok:true, fb:"¡Esa es una opinión fundamentada! Das tu juicio Y lo respaldas con un hecho del texto."},
        {t:"Es la niña más inteligente del colegio.", ok:false, fb:"Puede que lo sea, pero el texto no la compara con nadie más: es una opinión sin respaldo."},
        {t:"Es desordenada, porque nunca cierra su mochila.", ok:false, fb:"Ojo: la mochila que no se cerraba era la de Matías, no la de Camila."},
        {t:"Es miedosa, porque se escondió detrás de la puerta.", ok:false, fb:"Se escondió para vigilar, no por miedo. El texto muestra que era valiente."}]}
    ]
  },
  {
    titulo:"El violín del último piso",
    autor:"Texto de práctica",
    cuerpo:`En el edificio donde vivía Emilio nadie conocía al vecino del último piso. Solo sabían dos cosas: que se llamaba don Abelardo y que todas las noches, a las nueve en punto, tocaba el violín.\n\nAl principio, la música molestaba. La señora del segundo golpeaba el techo con una escoba. El papá de Emilio suspiraba y subía el volumen del televisor. Emilio, en cambio, apagaba la luz de su pieza, se acostaba y escuchaba. Le parecía que el violín contaba historias tristes de lugares lejanos.\n\nUna noche de invierno, la música no sonó. Tampoco la noche siguiente, ni la otra. El edificio quedó en un silencio raro, incómodo, como un zapato que aprieta.\n\nAl cuarto día Emilio subió los seis pisos y golpeó la puerta. Don Abelardo abrió despacio. Era un hombre muy delgado, de manos temblorosas y ojos cansados.\n\n—Se me rompió una cuerda —dijo el anciano— y ya no veo bien para cambiarla.\n\nEmilio bajó corriendo, juntó a tres vecinos y esa misma tarde alguien consiguió una cuerda nueva en el centro. A las nueve en punto, el violín volvió a sonar.\n\nEsa noche, por primera vez, nadie golpeó el techo con una escoba. Al contrario: la señora del segundo abrió su ventana para escuchar mejor.`,
    preguntas:[
      {tipo:"mc", pregunta:"¿En qué lugar (ambiente) ocurre principalmente la historia?", opciones:[

    <li>Lee la oración completa antes y después. ¡Ahí está la respuesta!</li>

  <p>Las preguntas de localizar suelen empezar con: <b>¿Quién…? ¿Qué…? ¿Dónde…? ¿Cuándo…? ¿Cuántos…?</b></p>

  html:`
  <p><b>Inferir</b> es descubrir algo que el texto <b>no dice con todas sus letras</b>, pero que se puede deducir juntando pistas. Es exactamente lo que hace un detective.</p>
  <div class="cita">«Solo había frutas, verduras y productos de dieta» + «el ladrón se comió una galleta con crema» = <b>Filiberto no puede ser el ladrón</b>.</div>
  <p>Fíjate: el texto <b>nunca escribe</b> "Filiberto es inocente". Toñito lo <b>infiere</b> uniendo dos datos. Tú puedes hacer lo mismo en cualquier lectura.</p>
  <h3>La fórmula 🧩</h3>
  <p><b>PISTA DEL TEXTO + LO QUE YO SÉ DEL MUNDO = INFERENCIA</b></p>
  <p>Ejemplo: el texto dice que al hombre del abrigo le gotea un líquido espeso y oscuro. Yo sé que el chocolate se derrite con el calor → infiero que lleva chocolates, no algo peligroso.</p>
  <div class="caja resumen"><h4>📌 Resumen rápido</h4><p>Una buena inferencia siempre se puede <b>defender con una pista del texto</b>. Si no hay pista que la respalde, no es inferencia: es invención.</p></div>
  <div class="caja ejemplo"><h4>✏️ Ejemplo de vocabulario por contexto</h4><p>«El ladrón <b>hurtó</b> el collar». Aunque no sepas qué es "hurtar", el contexto (un robo, un collar desaparecido) te dice que significa <b>robar</b>.</p></div>
  <div class="caja dato"><h4>🤯 Dato curioso</h4><p>Toñito se equivoca dos veces al inferir (con Filiberto y con Morgana). ¡Eso también enseña algo: una inferencia hay que comprobarla antes de acusar a alguien!</p></div>`

  html:`
  <p>En una narración, las cosas no pasan porque sí. Una acción provoca otra, como fichas de dominó cayendo.</p>
  <ul class="lista">
    <li><b>CAUSA:</b> por qué pasó algo. Responde a <b>¿Por qué?</b></li>
    <li><b>CONSECUENCIA:</b> qué pasó después por culpa de eso. Responde a <b>¿Qué pasó entonces?</b></li>
  </ul>
  <div class="cita"><b>Causa:</b> Lulú no había comido y tenía hambre. → <b>Consecuencia:</b> entró por la ventana atraída por el olor de las galletas.</div>
  <p>Cuidado: dos cosas que ocurren seguidas no siempre son causa y consecuencia. Pregúntate: <i>si lo primero no hubiera pasado, ¿lo segundo igual habría ocurrido?</i></p>
  <div class="caja resumen"><h4>📌 Resumen rápido</h4><p>Palabras que anuncian causa: <b>porque, ya que, debido a</b>. Palabras que anuncian consecuencia: <b>por eso, entonces, así que, por lo tanto</b>.</p></div>
  <div class="caja ejemplo"><h4>✏️ Ejemplo del libro</h4><p><b>Causa:</b> Lulú golpea el bote de helado. → <b>Consecuencia inmediata:</b> se escucha «¡pum!». → <b>Consecuencia siguiente:</b> doña Isolina sale de la ducha y descubre el robo.</p></div>
  <div class="caja dato"><h4>🤯 Dato curioso</h4><p>¡Todo el libro es una cadena de consecuencias que empieza por unas galletas! Por eso Toñito dice: «La culpa la tienen las galletas».</p></div>`

 id:7, emoji:"⚖️", nombre:"Juez Justo", habilidad:"Opinar con fundamento en el texto",

  titulo:"Opinar bien: mi idea + una prueba del texto",
  html:`
  <p>Opinar <b>no</b> es decir "porque sí" o "porque me gusta". En una prueba de Lenguaje, una buena opinión tiene <b>dos partes</b>:</p>
  <div class="cita"><b>1) Lo que pienso</b> + <b>2) Un hecho del texto que lo demuestra</b></div>
  <table class="tabla-comp">
    <tr><th>❌ Opinión floja</th><th>✅ Opinión fundamentada</th></tr>
    <tr><td>«Toñito estuvo mal.»</td><td>«Toñito estuvo mal, <b>porque entró a la casa de Filiberto por la ventana sin permiso</b>, y eso es meterse en la propiedad de otra persona.»</td></tr>
    <tr><td>«Lulú es mala.»</td><td>«Lulú no es mala, <b>porque el texto explica que se lleva las cosas por instinto cuando tiene hambre</b>, no para hacer daño.»</td></tr>
  </table>
  <h3>Palabras que ayudan a fundamentar 🗝️</h3>
  <p><i>porque… · ya que… · el texto dice que… · esto se nota cuando… · un ejemplo es…</i></p>
  <div class="caja resumen"><h4>📌 Resumen rápido</h4><p>Puedes opinar lo que quieras, pero tienes que <b>defenderlo con el texto</b>. Si no encuentras la parte que lo demuestra, tal vez la opinión no se sostiene.</p></div>
  <div class="caja ejemplo"><h4>✏️ Ejemplo completo</h4><p><b>Pregunta:</b> ¿Te parece bien que Toñito sospechara de Filiberto solo porque no sonríe?<br><b>Respuesta:</b> No me parece bien, porque el texto explica que Filiberto dejó de reír cuando su esposa se fue con sus hijos. Estar triste no convierte a nadie en ladrón.</p></div>
  <div class="caja dato"><h4>🤯 Dato curioso</h4><p>En estas preguntas <b>no hay una sola respuesta correcta</b>: puedes decir que sí o que no. Lo que se evalúa es <b>qué tan bien defiendes tu idea con el texto</b>.</p></div>`
 },

const estado = {
  puntos:0, xp:0, racha:0, mejorRacha:0,
  correctas:0, incorrectas:0,
  inicio:null,
  completos:{},          // idNivel -> {estrellas, ok, total}
  errores:{},            // idNivel -> cantidad de errores
  medallas:[],
  nivelIdx:null, actIdx:0, subIdx:0,
  lista:[], okNivel:0, totalNivel:0,
  cronoId:null
};

const app = document.getElementById('app');
const barra = document.getElementById('barra');

const FRASES_BIEN = ["¡Excelente!","¡Muy bien!","¡Correcto!","¡Eso es!","¡Detective de primera!","¡Lo lograste!","¡Perfecto!","¡Bien pensado!"];
const FRASES_MAL  = ["¡Casi!","Uy, no era esa…","No te preocupes, sigue","Revisa la pista","Casi lo tenías"];

/* ---------- utilidades ---------- */
function mezclar(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function azar(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function el(html){ app.innerHTML = html; window.scrollTo({top:0,behavior:'smooth'}); }
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(txt){
  const d = document.createElement('div');
  d.className = 'toast'; d.textContent = txt;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(), 2200);
}
function tiempoTexto(ms){
  const s = Math.round(ms/1000);
  const m = Math.floor(s/60);
  return m + " min " + String(s%60).padStart(2,'0') + " s";
}

/* ---------- marcador ---------- */
function pintarBarra(){
  document.getElementById('m-puntos').textContent = estado.puntos;
  document.getElementById('m-xp').textContent = estado.xp;
  document.getElementById('m-racha').textContent = estado.racha;
  document.getElementById('racha-caja').classList.toggle('encendida', estado.racha>=3);
  let pct = 0, etiqueta = "";
  if(estado.nivelIdx!==null){
    const n = NIVELES[estado.nivelIdx];
    pct = Math.round((estado.actIdx / estado.lista.length)*100);
    etiqueta = "Nivel " + n.id + " · " + n.nombre + " — actividad " + Math.min(estado.actIdx+1, estado.lista.length) + " de " + estado.lista.length;
  }else{
    const hechos = Object.keys(estado.completos).length;
    pct = Math.round((hechos/NIVELES.length)*100);
    etiqueta = hechos + " de " + NIVELES.length + " niveles completados";
  }
  document.getElementById('m-barra').style.width = pct + "%";
  document.getElementById('etiqueta-nivel').textContent = etiqueta;
}

function sumarAcierto(base){
  const mult = (estado.nivelIdx!==null && NIVELES[estado.nivelIdx].esDesafio) ? 2 : 1;
  let pts = base*mult;
  estado.racha++;
  if(estado.racha > estado.mejorRacha) estado.mejorRacha = estado.racha;
  if(estado.racha>0 && estado.racha%5===0){
    pts += 25;
    toast("🔥 ¡Racha de " + estado.racha + "! +25 puntos");
    ganarMedalla("🔥 Racha de " + estado.racha);
  }
  estado.puntos += pts; estado.xp += 10*mult; estado.correctas++;
  estado.okNivel++;
  pintarBarra();
}
function sumarError(){
  estado.racha = 0; estado.incorrectas++;
  const id = NIVELES[estado.nivelIdx].id;
  estado.errores[id] = (estado.errores[id]||0)+1;
  pintarBarra();
}
function ganarMedalla(m){
  if(!estado.medallas.includes(m)){ estado.medallas.push(m); }
}

  barra.classList.add('oculto');
  el(`

function empezar(){
  estado.inicio = Date.now();
  barra.classList.remove('oculto');
  pantallaMapa();
}

function pantallaMapa(){
  estado.nivelIdx = null;
  pintarBarra();
  const hechos = Object.keys(estado.completos).length;
  let cards = "";
  NIVELES.forEach((n,i)=>{
    const done = estado.completos[n.id];
    const bloqueado = i>0 && !estado.completos[NIVELES[i-1].id];
    let estrellas = "";
    if(done){
      estrellas = "<div class='estrellitas'>" + "⭐".repeat(done.estrellas) + "☆".repeat(3-done.estrellas) +
                  " <span class='sub' style='font-size:13px'>" + done.ok + "/" + done.total + "</span></div>";
    }
    cards += `
    <div class="nivel-card ${bloqueado?'bloqueado':''} ${done?'completo':''}"
         ${bloqueado?'':`onclick="iniciarNivel(${i})" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();iniciarNivel(${i})}"`}
         role="button" aria-label="Nivel ${n.id}: ${esc(n.nombre)}">
      ${bloqueado?'<span class="candado">🔒</span>':(done?'<span class="candado">✅</span>':'')}
      <span class="nivel-emoji">${n.emoji}</span>
      <div class="nivel-num">Nivel ${n.id}</div>
      <div class="nivel-nom">${esc(n.nombre)}</div>
      <div class="nivel-hab">${esc(n.habilidad)}</div>
      ${estrellas}
    </div>`;
  });
  const todos = hechos===NIVELES.length;
  el(`
  <div class="tarjeta">
    <h2>🗺️ Mapa de la investigación</h2>
    <p class="sub">Completa cada nivel para desbloquear el siguiente. Puedes repetir los niveles que ya terminaste.</p>
    <div class="mapa">${cards}</div>
    ${todos?`<div class="centro" style="margin-top:18px"><button class="btn grande verde" onclick="pantallaFinal()">Ver mi informe final 🏆</button></div>`:''}
  </div>`);
}

/* ---------- iniciar nivel ---------- */
function iniciarNivel(i){
  estado.nivelIdx = i; estado.actIdx = 0; estado.subIdx = 0;
  estado.okNivel = 0;
  const n = NIVELES[i];
  // Las fichas (flashcards) van primero; el resto se mezcla en cada partida.
  const flash = n.actividades.filter(a=>a.tipo==='flash');
  const resto = n.actividades.filter(a=>a.tipo!=='flash');
  estado.lista = n.esDesafio ? mezclar(resto) : flash.concat(mezclar(resto));
  // total de "respuestas" posibles del nivel (para las estrellas)
  estado.totalNivel = estado.lista.reduce((s,a)=>s+puntosPosibles(a),0);
  pantallaLeccion();
}
function puntosPosibles(a){
  switch(a.tipo){
    case 'mc': case 'vf': return 1;
    case 'completar': return a.huecos.length;
    case 'relacionar': return a.pares.length;
    case 'ordenar': return a.items.length;
    case 'lectura': return TEXTOS_NUEVOS[a.textoIdx].preguntas.length;
    default: return 0;
  }
}

function pantallaLeccion(){
  const n = NIVELES[estado.nivelIdx];
  pintarBarra();
  el(`
  <div class="tarjeta">
    <div class="tipo-tag">Nivel ${n.id} · Aprendo</div>
    <h2>${n.emoji} ${esc(n.leccion.titulo)}</h2>
    <p class="sub"><b>Habilidad:</b> ${esc(n.habilidad)}</p>
    ${n.leccion.html}
    <div class="centro" style="margin-top:18px">
      <button class="btn gris" onclick="pantallaMapa()">← Volver al mapa</button>
      <button class="btn grande" onclick="siguienteActividad()" autofocus>¡A jugar! 🎮</button>
    </div>
  </div>`);
}

function siguienteActividad(){
  pintarBarra();
  if(estado.actIdx >= estado.lista.length){ return finNivel(); }
  const a = estado.lista[estado.actIdx];
  switch(a.tipo){
    case 'mc': case 'vf': return renderPregunta(a, ()=>{ estado.actIdx++; siguienteActividad(); });
    case 'flash': return renderFlash(a);
    case 'completar': return renderCompletar(a);
    case 'relacionar': return renderRelacionar(a);
    case 'ordenar': return renderOrdenar(a);
    case 'lectura': return renderLectura(a);
    default: estado.actIdx++; return siguienteActividad();
  }
}

/* ---------- PREGUNTAS (selección múltiple / verdadero-falso) ---------- */
function renderPregunta(p, onNext, textoHTML){
  const esVF = p.tipo==='vf';
  const opciones = esVF
    ? [{t:"✅ Verdadero", ok:p.ok===true, fb:p.fb},{t:"❌ Falso", ok:p.ok===false, fb:p.fb}]
    : mezclar(p.opciones);
  const letras = "ABCD";
  const crono = p.tiempo ? `<div class="centro"><span class="cronometro" id="crono">⏱️ ${p.tiempo}</span></div>` : '';
  el(`
  <div class="tarjeta">
    <div class="tipo-tag">${esVF?'Verdadero o Falso':'Selección múltiple'}</div>
    ${crono}
    ${textoHTML||''}
    ${esVF ? `<div class="afirmacion">${esc(p.afirmacion)}</div>` : `<div class="pregunta">${esc(p.pregunta)}</div>`}
    <div class="opciones ${esVF?'vf-fila':''}" id="ops">
      ${opciones.map((o,i)=>`<button class="opcion" data-i="${i}">${esVF?'':`<span class="letra">${letras[i]}</span>`}${esc(o.t)}</button>`).join('')}
    </div>
    <div id="fb"></div>
    <div class="centro" id="cont"></div>
  </div>`);

  const responder = (idx)=>{
    if(estado.cronoId){ clearInterval(estado.cronoId); estado.cronoId=null; }
    const botones = [...document.querySelectorAll('#ops .opcion')];
    botones.forEach(b=>b.disabled=true);
    const acertado = idx!==-1 && opciones[idx].ok;
    opciones.forEach((o,i)=>{ if(o.ok) botones[i].classList.add('correcta'); });
    if(idx!==-1 && !acertado) botones[idx].classList.add('incorrecta');
    const correcta = opciones.find(o=>o.ok);
    let msg;
    if(idx===-1){ msg = `<strong>⏰ ¡Se acabó el tiempo!</strong>La respuesta correcta era: <b>${esc(correcta.t)}</b>. ${esc(correcta.fb||'')}`; }
    else if(acertado){ msg = `<strong>${azar(FRASES_BIEN)}</strong>${esc(opciones[idx].fb||'')}`; }
    else { msg = `<strong>${azar(FRASES_MAL)}</strong>${esc(opciones[idx].fb||'')}<br><br>✅ <b>Respuesta correcta:</b> ${esc(correcta.t)}${correcta.fb?' — '+esc(correcta.fb):''}`; }
    document.getElementById('fb').innerHTML = `<div class="feedback ${acertado?'bien':'mal'}">${msg}</div>`;
    if(acertado) sumarAcierto(10); else sumarError();
    const cont = document.getElementById('cont');
    cont.innerHTML = `<button class="btn" id="btn-cont">Continuar →</button>`;
    document.getElementById('btn-cont').onclick = onNext;
    document.getElementById('btn-cont').focus();
  };

  document.querySelectorAll('#ops .opcion').forEach(b=>{
    b.onclick = ()=> responder(parseInt(b.dataset.i,10));
  });

  if(p.tiempo){
    let queda = p.tiempo;
    const c = document.getElementById('crono');
    estado.cronoId = setInterval(()=>{
      queda--;
      if(c){ c.textContent = "⏱️ " + queda; c.classList.toggle('calma', queda>10); }
      if(queda<=0){ clearInterval(estado.cronoId); estado.cronoId=null; responder(-1); }
    },1000);
  }
}

/* ---------- FLASHCARDS ---------- */
function renderFlash(a){
  const cards = mezclar(a.cards);
  let i = 0, girada = false;
  const vistas = new Set();
  function pinta(){
    el(`
    <div class="tarjeta">
      <div class="tipo-tag">Fichas de estudio</div>
      <h2>🃏 ${esc(a.titulo)}</h2>
      <p class="sub">Toca la ficha para darla vuelta. Revísalas todas antes de continuar.</p>
      <div class="flash-zona">
        <div class="flash ${girada?'girada':''}" id="ficha" tabindex="0" role="button" aria-label="Girar ficha">
          <div class="flash-cara flash-frente">${esc(cards[i].frente)}<div class="flash-pista">👆 toca para ver la respuesta</div></div>
          <div class="flash-cara flash-dorso">${esc(cards[i].dorso)}</div>
        </div>
      </div>
      <div class="flash-nav">
        <button class="btn gris" id="ant">← Anterior</button>
        <span class="contador">${i+1} / ${cards.length}</span>
        <button class="btn" id="sig">Siguiente →</button>
      </div>
      <div class="centro" style="margin-top:12px">
        <button class="btn verde" id="listo">Ya las repasé, continuar ✅</button>
      </div>
    </div>`);
    const f = document.getElementById('ficha');
    const girar = ()=>{ girada=!girada; f.classList.toggle('girada');
      if(girada && !vistas.has(i)){ vistas.add(i); estado.xp += 3; pintarBarra(); } };
    f.onclick = girar;
    f.onkeydown = e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); girar(); } };
    document.getElementById('ant').onclick = ()=>{ i=(i-1+cards.length)%cards.length; girada=false; pinta(); };
    document.getElementById('sig').onclick = ()=>{ i=(i+1)%cards.length; girada=false; pinta(); };
    document.getElementById('listo').onclick = ()=>{
      estado.puntos += 15; toast("+15 puntos por repasar 🃏");
      estado.actIdx++; siguienteActividad();
    };
  }
  pinta();
}

/* ---------- COMPLETAR ---------- */
function renderCompletar(a){
  const partes = a.frase.split('___');
  const puestas = new Array(a.huecos.length).fill(null);
  const banco = mezclar(a.banco.map((t,i)=>({t, id:i})));
  const usadas = new Set();
  function pinta(comprobado){
    let frase = "";
    partes.forEach((p,i)=>{
      frase += esc(p);
      if(i<partes.length-1){
        const v = puestas[i];
        frase += `<span class="hueco ${v!==null?'lleno':''}" data-h="${i}" tabindex="0" role="button">${v!==null?esc(v.t):'&nbsp;&nbsp;&nbsp;&nbsp;'}</span>`;
      }
    });
    el(`
    <div class="tarjeta">
      <div class="tipo-tag">Completa la frase</div>
      <p class="sub">Toca las palabras de abajo para llenar los espacios. Si te equivocas, toca el espacio para borrarlo.</p>
      <div class="frase-completar">${frase}</div>
      <div class="banco">
        ${banco.map(b=>`<button class="palabra ${usadas.has(b.id)?'usada':''}" data-b="${b.id}" ${usadas.has(b.id)?'disabled':''}>${esc(b.t)}</button>`).join('')}
      </div>
      <div id="fb"></div>
      <div class="centro" style="margin-top:14px" id="cont">
        <button class="btn" id="check" ${puestas.includes(null)?'disabled':''}>Comprobar ✔️</button>
      </div>
    </div>`);
    document.querySelectorAll('.palabra').forEach(btn=>{
      btn.onclick = ()=>{
        const idx = puestas.indexOf(null);
        if(idx===-1) return;
        const b = banco.find(x=>x.id===parseInt(btn.dataset.b,10));
        puestas[idx] = b; usadas.add(b.id); pinta(false);
      };
    });
    document.querySelectorAll('.hueco').forEach(h=>{
      const quitar = ()=>{
        const i = parseInt(h.dataset.h,10);
        if(puestas[i]){ usadas.delete(puestas[i].id); puestas[i]=null; pinta(false); }
      };
      h.onclick = quitar;
      h.onkeydown = e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); quitar(); } };
    });
    const chk = document.getElementById('check');
    if(chk) chk.onclick = ()=>{
      let ok=0;
      puestas.forEach((p,i)=>{ if(p && p.t===a.huecos[i]) ok++; });
      const perfecto = ok===a.huecos.length;
      for(let k=0;k<ok;k++) sumarAcierto(10);
      if(!perfecto) sumarError();
      document.getElementById('fb').innerHTML =
        `<div class="feedback ${perfecto?'bien':'mal'}">
          <strong>${perfecto?azar(FRASES_BIEN):'Respuesta correcta:'}</strong>
          ${perfecto?'':'<b>'+esc(a.frase.split('___').reduce((s,p,i)=>s+p+(i<a.huecos.length?'['+a.huecos[i]+']':''),''))+'</b><br><br>'}
          ${esc(a.fb||'')}
        </div>`;
      document.getElementById('cont').innerHTML = `<button class="btn" id="c2">Continuar →</button>`;
      document.getElementById('c2').onclick = ()=>{ estado.actIdx++; siguienteActividad(); };
      document.getElementById('c2').focus();
      document.querySelectorAll('.palabra').forEach(b=>b.disabled=true);
    };
  }
  pinta(false);
}

/* ---------- RELACIONAR ---------- */
function renderRelacionar(a){
  const izq = mezclar(a.pares.map((p,i)=>({t:p[0], i})));
  const der = mezclar(a.pares.map((p,i)=>({t:p[1], i})));
  const resueltos = new Set();
  let sel = null;
  el(`
  <div class="tarjeta">
    <div class="tipo-tag">Une las columnas</div>
    <h2>🔗 ${esc(a.titulo)}</h2>
    <p class="sub">Toca una tarjeta de la izquierda y luego su pareja de la derecha.</p>
    <div class="relacionar">
      <div><div class="col-tit">Columna A</div>${izq.map(x=>`<button class="par-btn" data-lado="i" data-i="${x.i}">${esc(x.t)}</button>`).join('')}</div>
      <div><div class="col-tit">Columna B</div>${der.map(x=>`<button class="par-btn" data-lado="d" data-i="${x.i}">${esc(x.t)}</button>`).join('')}</div>
    </div>
    <div id="fb"></div>
    <div class="centro" style="margin-top:14px" id="cont"></div>
  </div>`);
  const botones = [...document.querySelectorAll('.par-btn')];
  botones.forEach(b=>{
    b.onclick = ()=>{
      if(b.classList.contains('ok')) return;
      if(b.dataset.lado==='i'){
        botones.filter(x=>x.dataset.lado==='i').forEach(x=>x.classList.remove('elegido'));
        b.classList.add('elegido'); sel = b; return;
      }
      if(!sel){ b.classList.add('error'); setTimeout(()=>b.classList.remove('error'),400); return; }
      if(sel.dataset.i === b.dataset.i){
        sel.classList.remove('elegido'); sel.classList.add('ok'); b.classList.add('ok');
        sel.disabled = true; b.disabled = true;
        resueltos.add(b.dataset.i);
        sumarAcierto(10); sel = null;
        if(resueltos.size===a.pares.length){
          document.getElementById('fb').innerHTML = `<div class="feedback bien"><strong>${azar(FRASES_BIEN)}</strong>Uniste las ${a.pares.length} parejas. ¡Memoria de detective! 🕵️</div>`;
          document.getElementById('cont').innerHTML = `<button class="btn" id="c3">Continuar →</button>`;
          document.getElementById('c3').onclick = ()=>{ estado.actIdx++; siguienteActividad(); };
          document.getElementById('c3').focus();
        }
      }else{
        b.classList.add('error'); sel.classList.add('error');
        const s = sel;
        setTimeout(()=>{ b.classList.remove('error'); s.classList.remove('error'); s.classList.remove('elegido'); },420);
        sumarError(); sel = null;
      }
    };
  });
}

/* ---------- ORDENAR ---------- */
function renderOrdenar(a){
  let orden = mezclar(a.items.map((t,i)=>({t, i})));
  // evita que salga ya ordenado
  if(orden.every((o,k)=>o.i===k)) orden = orden.reverse();
  let comprobado = false;
  function pinta(){
    el(`
    <div class="tarjeta">
      <div class="tipo-tag">Ordena la secuencia</div>
      <h2>🔢 ${esc(a.titulo)}</h2>
      <p class="sub">Usa las flechas para mover cada hecho hasta dejarlos en el orden correcto.</p>
      <div class="orden-lista">
        ${orden.map((o,k)=>`
          <div class="orden-item ${comprobado?(o.i===k?'ok':'no'):''}">
            <span class="idx">${k+1}</span>
            <span class="txt">${esc(o.t)}</span>
            ${comprobado?'':`<span class="flechas">
              <button class="mini" data-up="${k}" ${k===0?'disabled':''} aria-label="Subir">▲</button>
              <button class="mini" data-dn="${k}" ${k===orden.length-1?'disabled':''} aria-label="Bajar">▼</button>
            </span>`}
          </div>`).join('')}
      </div>
      <div id="fb"></div>
      <div class="centro" id="cont">${comprobado?'':'<button class="btn" id="check">Comprobar ✔️</button>'}</div>
    </div>`);
    document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{
      const k=parseInt(b.dataset.up,10); [orden[k-1],orden[k]]=[orden[k],orden[k-1]]; pinta();
    });
    document.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>{
      const k=parseInt(b.dataset.dn,10); [orden[k+1],orden[k]]=[orden[k],orden[k+1]]; pinta();
    });
    const chk = document.getElementById('check');
    if(chk) chk.onclick = ()=>{
      const ok = orden.filter((o,k)=>o.i===k).length;
      comprobado = true;
      for(let i=0;i<ok;i++) sumarAcierto(10);
      if(ok<orden.length) sumarError();
      pinta();
      document.getElementById('fb').innerHTML =
        `<div class="feedback ${ok===orden.length?'bien':'mal'}">
          <strong>${ok===orden.length?azar(FRASES_BIEN):'Acertaste '+ok+' de '+orden.length+' posiciones'}</strong>
          El orden correcto es:<br>${a.items.map((t,i)=>(i+1)+'. '+esc(t)).join('<br>')}
        </div>`;
      document.getElementById('cont').innerHTML = `<button class="btn" id="c4">Continuar →</button>`;
      document.getElementById('c4').onclick = ()=>{ estado.actIdx++; siguienteActividad(); };
      document.getElementById('c4').focus();
    };
  }
  pinta();
}

/* ---------- LECTURA DE TEXTO NUEVO ---------- */
function renderLectura(a){
  const T = TEXTOS_NUEVOS[a.textoIdx];
  if(estado.subIdx===0 && !a._leido){
    a._leido = true;
    el(`
    <div class="tarjeta">
      <div class="tipo-tag">Texto nuevo</div>
      <div class="texto-lectura" style="max-height:none">
        <h4>${esc(T.titulo)}</h4>
        <div class="autor">${esc(T.autor)}</div>
        ${T.cuerpo.split('\n\n').map(p=>`<p>${esc(p)}</p>`).join('')}
      </div>
      <div class="centro">
        <button class="btn grande" id="ir" autofocus>Ya lo leí, ir a las preguntas →</button>
      </div>
    </div>`);
    document.getElementById('ir').onclick = ()=> renderLectura(a);
    return;
  }
  const preguntas = T.preguntas;
  if(estado.subIdx >= preguntas.length){
    estado.subIdx = 0; estado.actIdx++; return siguienteActividad();
  }
  const textoHTML = `<div class="texto-lectura">
      <h4>${esc(T.titulo)}</h4><div class="autor">Pregunta ${estado.subIdx+1} de ${preguntas.length} · puedes volver a leer 👇</div>
      ${T.cuerpo.split('\n\n').map(p=>`<p>${esc(p)}</p>`).join('')}
    </div>`;
  renderPregunta(preguntas[estado.subIdx], ()=>{ estado.subIdx++; renderLectura(a); }, textoHTML);
}

/* ---------- FIN DE NIVEL ---------- */
function finNivel(){
  const n = NIVELES[estado.nivelIdx];
  const total = Math.max(estado.totalNivel,1);
  const pct = Math.round((estado.okNivel/total)*100);
  const estrellas = pct>=90?3 : pct>=70?2 : pct>=50?1 : 0;
  const previo = estado.completos[n.id];
  if(!previo || estrellas>=previo.estrellas){
    estado.completos[n.id] = {estrellas, ok:estado.okNivel, total};
  }
  if(pct===100){ ganarMedalla("💯 " + n.nombre + " perfecto"); estado.puntos+=50; }
  if(n.id===1) ganarMedalla("🕵️ Primer caso abierto");
  if(n.id===8) ganarMedalla("📚 Lector de textos nuevos");
  if(n.esDesafio && pct>=80) ganarMedalla("🏅 Gran Detective");
  if(Object.keys(estado.completos).length===NIVELES.length) ganarMedalla("🗺️ Investigación completa");

  const msg = pct>=90 ? "¡Increíble! Dominas esta habilidad."
            : pct>=70 ? "¡Muy bien! Vas por buen camino."
            : pct>=50 ? "¡Bien! Con un repaso más quedas listo."
            : "Repasa la explicación de este nivel y vuelve a intentarlo. ¡Se puede!";
  const hayMas = estado.nivelIdx < NIVELES.length-1;
  el(`
  <div class="tarjeta centro">
    <div class="medalla-grande">${estrellas===3?'🏆':estrellas===2?'🎉':estrellas===1?'👍':'💪'}</div>
    <h2>Nivel ${n.id} completado</h2>
    <p class="sub">${esc(n.nombre)}</p>
    <div class="estrellitas" style="font-size:34px">${"⭐".repeat(estrellas)}${"☆".repeat(3-estrellas)}</div>
    <div class="stats">
      <div class="stat"><div class="valor">${estado.okNivel}/${total}</div><div class="etiq">Aciertos</div></div>
      <div class="stat"><div class="valor">${pct}%</div><div class="etiq">Logro</div></div>
      <div class="stat"><div class="valor">${estado.puntos}</div><div class="etiq">Puntaje total</div></div>
    </div>
    <p><b>${msg}</b></p>
    <div class="centro">
      <button class="btn gris" onclick="iniciarNivel(${estado.nivelIdx})">Repetir nivel 🔁</button>
      ${hayMas?`<button class="btn grande" onclick="iniciarNivel(${estado.nivelIdx+1})">Siguiente nivel →</button>`:`<button class="btn grande verde" onclick="pantallaFinal()">Ver informe final 🏆</button>`}
      <br><button class="btn gris" onclick="pantallaMapa()">🗺️ Mapa de niveles</button>
    </div>
  </div>`);
  estado.nivelIdx = null;
  pintarBarra();
}

/* ---------- PANTALLA FINAL ---------- */
function pantallaFinal(){
  estado.nivelIdx = null;
  const tiempo = tiempoTexto(Date.now()-estado.inicio);
  const totalResp = estado.correctas + estado.incorrectas;
  const pct = totalResp? Math.round((estado.correctas/totalResp)*100) : 0;
  const estrellasTot = Object.values(estado.completos).reduce((s,c)=>s+c.estrellas,0);
  const nivel = pct>=90?"🥇 Gran Detective Lector" : pct>=75?"🥈 Detective Experto" : pct>=60?"🥉 Detective en Formación" : "🔍 Aprendiz de Detective";

  // recomendaciones según los niveles con más errores
  const debiles = Object.entries(estado.errores).sort((a,b)=>b[1]-a[1]).slice(0,3).filter(x=>x[1]>0);
  const CONSEJOS = {
    1:"Vuelve al libro y haz una tabla de cada personaje con dos columnas: cómo es por fuera / cómo es por dentro.",
    2:"Elige tres escenas y dibuja o describe el lugar: qué objetos hay y qué sensación produce.",
    3:"Practica subrayando la palabra clave de la pregunta y buscándola en el texto antes de responder.",
    4:"Antes de responder pregúntate: ¿qué pista del texto respalda mi respuesta? Si no hay pista, no es inferencia.",
    5:"Practica con la fórmula: «Esto pasó PORQUE…» y «POR ESO ocurrió…».",
    6:"Cuenta cualquier cuento en cuatro partes: inicio, problema, intentos y solución.",
    7:"Escribe tus opiniones siempre en dos partes: yo pienso que… PORQUE el texto dice que…",
    8:"Lee un cuento nuevo cada día y responde tres preguntas: una de localizar, una de inferir y una de opinar.",
    9:"Repasa los niveles con menos estrellas y vuelve a intentar el desafío final."
  };
  let recos = debiles.length
    ? debiles.map(([id,c])=>{
        const n = NIVELES.find(x=>x.id==id);
        return `<div class="consejo"><b>${n.emoji} ${esc(n.habilidad)}</b> — ${c} error${c>1?'es':''}.<br>${esc(CONSEJOS[id])}</div>`;
      }).join('')
    : `<div class="consejo">🎉 ¡No tuviste errores importantes! Repasa el libro una vez más antes de la prueba y estarás listo.</div>`;

  el(`
  <div class="tarjeta centro">
    <div class="medalla-grande">🏆</div>
    <h1>¡Investigación terminada!</h1>
    <h2 style="color:var(--azul)">${nivel}</h2>
    <div class="stats">
      <div class="stat"><div class="valor">${estado.puntos}</div><div class="etiq">Puntaje</div></div>
      <div class="stat"><div class="valor">${estado.xp}</div><div class="etiq">XP</div></div>
      <div class="stat"><div class="valor">${estado.correctas}</div><div class="etiq">Aciertos</div></div>
      <div class="stat"><div class="valor">${estado.incorrectas}</div><div class="etiq">Errores</div></div>
      <div class="stat"><div class="valor">${pct}%</div><div class="etiq">Logro</div></div>
      <div class="stat"><div class="valor">${estrellasTot}/${NIVELES.length*3}</div><div class="etiq">Estrellas</div></div>
      <div class="stat"><div class="valor">${estado.mejorRacha}</div><div class="etiq">Mejor racha</div></div>
      <div class="stat"><div class="valor" style="font-size:19px">${tiempo}</div><div class="etiq">Tiempo</div></div>
    </div>
    <h3>🎖️ Medallas obtenidas</h3>
    <div class="medallero">${estado.medallas.length?estado.medallas.map(m=>`<span class="medalla">${esc(m)}</span>`).join(''):'<span class="sub">Todavía no ganas medallas… ¡vuelve a jugar!</span>'}</div>
    <h3>📋 Qué repasar antes de la prueba</h3>
    <div style="text-align:left">${recos}</div>
    <div class="centro" style="margin-top:18px">
      <button class="btn gris" onclick="pantallaMapa()">🗺️ Volver al mapa</button>
      <button class="btn grande amarillo" onclick="reiniciar()">Volver a jugar 🔁</button>
    </div>
  </div>`);
  pintarBarra();
}

function reiniciar(){
  estado.puntos=0; estado.xp=0; estado.racha=0; estado.mejorRacha=0;
  estado.correctas=0; estado.incorrectas=0; estado.completos={}; estado.errores={};
  estado.medallas=[]; estado.nivelIdx=null; estado.actIdx=0; estado.subIdx=0;
  NIVELES.forEach(n=>n.actividades.forEach(a=>{ if(a._leido) delete a._leido; }));
  estado.inicio=Date.now();
  pantallaBienvenida();
}

/* ---------- arranque ---------- */
pantallaBienvenida();
</script>
