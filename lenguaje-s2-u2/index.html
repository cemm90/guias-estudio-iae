<meta property="og:locale" content="es_CL">
<title>Guía Interactiva · Lenguaje 4° Básico · Unidad 2</title>
<style>
/* ============================================================
   ESTILOS — Guía Interactiva de Lenguaje 4° Básico
   Todo embebido, sin dependencias externas (funciona offline)
   ============================================================ */
:root{
  --morado:#6C3FB5;
  --morado-osc:#4A2680;
  --morado-claro:#EDE4FF;
  --naranjo:#FF8A3D;
  --amarillo:#FFC93C;
  --verde:#2FA84F;
  --verde-claro:#E3F7E8;
  --rojo:#E0453A;
  --rojo-claro:#FDE7E5;
  --azul:#1E88E5;
  --gris:#5B5B6B;
  --texto:#26243B;
  --fondo:#F5F1FF;
  --card:#FFFFFF;
  --sombra:0 6px 18px rgba(76,38,128,.14);
  --radio:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Trebuchet MS","Verdana","Segoe UI",sans-serif;
  background:var(--fondo);
  color:var(--texto);
  line-height:1.55;
  font-size:17px;
  padding-bottom:40px;
}
button{font-family:inherit;cursor:pointer;border:none}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--azul);outline-offset:2px}

/* ---------- Barra superior ---------- */
#barra{
  position:sticky;top:0;z-index:50;
  background:var(--morado);color:#fff;
  padding:8px 14px;box-shadow:0 3px 10px rgba(0,0,0,.2);
}
#barraTop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
#marcaBarra{font-weight:bold;font-size:15px}
#stats{display:flex;gap:14px;flex-wrap:wrap;font-size:15px;font-weight:bold}
#stats span{background:rgba(255,255,255,.16);padding:3px 10px;border-radius:20px;white-space:nowrap}
#progWrap{margin-top:7px;background:rgba(255,255,255,.25);border-radius:20px;height:14px;overflow:hidden}
#progBar{height:100%;width:0%;background:linear-gradient(90deg,var(--amarillo),var(--naranjo));border-radius:20px;transition:width .5s ease}
#progTxt{font-size:12.5px;margin-top:3px;opacity:.95}

/* ---------- Contenedor ---------- */
.wrap{max-width:840px;margin:0 auto;padding:16px}
.card{
  background:var(--card);border-radius:var(--radio);
  box-shadow:var(--sombra);padding:22px;margin-bottom:18px;
}
h1{font-size:30px;color:var(--morado-osc);line-height:1.2;margin-bottom:8px}
h2{font-size:23px;color:var(--morado-osc);margin-bottom:10px}
h3{font-size:19px;color:var(--morado);margin:16px 0 6px}
p{margin-bottom:10px}
ul,ol{margin:0 0 10px 22px}
li{margin-bottom:5px}
.centro{text-align:center}

/* ---------- Botones ---------- */
.btn{
  background:var(--morado);color:#fff;font-size:18px;font-weight:bold;
  padding:14px 26px;border-radius:14px;box-shadow:0 4px 0 var(--morado-osc);
  transition:transform .1s, box-shadow .1s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--morado-osc)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--morado-osc)}
.btn.naranjo{background:var(--naranjo);box-shadow:0 4px 0 #C9631F}
.btn.naranjo:hover{box-shadow:0 6px 0 #C9631F}
.btn.verde{background:var(--verde);box-shadow:0 4px 0 #1E7635}
.btn.verde:hover{box-shadow:0 6px 0 #1E7635}
.btn.gris{background:#8A87A0;box-shadow:0 4px 0 #63617A}
.btn.chico{font-size:15px;padding:9px 16px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* ---------- Mapa de niveles ---------- */
.nivelGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.nivelCard{
  background:#fff;border:3px solid var(--morado-claro);border-radius:var(--radio);
  padding:16px;text-align:left;transition:transform .15s, border-color .15s;
  position:relative;box-shadow:var(--sombra);
}
.nivelCard.abierto{border-color:var(--morado)}
.nivelCard.abierto:hover{transform:translateY(-4px)}
.nivelCard.bloqueado{opacity:.55;filter:grayscale(.6);cursor:not-allowed}
.nivelCard.listo{border-color:var(--verde);background:var(--verde-claro)}
.nivelCard .emo{font-size:36px;display:block;margin-bottom:4px}
.nivelCard .tit{font-weight:bold;font-size:17px;color:var(--morado-osc);display:block}
.nivelCard .sub{font-size:13.5px;color:var(--gris);display:block;margin-top:3px}
.nivelCard .est{position:absolute;top:12px;right:14px;font-size:19px}

/* ---------- Teoría ---------- */
.teoBox{background:var(--morado-claro);border-radius:14px;padding:16px;margin:12px 0}
.resumen{background:#FFF6DE;border-left:6px solid var(--amarillo);border-radius:10px;padding:13px 15px;margin:12px 0}
.dato{background:#E4F2FF;border-left:6px solid var(--azul);border-radius:10px;padding:13px 15px;margin:12px 0}
.ejemplo{background:#fff;border:2px dashed var(--naranjo);border-radius:10px;padding:11px 14px;margin:8px 0}
.textoFuente{background:#FFFDF5;border:2px solid var(--amarillo);border-radius:12px;padding:14px 16px;margin:12px 0;font-size:16px}
.poema{white-space:pre-line;font-style:italic;text-align:center;line-height:1.7;background:#FFFDF5;border:2px solid var(--amarillo);border-radius:12px;padding:16px}

/* ---------- Preguntas ---------- */
.preg{font-size:19px;font-weight:bold;margin-bottom:14px;color:var(--morado-osc)}
.contexto{background:#F3F0FF;border-radius:10px;padding:11px 14px;margin-bottom:12px;font-size:16px;white-space:pre-line}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  background:#fff;border:3px solid var(--morado-claro);border-radius:13px;
  padding:13px 16px;text-align:left;font-size:17px;color:var(--texto);
  transition:background .12s, border-color .12s;width:100%;
}
.opt:hover:not(:disabled){background:var(--morado-claro)}
.opt.ok{background:var(--verde-claro);border-color:var(--verde);font-weight:bold}
.opt.no{background:var(--rojo-claro);border-color:var(--rojo)}
.optsVF{display:flex;gap:14px;flex-wrap:wrap}
.optsVF .opt{flex:1;min-width:130px;text-align:center;font-size:20px;font-weight:bold}

/* ---------- Feedback ---------- */
.fb{margin-top:14px;padding:14px 16px;border-radius:13px;font-size:16.5px;animation:aparece .25s ease}
.fb.ok{background:var(--verde-claro);border-left:6px solid var(--verde)}
.fb.no{background:var(--rojo-claro);border-left:6px solid var(--rojo)}
.fb b{display:block;margin-bottom:4px;font-size:18px}
@keyframes aparece{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- Flashcards ---------- */
.flashArea{perspective:1200px;margin:16px 0}
.flash{
  position:relative;width:100%;min-height:210px;cursor:pointer;
  transition:transform .55s;transform-style:preserve-3d;
}
.flash.girada{transform:rotateY(180deg)}
.flashCara{
  position:absolute;inset:0;backface-visibility:hidden;
  border-radius:16px;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:22px;font-size:19px;box-shadow:var(--sombra);
}
.flashCara.frente{background:linear-gradient(135deg,var(--morado),#8E5BD6);color:#fff;font-weight:bold;font-size:21px}
.flashCara.detras{background:#fff;border:3px solid var(--verde);transform:rotateY(180deg);color:var(--texto)}
.flashNav{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:12px}

/* ---------- Relacionar ---------- */
.matchGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.matchCol{display:flex;flex-direction:column;gap:9px}
.mItem{
  background:#fff;border:3px solid var(--morado-claro);border-radius:12px;
  padding:11px 13px;font-size:15.5px;text-align:left;transition:.12s;
}
.mItem:hover:not(:disabled){background:var(--morado-claro)}
.mItem.sel{background:var(--amarillo);border-color:var(--naranjo);font-weight:bold}
.mItem.hecho{background:var(--verde-claro);border-color:var(--verde);opacity:.75;cursor:default}
.mItem.err{background:var(--rojo-claro);border-color:var(--rojo)}

/* ---------- Ordenar ---------- */
.ordList{display:flex;flex-direction:column;gap:9px;margin-bottom:12px}
.ordItem{
  background:#fff;border:3px solid var(--morado-claro);border-radius:12px;
  padding:11px 14px;display:flex;align-items:center;gap:10px;font-size:16px;
}
.ordItem .num{background:var(--morado);color:#fff;border-radius:50%;width:29px;height:29px;
  display:flex;align-items:center;justify-content:center;font-weight:bold;flex-shrink:0;font-size:15px}
.ordItem .txt{flex:1;text-align:left}
.ordBtns{display:flex;flex-direction:column;gap:3px}
.ordBtns button{background:var(--morado-claro);border-radius:7px;width:32px;height:22px;font-size:12px;color:var(--morado-osc);font-weight:bold}
.ordItem.ok{background:var(--verde-claro);border-color:var(--verde)}
.ordItem.no{background:var(--rojo-claro);border-color:var(--rojo)}

/* ---------- Completar (B/V y vocabulario) ---------- */
.hueco{display:inline-block;min-width:44px;border-bottom:4px solid var(--naranjo);text-align:center;font-weight:bold;color:var(--morado-osc)}
.palabraGrande{font-size:32px;font-weight:bold;text-align:center;margin:14px 0;letter-spacing:1px;color:var(--morado-osc)}

/* ---------- Racha / toast ---------- */
#toast{
  position:fixed;left:50%;top:78px;transform:translateX(-50%) scale(.85);
  background:var(--amarillo);color:var(--morado-osc);font-weight:bold;
  padding:11px 20px;border-radius:30px;box-shadow:var(--sombra);
  opacity:0;pointer-events:none;transition:.3s;z-index:99;font-size:17px;text-align:center;
}
#toast.ver{opacity:1;transform:translateX(-50%) scale(1)}

/* ---------- Medallas ---------- */
.medGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-top:10px}
.med{background:#fff;border:3px solid var(--amarillo);border-radius:14px;padding:12px;text-align:center;font-size:14px;box-shadow:var(--sombra)}
.med .ic{font-size:31px;display:block}
.med.gris{border-color:#DDD;opacity:.45;filter:grayscale(1)}

/* ---------- Tabla resultados ---------- */
.resGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:14px 0}
.resBox{background:var(--morado-claro);border-radius:14px;padding:14px;text-align:center}
.resBox .n{font-size:28px;font-weight:bold;color:var(--morado-osc);display:block}
.resBox .l{font-size:13.5px;color:var(--gris)}

.oculto{display:none!important}
.pie{text-align:center;font-size:13px;color:var(--gris);margin-top:18px}
.chip{display:inline-block;background:var(--morado-claro);color:var(--morado-osc);border-radius:20px;
  padding:3px 12px;font-size:13.5px;font-weight:bold;margin:0 5px 5px 0}

@media(max-width:620px){
  body{font-size:16px}
  h1{font-size:24px}
  .matchGrid{grid-template-columns:1fr}
  .wrap{padding:11px}
  .card{padding:16px}
}
</style>
</head>
<body>

<div id="barra" class="oculto">
  <div id="barraTop">
    <div id="marcaBarra">🪄 Lenguaje 4° Básico · Unidad 2</div>
    <div id="stats">
      <span id="sXP">⭐ 0 XP</span>
      <span id="sRacha">🔥 0</span>
      <span id="sNivel">🏅 Nivel 1</span>
      <button class="btn chico gris" onclick="irAlMapa()">🗺️ Mapa</button>
    </div>
  </div>
  <div id="progWrap"><div id="progBar"></div></div>
  <div id="progTxt">Progreso general: 0%</div>
</div>

<div id="toast"></div>
<div class="wrap" id="app"></div>

<script>
/* ============================================================
   1) DATOS — Contenido pedagógico y banco de ítems
   Fuente: Guía Formativa N°2, Lenguaje y Comunicación,
   4° Básico, Instituto Alonso de Ercilla (Hermanos Maristas),
   agosto 2026 + indicaciones de la profesora (Unidad 2, lecciones 1-3).
   ============================================================ */

/* Textos de la guía, reutilizados en varias actividades */
const TEXTOS = {
t1:`📜 TEXTO N°1 — "Pócima para aprobar exámenes"
Obviamente, la magia es limitada en estos casos. En principio… debes estudiar. Pero para sentirte iluminado a la hora del examen, puedes beber esta pócima que te hará sentir súper inteligente.

Ingredientes:
• 1 vaso de leche
• 1 yema de huevo
• Unas gotas de esencia de vainilla
• 2 cucharadas de azúcar
• 1 pizca de canela molida

Preparación: Coloca todos los ingredientes en una licuadora o en una batidora y bébelos con toda su espuma.`,

t2:`🥤 TEXTO N°2 — "Brebaje para adquirir una fuerza poderosa"
Si necesitas ganar algún campeonato de fútbol o simplemente quieres tener mucha energía para poder correr, saltar o sujetar a tu perro cuando lo sacas a pasear, prueba con esta antigua fórmula alquímica del mago Melisek.

Ingredientes:
• 2 cucharadas de miel de caña
• 1 taza de leche caliente
• 2 cucharadas de cacao en polvo
• 1 cucharada de crema de leche

Preparación: Coloca la miel, el cacao y la crema de leche en un tazón. Vierte la leche hirviendo sobre estos ingredientes, revuelve todo con un palito de naranjo (o uno de brochette si lo tienes más a mano) y bébelo antes de que se enfríe.`,

t3:`🧙 TEXTO N°3 — Consejos del mago
"Ustedes saben que los magos deben practicar mucho con la varita mágica. Si quieres ser un mago de verdad sigue los siguientes consejos…"

Recuerda que con la varita NO DEBES:
• Pegarle a tu mascota.
• Usarla descuidadamente, pues puedes ponérsela en un ojo a alguien.
• Hacer conjuros negativos.
• Prestársela a otro mago.
• Olvidarla en cualquier lugar.`,

poema:`Caimanes y cocodrilos
(Ana Merino)

Siempre tuve mucho lío
intentando dibujar
caimanes y cocodrilos.

Me parecen parecidos
el caimán y el cocodrilo,
y no me puedo acercar
demasiado a la gran charca
donde nadan a sus anchas
porque tienen apetito
y me podrían zampar
en tres o cuatro mordiscos.

Caimanes y cocodrilos
al dentista nunca han ido,
aunque se les caen los dientes
muchos más les han salido.

El cocodrilo, me cuentan,
puede visitar el mar
porque se guarda en la lengua
unas glándulas de sal.

Del caimán del Orinoco
me dicen que quedan pocos
y tenemos que rogar
para que tengamos más.

Si el caimán cierra la boca
sus dientes ya no se notan,
si lo hace el cocodrilo
se le verán cien colmillos.

Diferenciar no he podido
al caimán del cocodrilo;
lo mejor será esperar
los bramidos del caimán,
pues he leído en un libro
que el cocodrilo se calla
porque el silencio le agrada
y no le gusta hacer ruido.

El que canta es el caimán.`
};

/* ---- BANCO DE NIVELES ---- */
const NIVELES = [

{
 nombre:"Aprendiz de Instrucciones",
 emoji:"📋",
 sub:"Textos instructivos y normativos",

  titulo:"📋 Textos instructivos y textos normativos",
  html:`
  <p>Hay textos que <b>no cuentan historias</b>: su misión es <b>enseñarnos a hacer algo</b> o <b>decirnos cómo debemos comportarnos</b>. Se llaman <b>textos no literarios</b>.</p>
  <h3>🔧 El texto INSTRUCTIVO</h3>
  <p>Explica <b>paso a paso</b> cómo hacer una tarea o procedimiento. Su propósito comunicativo es <b>instruir</b>, es decir, enseñar a hacer algo.</p>
  <ul>
    <li>Los pasos van <b>en orden</b> (si cambias el orden, no funciona).</li>
    <li>Incluye <b>texto e imágenes</b> que complementan la información.</li>
    <li>Las instrucciones son <b>cortas y precisas</b>.</li>
    <li>Usa verbos en <b>infinitivo</b> (buscar, leer, hervir) <b>o</b> en <b>segunda persona</b> (busca, lee, hierve).</li>
  </ul>
  <div class="ejemplo"><b>Estructura típica:</b> <b>Título</b> → <b>Ingredientes o materiales</b> → <b>Preparación o pasos</b>.<br>
  Ejemplos: una receta, el manual de un juguete, las instrucciones de un experimento.</div>
  <h3>📜 El texto NORMATIVO</h3>
  <p>Entrega <b>normas o reglamentos</b>: nos dice <b>cómo actuar</b> en un lugar o situación. Su propósito es <b>regular la conducta</b>.</p>
  <div class="ejemplo">Ejemplos: reglas de convivencia, reglamento de disciplina, las leyes, los diez mandamientos, el decálogo de la sana convivencia del curso.</div>
  `,
  resumen:"El texto <b>instructivo</b> te enseña <b>CÓMO HACER</b> algo paso a paso (receta). El texto <b>normativo</b> te dice <b>CÓMO ACTUAR</b> o comportarte (reglamento).",
  dato:"🧠 Truco para no confundirte: <b>Instructivo = Instrucciones = \"hazlo así\"</b>. <b>Normativo = Normas = \"pórtate así\"</b>. ¡Los dos empiezan con la palabra que los explica!"

 ],

  {t:"mc",p:"¿De qué se trata el texto N°1?",o:["Del buen uso de la varita mágica","De un brebaje para adquirir fuerzas","De una pócima para la buena suerte","De una pócima para aprobar los exámenes"],c:3,

   exp:["No: el texto dice claramente que la leche va hirviendo.",

 teoria:{
  titulo:"🔍 Leer como un detective",
  html:`
  <p>Cuando lees, hay <b>dos tipos de información</b> que puedes encontrar:</p>
  <h3>👀 Información EXPLÍCITA</h3>
  <p>Está <b>escrita tal cual</b> en el texto. Solo tienes que <b>buscarla y copiarla</b>. Suele responder a: ¿quién?, ¿qué?, ¿cuándo?, ¿dónde?, ¿cuántos?</p>
  <div class="ejemplo">Texto: "1 taza de leche caliente". → Pregunta: ¿Cómo debe estar la leche? → <b>Caliente</b>. ¡Está escrito!</div>
  <h3>🕵️ Información IMPLÍCITA (inferencias)</h3>
  <p><b>No está escrita</b>: tú la <b>deduces</b> juntando las pistas del texto con lo que ya sabes. Las preguntas suelen decir: <i>deduce, infiere, ¿por qué?, ¿qué podría pasar?, ¿para qué?</i></p>
  <div class="ejemplo">Texto: "no me puedo acercar demasiado a la charca porque tienen apetito y me podrían zampar". → Inferencia: <b>estos animales son peligrosos</b>. El texto nunca escribió la palabra "peligroso": tú la dedujiste.</div>
  <h3>🧭 Los 3 pasos del detective</h3>
  <ol><li>Lee la pregunta con atención y subraya la palabra clave.</li>
  <li>Vuelve al texto y busca la pista (¡siempre hay una!).</li>
  <li>Descarta las alternativas que el texto no permite afirmar.</li></ol>
  `,
  resumen:"<b>Explícita</b> = está escrita, la encuentro. <b>Implícita</b> = no está escrita, la deduzco con pistas del texto + lo que ya sé.",

 },

    <li><b>Estrofa:</b> un <b>grupo de versos</b> separado por un espacio en blanco.</li>
    <li><b>Rima:</b> la <b>semejanza de sonidos</b> al final de los versos (cocodri<b>lo</b> / <b>lío</b>).</li>
    <li><b>Hablante lírico:</b> la <b>voz</b> que habla dentro del poema (¡no es la autora!).</li>
    <li><b>Autor:</b> la persona real que lo escribió. Aquí: <b>Ana Merino</b>.</li>
  </ul>

{

 teoria:{
  titulo:"✨ Lenguaje literal, figurado y figuras literarias",
  html:`
  <h3>🗣️ Lenguaje LITERAL</h3>
  <p>Las palabras significan <b>exactamente lo que dicen</b>. Es el lenguaje de las recetas, las noticias y las instrucciones.</p>
  <div class="ejemplo">"Tus dientes son blancos." → Es la verdad tal cual.</div>
  <h3>🎨 Lenguaje FIGURADO</h3>
  <p>Las palabras significan <b>algo distinto</b> de lo que dicen: hay que interpretarlas. Es el lenguaje de la poesía.</p>
  <div class="ejemplo">"Las perlas de tu boca brillan." → No hay perlas de verdad: se refiere a los <b>dientes</b>.</div>
  <h3>🪄 Las 5 figuras literarias</h3>
  <ul>
   <li><b>COMPARACIÓN:</b> une dos cosas parecidas usando <b>como, cual, parece, se asemeja</b>.<br>
   <i>"Eres <b>como</b> una mariposa."</i></li>
   <li><b>METÁFORA:</b> reemplaza una cosa por otra, <b>SIN usar "como"</b>.<br>
   <i>"Las <b>perlas</b> de tu boca brillan." (perlas = dientes)</i></li>
   <li><b>PERSONIFICACIÓN:</b> da cualidades <b>humanas</b> a animales, objetos o cosas.<br>
   <i>"Mi muñeca me <b>habló</b>, me <b>dijo</b> cosas que no puedo repetir."</i></li>
   <li><b>HIPÉRBOLE:</b> <b>exagera</b> muchísimo una idea.<br>
   <i>"<b>Mil pedazos</b> de mi corazón rodaron por toda la habitación."</i></li>
   <li><b>ALITERACIÓN:</b> <b>repite el mismo sonido</b> varias veces y produce un efecto musical.<br>
   <i>"El <b>r</b>uido con que <b>r</b>ueda la <b>r</b>onca tempestad."</i></li>
  </ul>
  `,
  resumen:"¿Usa \"como\"? → <b>Comparación</b>. ¿Cambia una cosa por otra sin \"como\"? → <b>Metáfora</b>. ¿Un objeto o animal actúa como humano? → <b>Personificación</b>. ¿Exagera muchísimo? → <b>Hipérbole</b>. ¿Repite un sonido? → <b>Aliteración</b>.",
  dato:"🧠 Truco rápido: <b>C</b>omparación tiene <b>C</b>omo. Si sacas el \"como\" y la frase sigue igual, ¡se convirtió en metáfora! \"Eres como una mariposa\" (comparación) → \"Eres una mariposa\" (metáfora)."
 },

  {f:"HIPÉRBOLE",b:"Exageración enorme de una idea. Ej: \"Mil pedazos de mi corazón rodaron por la habitación\"."},

{

 teoria:{
  titulo:"🛡️ Uso de B y V",
  html:`
  <p>La <b>b</b> y la <b>v</b> suenan igual, por eso hay que aprender <b>reglas</b> para no equivocarse.</p>
  <h3>🅱️ Se escribe con B</h3>
  <ul>
   <li><b>Antes de otra consonante</b> (bl, br, bs…): <i>ha<b>bl</b>ar, <b>br</b>azo, o<b>bv</b>io, posi<b>bl</b>e</i>.</li>
   <li><b>Después de la letra M</b>: <i>ho<b>mb</b>re, tu<b>mb</b>a, ca<b>mb</b>io</i>.</li>
   <li>En los <b>verbos terminados en -aba</b> (pretérito imperfecto): <i>cant<b>aba</b>, jug<b>aba</b>, salt<b>aba</b></i>.</li>
   <li>En las palabras que <b>comienzan con bu-, bur-, bus-</b>: <i><b>bu</b>rbuja, <b>bur</b>lar, <b>bús</b>queda</i>.</li>
  </ul>
  <h3>🆅 Se escribe con V</h3>
  <ul>
   <li><b>Después de la letra N</b>: <i>e<b>nv</b>ase, i<b>nv</b>itar, co<b>nv</b>ersar</i>.</li>
   <li><b>Después de las letras D y B</b>: <i>a<b>dv</b>erbio, o<b>bv</b>io, su<b>bv</b>ención</i>.</li>
   <li>En los <b>verbos vivir, hervir y servir</b> y todas sus formas conjugadas: <i>ser<b>v</b>irá, her<b>v</b>ía, vi<b>v</b>imos</i>.</li>
   <li>En los <b>adjetivos terminados en -ave, -eve, -avo, -evo, -ivo</b>: <i>su<b>ave</b>, br<b>eve</b>, oct<b>avo</b>, nu<b>evo</b>, act<b>ivo</b></i>.</li>
  </ul>
  `,
  resumen:"Con <b>B</b>: antes de consonante, después de <b>m</b>, verbos en <b>-aba</b>, palabras con <b>bu-/bur-/bus-</b>. Con <b>V</b>: después de <b>n</b>, después de <b>d</b> y <b>b</b>, verbos <b>vivir/hervir/servir</b>, adjetivos en <b>-ave, -eve, -avo, -evo, -ivo</b>.",
  dato:"🧠 Mnemotecnia: <b>\"M con B, N con V\"</b> — ho<b>mb</b>re / e<b>nv</b>ase. ¡Nunca falla! Y recuerda los tres verbos rebeldes: <b>vivir, hervir y servir</b> siempre con V."
 },

/* Fisher-Yates: mezcla una copia del arreglo */
function mezclar(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* ---------- HUD ---------- */
function actualizarHUD(){
  el("barra").classList.remove("oculto");

  el("sRacha").textContent = "🔥 " + S.racha;
  el("sNivel").textContent = "🏅 " + (S.nivel >= IDX_DESAFIO ? "Final" : "Nivel " + (S.nivel+1));
  const hechos = S.correctas + S.incorrectas;
  const pct = Math.min(100, Math.round(hechos / TOTAL_ITEMS * 100));
  el("progBar").style.width = pct + "%";
  el("progTxt").textContent = "Progreso general: " + pct + "%  ·  " + hechos + " de " + TOTAL_ITEMS + " actividades";
}

function toast(txt){
  const t = el("toast");
  t.textContent = txt;
  t.classList.add("ver");
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove("ver"), 1800);
}

/* ---------- Puntaje ---------- */
function sumarAcierto(){
  S.correctas++;
  S.racha++;
  if(S.racha > S.mejorRacha) S.mejorRacha = S.racha;
  let pts = 10;
  if(S.racha >= 3){ pts += 5; }
  if(S.racha >= 5){ pts += 5; }
  S.xp += pts;
  if(S.racha === 3) toast("🔥 ¡Racha de 3! +5 XP extra");
  if(S.racha === 5) toast("🔥🔥 ¡Racha de 5! +10 XP extra");
  if(S.racha === 10) toast("🔥🔥🔥 ¡Racha de 10! Eres imparable");
  const n = S.aciertosNivel[S.nivel] = S.aciertosNivel[S.nivel] || {ok:0,total:0};
  n.ok++; n.total++;
  actualizarHUD();
}
function sumarError(){
  S.incorrectas++;
  S.racha = 0;

}

function medallas(){
  const tot = S.correctas + S.incorrectas;
  const pct = tot ? S.correctas/tot : 0;
  return [
    {ic:"📋",n:"Aprendiz de Instrucciones",ok:S.completados.includes(0)},
    {ic:"🔍",n:"Detective Lector",ok:S.completados.includes(1)},
    {ic:"🪶",n:"Poeta Explorador",ok:S.completados.includes(2)},
    {ic:"✨",n:"Mago de las Palabras",ok:S.completados.includes(3)},
    {ic:"🛡️",n:"Guardián de la B y la V",ok:S.completados.includes(4)},
    {ic:"🎯",n:"Cazador de Significados",ok:S.completados.includes(5)},
    {ic:"🏆",n:"Maestro del Lenguaje",ok:S.completados.includes(IDX_DESAFIO)},
    {ic:"🔥",n:"Racha de 5",ok:S.mejorRacha>=5},
    {ic:"⚡",n:"Racha de 10",ok:S.mejorRacha>=10},
    {ic:"💎",n:"500 XP",ok:S.xp>=500},
    {ic:"👑",n:"1000 XP",ok:S.xp>=1000},
    {ic:"🎖️",n:"90% de aciertos",ok:tot>=20 && pct>=0.9}
  ];
}
function medallero(){
  const m = medallas();
  const g = m.map(x=>`<div class="med ${x.ok?"":"gris"}"><span class="ic">${x.ic}</span>${x.n}</div>`).join("");
  return `<div class="card"><h2>🏅 Mis medallas (${m.filter(x=>x.ok).length}/${m.length})</h2><div class="medGrid">${g}</div></div>`;
}

/* ---------- Selección múltiple ---------- */
function pintarMC(it){
  const orden = mezclar(it.o.map((txt,i)=>({txt,i})));
  window._ordenMC = orden;
  const opts = orden.map((o,pos)=>`<button class="opt" id="o${pos}" onclick="respMC(${pos})">${esc(o.txt)}</button>`).join("");
  app().innerHTML = `
  <div class="card">
    ${cabeceraItem()}
    <p class="preg">${esc(it.p)}</p>
    ${it.ctx?`<div class="contexto">${esc(it.ctx)}</div>`:""}
    <div class="opts">${opts}</div>
    <div id="zonaFB"></div>
  </div>
  ${barraTextos()}`;
}
function respMC(pos){
  if(S.respondida) return;
  S.respondida = true;
  const it = ITEMS[S.idx];
  const orden = window._ordenMC;
  const original = orden[pos].i;
  const correcto = original === it.c;
  orden.forEach((o,p)=>{
    const b = el("o"+p);
    b.disabled = true;
    if(o.i === it.c) b.classList.add("ok");
    else if(p === pos) b.classList.add("no");
  });
  const expl = it.exp ? it.exp[original] : "";
  let txt = esc(expl);
  if(!correcto){
    txt += `<br><br><b style="display:inline">✅ La respuesta correcta es:</b> ${esc(it.o[it.c])}<br>${esc(it.exp?it.exp[it.c]:"")}`;
  }
  correcto ? sumarAcierto() : sumarError();
  mostrarFB(correcto, txt);
}

/* ---------- Verdadero / Falso ---------- */

  </div>
  ${barraTextos()}`;
}
function respVF(v){
  if(S.respondida) return;
  S.respondida = true;
  const it = ITEMS[S.idx];
  const correcto = (v === it.c);
  el("vV").disabled = true; el("vF").disabled = true;

  mostrarFB(correcto, correcto ? esc(it.ok) : esc(it.no));
}

/* ---------- Ordenar pasos ---------- */
let ORD = [];
function pintarOrden(it){
  ORD = mezclar(it.pasos);
  // evita que salga ya ordenado
  if(ORD.join("|") === it.pasos.join("|")) ORD = mezclar(ORD);
  app().innerHTML = `
  <div class="card">
    ${cabeceraItem()}
    <p class="preg">${esc(it.p)}</p>
    <p style="font-size:15px;color:var(--gris)">Usa las flechas ▲▼ para mover cada paso hasta dejarlos en el orden correcto.</p>
    <div class="ordList" id="ordList"></div>
    <div class="centro"><button class="btn" id="btnOrd" onclick="respOrden()">✔️ Comprobar orden</button></div>
    <div id="zonaFB"></div>
  </div>`;
  pintarLista();
}
function pintarLista(){
  el("ordList").innerHTML = ORD.map((p,i)=>`
    <div class="ordItem" id="od${i}">
      <span class="num">${i+1}</span>
      <span class="txt">${esc(p)}</span>
      <span class="ordBtns">
        <button onclick="moverOrd(${i},-1)" aria-label="Subir" ${i===0?"disabled":""}>▲</button>
        <button onclick="moverOrd(${i},1)" aria-label="Bajar" ${i===ORD.length-1?"disabled":""}>▼</button>
      </span>
    </div>`).join("");
}
function moverOrd(i,d){
  if(S.respondida) return;
  const j = i+d;
  if(j<0 || j>=ORD.length) return;
  [ORD[i],ORD[j]] = [ORD[j],ORD[i]];
  pintarLista();
}
function respOrden(){
  if(S.respondida) return;
  S.respondida = true;
  const it = ITEMS[S.idx];
  const correcto = ORD.every((p,i)=>p === it.pasos[i]);
  el("btnOrd").disabled = true;
  ORD.forEach((p,i)=>{
    el("od"+i).classList.add(p === it.pasos[i] ? "ok" : "no");
    el("od"+i).querySelectorAll("button").forEach(b=>b.disabled = true);
  });
  correcto ? sumarAcierto() : sumarError();
  let txt = correcto ? esc(it.ok) : esc(it.no);
  if(!correcto){
    txt += "<br><br><b style='display:inline'>✅ El orden correcto es:</b><ol style='margin-top:6px'>" +
      it.pasos.map(p=>`<li>${esc(p)}</li>`).join("") + "</ol>";
  }
  mostrarFB(correcto, txt);
}

/* ---------- Relacionar columnas ---------- */
let MT = {izq:[], der:[], sel:null, hechos:0, fallos:0};
function pintarMatch(it){
  MT = {izq:mezclar(it.pares.map((p,i)=>({t:p[0],i}))),
        der:mezclar(it.pares.map((p,i)=>({t:p[1],i}))),
        sel:null, hechos:0, fallos:0};
  app().innerHTML = `
  <div class="card">
    ${cabeceraItem()}
    <p class="preg">${esc(it.p)}</p>
    <p style="font-size:15px;color:var(--gris)">Toca una tarjeta de la izquierda y luego su pareja de la derecha.</p>
    <div class="matchGrid">
      <div class="matchCol" id="colI">${MT.izq.map((x,p)=>`<button class="mItem" id="mi${p}" onclick="selIzq(${p})">${esc(x.t)}</button>`).join("")}</div>
      <div class="matchCol" id="colD">${MT.der.map((x,p)=>`<button class="mItem" id="md${p}" onclick="selDer(${p})">${esc(x.t)}</button>`).join("")}</div>
    </div>
    <div id="zonaFB"></div>
  </div>`;
}
function selIzq(p){
  if(S.respondida) return;
  if(el("mi"+p).classList.contains("hecho")) return;
  MT.izq.forEach((_,k)=>el("mi"+k).classList.remove("sel"));
  el("mi"+p).classList.add("sel");
  MT.sel = p;
}
function selDer(p){
  if(S.respondida) return;
  if(MT.sel === null){ toast("👉 Elige primero una tarjeta de la izquierda"); return; }
  if(el("md"+p).classList.contains("hecho")) return;
  const it = ITEMS[S.idx];
  const bi = el("mi"+MT.sel), bd = el("md"+p);
  if(MT.izq[MT.sel].i === MT.der[p].i){
    bi.classList.remove("sel"); bi.classList.add("hecho"); bd.classList.add("hecho");
    bi.disabled = true; bd.disabled = true;
    MT.sel = null; MT.hechos++;
    toast("✅ ¡Pareja correcta!");
    if(MT.hechos === it.pares.length){
      S.respondida = true;
      const perfecto = MT.fallos === 0;
      perfecto ? sumarAcierto() : sumarError();
      let txt = esc(it.ok);
      if(!perfecto) txt = "Completaste el ejercicio, pero tuviste " + MT.fallos + " intento(s) equivocado(s). Repasa estas parejas:<br><br>" +
        it.pares.map(p2=>`• <b>${esc(p2[0])}</b> → ${esc(p2[1])}`).join("<br>");
      mostrarFB(perfecto, txt);
    }
  } else {
    MT.fallos++;
    bd.classList.add("err");
    bi.classList.add("err");
    toast("❌ Esa no es la pareja. ¡Inténtalo de nuevo!");
    setTimeout(()=>{ bd.classList.remove("err"); bi.classList.remove("err","sel"); }, 700);
    MT.sel = null;
  }
}

/* ---------- Uso de B y V (3 pasos) ---------- */
let BV = {paso:0, errores:0};
function pintarBV(it){
  BV = {paso:0, errores:0};
  const partes = it.pal.split("__");
  app().innerHTML = `
  <div class="card">
    ${cabeceraItem()}
    <p class="preg">${esc(it.p)}</p>
    <div class="palabraGrande" id="palGrande">${esc(partes[0])}<span class="hueco" id="hueco">__</span>${esc(partes[1]||"")}</div>
    <div id="pasoBV"></div>
    <div id="zonaFB"></div>
  </div>`;
  pasoBVLetra();
}
function pasoBVLetra(){
  el("pasoBV").innerHTML = `
    <p style="text-align:center;font-weight:bold">Paso 1 · ¿Va con <b>B</b> o con <b>V</b>?</p>
    <div class="optsVF">
      <button class="opt" id="bB" onclick="respBVLetra('b')">B</button>
      <button class="opt" id="bV" onclick="respBVLetra('v')">V</button>
    </div>`;
}
function respBVLetra(l){
  const it = ITEMS[S.idx];
  el("bB").disabled = true; el("bV").disabled = true;
  (it.c === "b" ? el("bB") : el("bV")).classList.add("ok");
  if(l !== it.c){ (l==="b"?el("bB"):el("bV")).classList.add("no"); BV.errores++; }
  el("hueco").textContent = it.c.toUpperCase();
  setTimeout(()=>{
    const pg = el("palGrande");
    if(!pg) return;                                    // el usuario ya cambió de pantalla
    pg.innerHTML = esc(it.res);
    pasoBVRegla();
  }, 900);
}
function pasoBVRegla(){
  const it = ITEMS[S.idx];
  if(!el("pasoBV") || !it || it.t !== "bv") return;   // el usuario ya cambió de pantalla
  const orden = mezclar(it.opsRegla.map((t,i)=>({t,i})));
  window._ordBVR = orden;
  el("pasoBV").innerHTML = `
    <p style="text-align:center;font-weight:bold">Paso 2 · ¿Qué regla ortográfica lo explica?</p>
    <div class="opts">${orden.map((o,p)=>`<button class="opt" id="r${p}" onclick="respBVRegla(${p})">${esc(o.t)}</button>`).join("")}</div>`;
}
function respBVRegla(p){
  const it = ITEMS[S.idx];
  const orden = window._ordBVR;
  orden.forEach((o,k)=>{
    el("r"+k).disabled = true;
    if(o.i === it.cRegla) el("r"+k).classList.add("ok");
    else if(k === p) el("r"+k).classList.add("no");
  });
  if(orden[p].i !== it.cRegla) BV.errores++;
  setTimeout(pasoBVEjemplo, 900);
}
function pasoBVEjemplo(){
  const it = ITEMS[S.idx];
  if(!el("pasoBV") || !it || it.t !== "bv") return;   // el usuario ya cambió de pantalla
  const orden = mezclar(it.opsEj.map((t,i)=>({t,i})));
  window._ordBVE = orden;
  el("pasoBV").innerHTML = `
    <p style="text-align:center;font-weight:bold">Paso 3 · ¿Qué ejemplo justifica esa misma regla?</p>
    <div class="opts">${orden.map((o,p)=>`<button class="opt" id="e${p}" onclick="respBVEjemplo(${p})">${esc(o.t)}</button>`).join("")}</div>`;
}
function respBVEjemplo(p){
  if(S.respondida) return;
  S.respondida = true;
  const it = ITEMS[S.idx];
  const orden = window._ordBVE;
  orden.forEach((o,k)=>{
    el("e"+k).disabled = true;
    if(o.i === it.cEj) el("e"+k).classList.add("ok");
    else if(k === p) el("e"+k).classList.add("no");
  });
  if(orden[p].i !== it.cEj) BV.errores++;
  const perfecto = BV.errores === 0;
  perfecto ? sumarAcierto() : sumarError();
  const txt = `Se escribe <b style="display:inline">${esc(it.res)}</b>.<br>
    <b style="display:inline">Regla:</b> ${esc(it.regla)}<br>
    <b style="display:inline">Ejemplo que la justifica:</b> ${esc(it.ej)}` +
    (perfecto ? "" : `<br><br>Tuviste ${BV.errores} error(es) en los tres pasos. ¡Repasa esta regla y vuelve a intentarlo!`);
  mostrarFB(perfecto, txt);
}

/* ============================================================
   FIN DE NIVEL Y PANTALLA FINAL
   ============================================================ */
function finNivel(){
  const esDesafio = S.nivel >= IDX_DESAFIO;
  if(!S.completados.includes(S.nivel)) S.completados.push(S.nivel);
  const d = S.aciertosNivel[S.nivel] || {ok:0,total:0};
  const pct = d.total ? Math.round(d.ok/d.total*100) : 0;
  const n = esDesafio ? DESAFIO : NIVELES[S.nivel];
  let msg, emo;
  if(pct === 100){ msg = "¡PUNTAJE PERFECTO! Dominas este contenido por completo."; emo="🌟🏆🌟"; S.xp += 50; }
  else if(pct >= 80){ msg = "¡Muy buen trabajo! Solo te falta afinar algunos detalles."; emo="🎉"; S.xp += 25; }
  else if(pct >= 60){ msg = "¡Vas bien! Te recomiendo repasar la teoría de este nivel y volver a intentarlo."; emo="💪"; }
  else { msg = "Este contenido necesita más práctica. Vuelve a leer la teoría y repite el nivel: ¡lo vas a lograr!"; emo="🌱"; }
  actualizarHUD();

  app().innerHTML = `
  <div class="card centro">
    <div style="font-size:56px">${emo}</div>
    <h1>${esDesafio?"":"Nivel completado: "}${n.nombre}</h1>
    <div class="resGrid">
      <div class="resBox"><span class="n">${d.ok}/${d.total}</span><span class="l">Aciertos</span></div>
      <div class="resBox"><span class="n">${pct}%</span><span class="l">Logro del nivel</span></div>
      <div class="resBox"><span class="n">${S.xp}</span><span class="l">XP total</span></div>
      <div class="resBox"><span class="n">${S.mejorRacha}</span><span class="l">Mejor racha 🔥</span></div>
    </div>
    <p style="font-size:18px">${msg}</p>
    <div style="margin-top:14px">
      ${esDesafio
        ? `<button class="btn verde" onclick="pantallaFinal()">📊 Ver mis resultados finales</button>`
        : `<button class="btn naranjo" onclick="irAlMapa()">🗺️ Ir al mapa</button>`}
      <button class="btn chico" onclick="${esDesafio?"abrirDesafio()":"abrirNivel("+S.nivel+")"}">🔁 Repetir este nivel</button>
    </div>
  </div>
  ${medallero()}`;
  window.scrollTo(0,0);
}

function pantallaFinal(){
  const tot = S.correctas + S.incorrectas;
  const pct = tot ? Math.round(S.correctas/tot*100) : 0;
  const seg = Math.round((Date.now() - (S.inicio||Date.now()))/1000);
  const min = Math.floor(seg/60), sg = seg%60;
  const m = medallas().filter(x=>x.ok);

  let rango, ico;
  if(pct>=90){ rango="MAESTRO DEL LENGUAJE"; ico="👑"; }
  else if(pct>=75){ rango="EXPERTO LECTOR"; ico="🏆"; }
  else if(pct>=60){ rango="APRENDIZ AVANZADO"; ico="🥈"; }
  else { rango="EXPLORADOR EN ENTRENAMIENTO"; ico="🌱"; }

  // Recomendaciones según los niveles más débiles
  const debiles = [];
  NIVELES.forEach((n,i)=>{
    const d = S.aciertosNivel[i];
    if(!d || d.total===0){ debiles.push({n:n.nombre, sub:n.sub, p:-1}); return; }
    const p = d.ok/d.total;
    if(p < 0.8) debiles.push({n:n.nombre, sub:n.sub, p:Math.round(p*100)});
  });
  const recos = debiles.length
    ? "<ul>" + debiles.map(d=>`<li><b>${esc(d.n)}</b> (${esc(d.sub)}) — ${d.p<0?"¡aún no lo has jugado! Complétalo antes de la prueba.":"lograste "+d.p+"%. Vuelve a leer la teoría y repite el nivel."}</li>`).join("") + "</ul>"
    : "<p>🎉 ¡Todos tus niveles están sobre el 80%! Estás muy bien preparado. Repasa las tarjetas una última vez el día antes de la prueba.</p>";

  app().innerHTML = `
  <div class="card centro">
    <div style="font-size:64px">${ico}</div>
    <h1>${rango}</h1>
    <p style="font-size:19px">Terminaste la Guía Interactiva de Lenguaje 4° Básico.</p>
    <div class="resGrid">
      <div class="resBox"><span class="n">${S.xp}</span><span class="l">XP total</span></div>
      <div class="resBox"><span class="n">${pct}%</span><span class="l">Logro general</span></div>
      <div class="resBox"><span class="n">${S.correctas}</span><span class="l">Correctas ✅</span></div>
      <div class="resBox"><span class="n">${S.incorrectas}</span><span class="l">Incorrectas ❌</span></div>
      <div class="resBox"><span class="n">${min}:${String(sg).padStart(2,"0")}</span><span class="l">Tiempo</span></div>
      <div class="resBox"><span class="n">${S.mejorRacha}</span><span class="l">Mejor racha 🔥</span></div>
      <div class="resBox"><span class="n">${m.length}</span><span class="l">Medallas 🏅</span></div>
      <div class="resBox"><span class="n">${S.completados.length}/${NIVELES.length+1}</span><span class="l">Niveles</span></div>
    </div>
  </div>
  <div class="card">
    <h2>📚 Qué repasar antes de la prueba</h2>
    ${recos}
    <div class="resumen"><b>✅ Checklist final:</b>
      <ul>
        <li>Diferencio texto <b>instructivo</b> (cómo hacer) de <b>normativo</b> (cómo actuar).</li>
        <li>Reconozco la estructura: <b>título → ingredientes → preparación</b>.</li>
        <li>Distingo información <b>explícita</b> de <b>implícita</b> y sé inferir.</li>
        <li>Cuento <b>versos</b> y <b>estrofas</b>, y sé qué es la rima y el hablante lírico.</li>
        <li>Identifico <b>comparación, metáfora, personificación, hipérbole y aliteración</b>.</li>
        <li>Aplico las reglas de <b>B y V</b> ("M con B, N con V").</li>
        <li>Deduzco el significado de palabras <b>por el contexto</b>.</li>
      </ul>
    </div>
  </div>
  ${medallero()}
  <div class="card centro">
    <button class="btn naranjo" onclick="reiniciar()">🔄 Volver a jugar desde cero</button>
    <button class="btn chico gris" onclick="irAlMapa()">🗺️ Volver al mapa</button>
  </div>
  <div class="pie">¡Mucho éxito en tu prueba de Lenguaje y Comunicación! 🍀</div>`;
  window.scrollTo(0,0);
}

function reiniciar(){
  S.xp=0; S.racha=0; S.mejorRacha=0; S.correctas=0; S.incorrectas=0;
  S.nivel=0; S.idx=0; S.completados=[]; S.aciertosNivel={}; S.inicio=null; S.respondida=false;
  actualizarHUD();
  pantallaBienvenida();
}

/* ---------- Arranque ---------- */
pantallaBienvenida();
</script>
</body>
</html>
