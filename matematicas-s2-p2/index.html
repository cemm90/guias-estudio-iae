<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guía Interactiva · Matemática 4° Básico · Prueba de Agosto</title>
<style>
/* ============================================================
   GUÍA DE ESTUDIO INTERACTIVA — MATEMÁTICA 4° BÁSICO
   Todo en un solo archivo. Sin dependencias. Funciona offline.
   ============================================================ */

:root{
  --azul:#2563eb; --azul-osc:#1e40af; --azul-cl:#dbeafe;
  --morado:#7c3aed; --rosa:#ec4899; --naranjo:#f97316;
  --verde:#16a34a; --verde-cl:#dcfce7; --rojo:#dc2626; --rojo-cl:#fee2e2;
  --amarillo:#facc15; --cyan:#06b6d4;
  --texto:#12203a; --texto-suave:#4b5b74;
  --panel:#ffffff; --fondo:#eef3fb; --borde:#d5e0f0;
  --sombra:0 6px 18px rgba(23,45,90,.10);
  --sombra-alta:0 14px 34px rgba(23,45,90,.18);
  --radio:18px;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Trebuchet MS","Verdana","Segoe UI",system-ui,sans-serif;
  background:
    radial-gradient(circle at 12% 8%, #dbeafe 0%, transparent 42%),
    radial-gradient(circle at 88% 4%, #fae8ff 0%, transparent 40%),
    radial-gradient(circle at 50% 100%, #dcfce7 0%, transparent 45%),
    var(--fondo);
  background-attachment:fixed;
  color:var(--texto);
  font-size:17px; line-height:1.55;
  min-height:100vh;
}
h1,h2,h3,h4{margin:0 0 .5em; line-height:1.2}
p{margin:0 0 .7em}
button{font-family:inherit; font-size:1rem; cursor:pointer; border:none; background:none; color:inherit}
button:focus-visible, .clickable:focus-visible{outline:4px solid var(--naranjo); outline-offset:3px}

.wrap{max-width:1000px; margin:0 auto; padding:14px 16px 90px}

/* ---------- Barra superior (HUD) ---------- */
#hud{
  position:sticky; top:0; z-index:50;
  background:rgba(255,255,255,.93); backdrop-filter:blur(8px);
  border-bottom:2px solid var(--borde); box-shadow:0 2px 12px rgba(23,45,90,.07);
}
#hud .hud-in{max-width:1000px; margin:0 auto; padding:8px 16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.chip{
  display:inline-flex; align-items:center; gap:6px;
  background:var(--azul-cl); color:var(--azul-osc);
  border-radius:999px; padding:5px 13px; font-weight:bold; font-size:.92rem;
  white-space:nowrap;
}
.chip.xp{background:#fef3c7; color:#92400e}
.chip.estrellas{background:#ede9fe; color:#5b21b6}
.chip.racha{background:#ffe4e6; color:#9f1239}
.chip.medalla{background:var(--verde-cl); color:#14532d}
.chip.grande{font-size:1.05rem; padding:8px 16px}
#barra-global{flex:1 1 160px; min-width:130px; height:14px; background:#e2e8f0; border-radius:99px; overflow:hidden; border:1px solid var(--borde)}
#barra-global i{display:block; height:100%; width:0%; border-radius:99px;
  background:linear-gradient(90deg,var(--verde),var(--cyan),var(--azul)); transition:width .55s ease}
.btn-hud{background:#fff; border:2px solid var(--borde); border-radius:12px; padding:5px 11px; font-weight:bold; font-size:.88rem; color:var(--texto-suave)}
.btn-hud:hover{border-color:var(--azul); color:var(--azul)}

/* ---------- Pantallas ---------- */
.pantalla{display:none; animation:aparecer .4s ease}
.pantalla.activa{display:block}
@keyframes aparecer{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}

/* ---------- Tarjetas ---------- */
.card{
  background:var(--panel); border-radius:var(--radio); padding:22px;
  box-shadow:var(--sombra); border:1px solid var(--borde); margin-bottom:16px;
}
.card.destacada{border:3px solid var(--amarillo); background:linear-gradient(180deg,#fffbeb,#fff)}

/* ---------- Botones ---------- */
.btn{
  display:inline-block; background:linear-gradient(180deg,var(--azul),var(--azul-osc));
  color:#fff; font-weight:bold; padding:13px 26px; border-radius:14px;
  box-shadow:0 4px 0 #1e3a8a; transition:transform .1s, box-shadow .1s; font-size:1.05rem;
}
.btn:hover{transform:translateY(-2px); box-shadow:0 6px 0 #1e3a8a}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 #1e3a8a}
.btn.verde{background:linear-gradient(180deg,#22c55e,#15803d); box-shadow:0 4px 0 #14532d}
.btn.verde:active{box-shadow:0 1px 0 #14532d}
.btn.naranjo{background:linear-gradient(180deg,#fb923c,#ea580c); box-shadow:0 4px 0 #9a3412}
.btn.naranjo:active{box-shadow:0 1px 0 #9a3412}
.btn.morado{background:linear-gradient(180deg,#a78bfa,#6d28d9); box-shadow:0 4px 0 #4c1d95}
.btn.morado:active{box-shadow:0 1px 0 #4c1d95}
.btn.gris{background:linear-gradient(180deg,#94a3b8,#475569); box-shadow:0 4px 0 #334155}
.btn.gris:active{box-shadow:0 1px 0 #334155}
.btn.pequeno{padding:9px 16px; font-size:.94rem; border-radius:11px}
.btn[disabled]{opacity:.45; cursor:not-allowed; transform:none!important}

/* ---------- Bienvenida ---------- */
.hero{text-align:center; padding:30px 22px}
.hero .titulo{
  font-size:clamp(1.9rem,5.5vw,3rem); font-weight:900; letter-spacing:-.5px;
  background:linear-gradient(90deg,var(--azul),var(--morado),var(--rosa));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.hero .sub{font-size:1.12rem; color:var(--texto-suave); max-width:640px; margin:0 auto 18px}
.emoji-grande{font-size:3.4rem; display:block; margin-bottom:6px; animation:flotar 3s ease-in-out infinite}
@keyframes flotar{0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)}}
.grid-info{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-top:18px; text-align:left}
.info-mini{background:#f8fafc; border:1px solid var(--borde); border-radius:14px; padding:12px 14px}
.info-mini b{display:block; color:var(--azul-osc)}

/* ---------- Mapa de niveles ---------- */
.mapa{display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:14px}
.nivel-card{
  position:relative; background:var(--panel); border-radius:var(--radio); padding:16px;
  border:2px solid var(--borde); box-shadow:var(--sombra); text-align:left;
  transition:transform .15s, box-shadow .15s, border-color .15s; width:100%;
}
.nivel-card:hover:not(.bloqueado){transform:translateY(-4px); box-shadow:var(--sombra-alta); border-color:var(--azul)}
.nivel-card.bloqueado{opacity:.55; cursor:not-allowed; filter:grayscale(.6)}
.nivel-card.completado{border-color:var(--verde); background:linear-gradient(180deg,#f0fdf4,#fff)}
.nivel-card .n-num,.nivel-card .n-titulo,.nivel-card .n-tema,.nivel-card .n-estrellas{display:block}
.nivel-card .n-num{font-size:.78rem; font-weight:bold; color:var(--texto-suave); letter-spacing:1px; text-transform:uppercase}
.nivel-card .n-icono{font-size:2.1rem; display:block; margin:2px 0 4px}
.nivel-card .n-titulo{font-weight:900; font-size:1.06rem; line-height:1.2; margin-bottom:2px}
.nivel-card .n-tema{font-size:.86rem; color:var(--texto-suave)}
.nivel-card .n-estrellas{margin-top:8px; font-size:1.05rem; letter-spacing:2px}
.candado{position:absolute; top:12px; right:14px; font-size:1.2rem}
.seccion-titulo{display:flex; align-items:center; gap:10px; margin:22px 0 10px; font-size:1.25rem; font-weight:900; color:var(--azul-osc)}
.seccion-titulo:before{content:""; flex:0 0 6px; height:26px; background:var(--azul); border-radius:99px}

/* ---------- Nivel: teoría ---------- */
.tabs{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap}
.tab{background:#fff; border:2px solid var(--borde); border-radius:12px; padding:8px 16px; font-weight:bold; color:var(--texto-suave)}
.tab.activa{background:var(--azul); border-color:var(--azul); color:#fff}
.teoria h3{color:var(--azul-osc); margin-top:18px}
.teoria h3:first-child{margin-top:0}
.resumen{background:var(--azul-cl); border-left:6px solid var(--azul); border-radius:0 12px 12px 0; padding:12px 16px; margin:12px 0}
.resumen b{color:var(--azul-osc)}
.dato{background:#fef9c3; border-left:6px solid var(--amarillo); border-radius:0 12px 12px 0; padding:12px 16px; margin:12px 0}
.ejemplo{background:#f1f5f9; border:1px dashed #94a3b8; border-radius:12px; padding:12px 16px; margin:10px 0}
.ejemplo .paso{margin:4px 0 4px 4px; padding-left:14px; border-left:3px solid var(--cyan)}
.error-comun{background:var(--rojo-cl); border-left:6px solid var(--rojo); border-radius:0 12px 12px 0; padding:12px 16px; margin:12px 0}
.num{font-family:"Courier New",monospace; font-weight:bold; background:#fff; padding:1px 6px; border-radius:6px; border:1px solid var(--borde)}
.teoria table{border-collapse:collapse; width:100%; margin:10px 0; font-size:.95rem}
.teoria th,.teoria td{border:1px solid var(--borde); padding:7px 9px; text-align:center}
.teoria th{background:var(--azul-cl); color:var(--azul-osc)}
.teoria ul{margin:.4em 0 .8em; padding-left:22px}
.teoria li{margin:.25em 0}

/* ---------- Actividades ---------- */
.pregunta-caja{background:var(--panel); border-radius:var(--radio); padding:20px; box-shadow:var(--sombra); border:1px solid var(--borde)}
.pregunta-meta{display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:.85rem; color:var(--texto-suave); font-weight:bold; margin-bottom:8px; flex-wrap:wrap}
.etiqueta-tipo{background:#ede9fe; color:#5b21b6; border-radius:999px; padding:3px 11px; font-size:.78rem}
.pregunta-texto{font-size:1.18rem; font-weight:bold; margin-bottom:14px; line-height:1.4}
.figura{display:flex; justify-content:center; margin:10px 0 16px; overflow-x:auto}
.figura svg{max-width:100%; height:auto}

.opciones{display:grid; gap:10px}
.opciones.dos{grid-template-columns:1fr 1fr}
.opcion{
  display:flex; align-items:center; gap:12px; text-align:left; width:100%;
  background:#fff; border:2px solid var(--borde); border-radius:14px; padding:13px 16px;
  font-size:1.05rem; font-weight:600; transition:.13s;
}
.opcion:hover:not(:disabled){border-color:var(--azul); background:var(--azul-cl); transform:translateX(3px)}
.opcion .letra{
  flex:0 0 32px; height:32px; display:grid; place-items:center; border-radius:9px;
  background:var(--azul-cl); color:var(--azul-osc); font-weight:900;
}
.opcion.correcta{border-color:var(--verde); background:var(--verde-cl)}
.opcion.correcta .letra{background:var(--verde); color:#fff}
.opcion.incorrecta{border-color:var(--rojo); background:var(--rojo-cl)}
.opcion.incorrecta .letra{background:var(--rojo); color:#fff}
.opcion:disabled{cursor:default}
.opcion.atenuada{opacity:.5}

.resp-input{
  font-size:1.25rem; font-weight:bold; padding:11px 14px; border:2px solid var(--borde);
  border-radius:12px; width:170px; text-align:center; font-family:inherit; background:#fff;
}
.resp-input:focus{outline:none; border-color:var(--azul); box-shadow:0 0 0 4px var(--azul-cl)}
.resp-input.ok{border-color:var(--verde); background:var(--verde-cl)}
.resp-input.mal{border-color:var(--rojo); background:var(--rojo-cl)}
.fila-input{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.unidad{font-weight:bold; color:var(--texto-suave); font-size:1.05rem}

.feedback{margin-top:14px; padding:14px 16px; border-radius:14px; font-weight:600; display:none; animation:aparecer .3s}
.feedback.ok{display:block; background:var(--verde-cl); border-left:6px solid var(--verde); color:#14532d}
.feedback.mal{display:block; background:var(--rojo-cl); border-left:6px solid var(--rojo); color:#7f1d1d}
.feedback .cabeza{font-size:1.1rem; font-weight:900; display:block; margin-bottom:3px}

/* relacionar */
.relacionar{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.rel-col{display:grid; gap:8px; align-content:start}
.rel-item{
  background:#fff; border:2px solid var(--borde); border-radius:12px; padding:11px 13px;
  font-weight:600; text-align:center; transition:.13s; font-size:.98rem;
}
.rel-item:hover:not(.usado){border-color:var(--morado); background:#f5f3ff}
.rel-item.sel{border-color:var(--morado); background:#ede9fe; transform:scale(1.03)}
.rel-item.usado{background:var(--verde-cl); border-color:var(--verde); cursor:default; opacity:.85}
.rel-item.fallo{animation:temblar .4s}
@keyframes temblar{0%,100%{transform:none} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)}}

/* ordenar */
.orden-zona{min-height:56px; border:2px dashed var(--borde); border-radius:14px; padding:8px; display:flex; flex-wrap:wrap; gap:8px; background:#f8fafc; margin-bottom:10px}
.orden-item{background:#fff; border:2px solid var(--azul); color:var(--azul-osc); border-radius:11px; padding:9px 14px; font-weight:bold}
.orden-item.puesto{background:var(--azul-cl)}
.mini-nota{font-size:.86rem; color:var(--texto-suave)}

/* flashcards */
.flash-escena{perspective:1200px; margin:0 auto 16px; max-width:520px}
.flash{position:relative; width:100%; min-height:230px; transform-style:preserve-3d; transition:transform .55s; cursor:pointer}
.flash.girada{transform:rotateY(180deg)}
.flash-cara{
  position:absolute; inset:0; backface-visibility:hidden; border-radius:20px; padding:22px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  box-shadow:var(--sombra-alta); border:2px solid var(--borde);
}
.flash-frente{background:linear-gradient(160deg,#fff,#eff6ff)}
.flash-atras{background:linear-gradient(160deg,#ecfdf5,#fff); transform:rotateY(180deg)}
.flash-cara .txt{font-size:1.2rem; font-weight:bold}
.flash-cara .pista{margin-top:10px; font-size:.85rem; color:var(--texto-suave)}

/* memorama */
.memo-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:9px; max-width:620px; margin:0 auto}
.memo-carta{aspect-ratio:1/1; perspective:800px; background:none; padding:0}
.memo-in{position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .45s}
.memo-carta.abierta .memo-in{transform:rotateY(180deg)}
.memo-cara{position:absolute; inset:0; backface-visibility:hidden; border-radius:13px; display:grid; place-items:center; padding:5px; font-weight:bold; font-size:.95rem; text-align:center; border:2px solid var(--borde)}
.memo-frente{background:linear-gradient(145deg,var(--azul),var(--morado)); color:#fff; font-size:1.6rem}
.memo-atras{background:#fff; transform:rotateY(180deg); color:var(--texto)}
.memo-carta.hecha .memo-atras{background:var(--verde-cl); border-color:var(--verde)}

/* resultados */
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin:16px 0}
.stat{background:#f8fafc; border:1px solid var(--borde); border-radius:14px; padding:14px; text-align:center}
.stat .v{font-size:1.9rem; font-weight:900; color:var(--azul-osc); display:block; line-height:1}
.stat .k{font-size:.83rem; color:var(--texto-suave); font-weight:bold; text-transform:uppercase; letter-spacing:.5px}
.medallas{display:flex; flex-wrap:wrap; gap:10px; margin-top:10px}
.medalla{background:#fff; border:2px solid var(--amarillo); border-radius:14px; padding:10px 14px; display:flex; align-items:center; gap:9px; box-shadow:var(--sombra); font-size:.92rem; max-width:100%}
.medalla .m-em{font-size:1.6rem}
.medalla b{display:block}
.medalla.gris{border-color:var(--borde); opacity:.5; filter:grayscale(1)}
.estrellas-grandes{font-size:2.6rem; letter-spacing:6px; text-align:center; margin:8px 0}
.confeti{position:fixed; top:-12px; width:10px; height:16px; z-index:999; pointer-events:none; animation:caer linear forwards}
@keyframes caer{to{transform:translateY(105vh) rotate(720deg); opacity:.15}}

.aviso{background:#fff7ed; border:2px solid var(--naranjo); border-radius:14px; padding:12px 16px; margin:12px 0; font-size:.95rem}
.pie{text-align:center; color:var(--texto-suave); font-size:.85rem; margin-top:22px}
.acciones{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; align-items:center}
.centro{text-align:center}
.cronometro{font-family:"Courier New",monospace; font-weight:900; font-size:1.15rem; color:var(--rojo)}

@media (max-width:640px){
  body{font-size:16px}
  .wrap{padding:10px 11px 80px}
  .card,.pregunta-caja{padding:16px}
  .opciones.dos{grid-template-columns:1fr}
  .relacionar{grid-template-columns:1fr 1fr; gap:7px}
  .rel-item{font-size:.88rem; padding:9px 7px}
  .memo-grid{grid-template-columns:repeat(3,1fr)}
  .mapa{grid-template-columns:1fr 1fr; gap:10px}
  .nivel-card{padding:12px}
  .nivel-card .n-titulo{font-size:.95rem}
  .nivel-card .n-tema{font-size:.78rem}
}
@media print{ #hud{position:static} .btn{display:none} }
</style>
</head>
<body>

<div id="hud">
  <div class="hud-in">
    <span class="chip xp">⚡ <span id="hud-xp">0</span> XP</span>
    <span class="chip estrellas">⭐ <span id="hud-estrellas">0</span></span>
    <span class="chip racha">🔥 <span id="hud-racha">0</span></span>
    <span class="chip medalla">🏅 <span id="hud-medallas">0</span></span>
    <div id="barra-global" title="Progreso general"><i></i></div>
    <span class="chip" id="hud-pct">0%</span>
    <button class="btn-hud" id="btn-inicio" type="button">🏠 Mapa</button>
  </div>
</div>

<div class="wrap">
  <div id="p-bienvenida" class="pantalla activa"></div>
  <div id="p-mapa" class="pantalla"></div>
  <div id="p-nivel" class="pantalla"></div>
  <div id="p-resultado" class="pantalla"></div>
  <div id="p-final" class="pantalla"></div>
  <div id="p-extra" class="pantalla"></div>
</div>

<script>
"use strict";
/* ============================================================
   1) UTILIDADES DE DIBUJO (SVG generado en JS, 100% offline)
   ============================================================ */

/** Reloj analógico. h = 1..12, m = 0..59 */
function svgReloj(h, m, tam){
  tam = tam || 190;
  const cx=100, cy=100, r=88;
  let nums = "";
  for(let i=1;i<=12;i++){
    const a = (i*30 - 90) * Math.PI/180;
    nums += `<text x="${(cx+Math.cos(a)*70).toFixed(1)}" y="${(cy+Math.sin(a)*70+6).toFixed(1)}"
      text-anchor="middle" font-size="17" font-weight="bold" fill="#1e40af">${i}</text>`;
  }
  let marcas = "";
  for(let i=0;i<60;i++){
    const a = (i*6 - 90)*Math.PI/180, largo = (i%5===0)?9:4;
    marcas += `<line x1="${(cx+Math.cos(a)*(r-2)).toFixed(1)}" y1="${(cy+Math.sin(a)*(r-2)).toFixed(1)}"
      x2="${(cx+Math.cos(a)*(r-2-largo)).toFixed(1)}" y2="${(cy+Math.sin(a)*(r-2-largo)).toFixed(1)}"
      stroke="${i%5===0?'#1e40af':'#94a3b8'}" stroke-width="${i%5===0?2.5:1.2}"/>`;
  }
  const angMin = (m*6 - 90)*Math.PI/180;
  const angHor = (((h%12) + m/60)*30 - 90)*Math.PI/180;
  return `<svg viewBox="0 0 200 200" width="${tam}" height="${tam}" role="img" aria-label="Reloj que marca ${h} y ${m} minutos">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="#ffffff" stroke="#1e40af" stroke-width="5"/>
    <circle cx="${cx}" cy="${cy}" r="${r-13}" fill="#f8fafc"/>
    ${marcas}${nums}
    <line x1="${cx}" y1="${cy}" x2="${(cx+Math.cos(angHor)*40).toFixed(1)}" y2="${(cy+Math.sin(angHor)*40).toFixed(1)}"
      stroke="#dc2626" stroke-width="7" stroke-linecap="round"/>
    <line x1="${cx}" y1="${cy}" x2="${(cx+Math.cos(angMin)*66).toFixed(1)}" y2="${(cy+Math.sin(angMin)*66).toFixed(1)}"
      stroke="#2563eb" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="6" fill="#12203a"/>
  </svg>`;
}

/** Ángulo dibujado con dos rayos y un arco. grados = 0..359 */
function svgAngulo(grados, etiqueta){
  const vx=45, vy=155, largo=145;
  const a2 = -grados*Math.PI/180;
  const x2 = vx + Math.cos(a2)*largo, y2 = vy + Math.sin(a2)*largo;
  const rArc = 40;
  const ax1 = vx + rArc, ay1 = vy;
  const ax2 = vx + Math.cos(a2)*rArc, ay2 = vy + Math.sin(a2)*rArc;
  const grande = grados > 180 ? 1 : 0;
  let arco;
  if(Math.abs(grados-90) < 0.5){
    arco = `<path d="M ${vx+26} ${vy} L ${vx+26} ${vy-26} L ${vx} ${vy-26}" fill="none" stroke="#f97316" stroke-width="3.5"/>`;
  } else {
    arco = `<path d="M ${ax1} ${ay1} A ${rArc} ${rArc} 0 ${grande} 0 ${ax2.toFixed(1)} ${ay2.toFixed(1)}"
      fill="rgba(249,115,22,.18)" stroke="#f97316" stroke-width="3.5"/>`;
  }
  const txt = etiqueta ? `<text x="${vx+58}" y="${vy-26}" font-size="19" font-weight="bold" fill="#ea580c">${etiqueta}</text>` : "";
  return `<svg viewBox="0 0 210 185" width="215" height="190" role="img" aria-label="Ángulo de ${grados} grados">
    <line x1="${vx}" y1="${vy}" x2="${vx+largo}" y2="${vy}" stroke="#1e40af" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="${vx}" y1="${vy}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#1e40af" stroke-width="4.5" stroke-linecap="round"/>
    ${arco}
    <circle cx="${vx}" cy="${vy}" r="5.5" fill="#1e40af"/>${txt}
  </svg>`;
}

/** Rectángulo o cuadrado con medidas escritas en los lados. */
function svgRect(base, altura, unidad, opt){
  opt = opt || {};
  const escala = Math.min(190/Math.max(base,1), 120/Math.max(altura,1), 26);
  const w = Math.max(46, base*escala), hh = Math.max(38, altura*escala);
  const x=40, y=42;
  const relleno = opt.relleno || "#dbeafe";
  const marcas = `
    <path d="M ${x} ${y+13} L ${x+13} ${y+13} L ${x+13} ${y}" fill="none" stroke="#334155" stroke-width="1.6"/>
    <path d="M ${x+w} ${y+13} L ${x+w-13} ${y+13} L ${x+w-13} ${y}" fill="none" stroke="#334155" stroke-width="1.6"/>
    <path d="M ${x} ${y+hh-13} L ${x+13} ${y+hh-13} L ${x+13} ${y+hh}" fill="none" stroke="#334155" stroke-width="1.6"/>
    <path d="M ${x+w} ${y+hh-13} L ${x+w-13} ${y+hh-13} L ${x+w-13} ${y+hh}" fill="none" stroke="#334155" stroke-width="1.6"/>`;
  return `<svg viewBox="0 0 ${x+w+60} ${y+hh+46}" width="${Math.min(x+w+60,330)}" role="img"
      aria-label="Figura de ${base} por ${altura} ${unidad}">
    <rect x="${x}" y="${y}" width="${w}" height="${hh}" fill="${relleno}" stroke="#1e40af" stroke-width="3.5" rx="2"/>
    ${marcas}
    <text x="${x+w/2}" y="${y-11}" text-anchor="middle" font-size="16" font-weight="bold" fill="#12203a">${base} ${unidad}</text>
    <text x="${x+w+9}" y="${y+hh/2+6}" font-size="16" font-weight="bold" fill="#12203a">${altura} ${unidad}</text>
  </svg>`;
}

/** Cuadrícula con celdas pintadas. filas/cols; pintadas = array "f,c" */
function svgGrilla(filas, cols, pintadas, opt){
  opt = opt || {};
  const c = opt.celda || 26, mx=14, my=14;
  const set = new Set(pintadas);
  let cel = "";
  for(let f=0; f<filas; f++){
    for(let k=0; k<cols; k++){
      const on = set.has(f+","+k);
      cel += `<rect x="${mx+k*c}" y="${my+f*c}" width="${c}" height="${c}"
        fill="${on ? (opt.color||'#93c5fd') : '#ffffff'}" stroke="#64748b" stroke-width="1.2"/>`;
    }
  }
  return `<svg viewBox="0 0 ${cols*c+mx*2} ${filas*c+my*2}" width="${Math.min(cols*c+mx*2, 400)}" role="img"
    aria-label="Cuadrícula de ${filas} por ${cols}">${cel}</svg>`;
}

/** Tabla de 100 (recorte de 5x5) con celdas destacadas. */
function svgTabla100(inicio, destacadas){
  const c=42, mx=8, my=8, filas=5, cols=5;
  const set = new Set(destacadas);
  let cel="";
  for(let f=0;f<filas;f++){
    for(let k=0;k<cols;k++){
      const val = inicio + f*10 + k;
      const on = set.has(val);
      cel += `<rect x="${mx+k*c}" y="${my+f*c}" width="${c}" height="${c}" fill="${on?'#fde68a':'#fff'}" stroke="#475569" stroke-width="1.3"/>
        <text x="${mx+k*c+c/2}" y="${my+f*c+c/2+6}" text-anchor="middle" font-size="16"
          font-weight="${on?'bold':'normal'}" fill="#12203a">${val}</text>`;
    }
  }
  return `<svg viewBox="0 0 ${cols*c+mx*2} ${filas*c+my*2}" width="${cols*c+mx*2}" role="img" aria-label="Trozo de tabla de 100">${cel}</svg>`;
}

  else if(tipo==="mariposa")  fig=`<path d="M110 30 L110 160 M110 95 C 55 25, 5 60, 45 105 C 15 130, 70 165, 110 125 M110 95 C 165 25, 215 60, 175 105 C 205 130, 150 165, 110 125"
        fill="#c7d2fe" stroke="#4338ca" stroke-width="3"/>`;
  else if(tipo==="letraF")    fig=`<path d="M65 25 L165 25 L165 60 L100 60 L100 82 L150 82 L150 115 L100 115 L100 168 L65 168 Z" fill="#bae6fd" stroke="#0369a1" stroke-width="3.5"/>`;
  else if(tipo==="letraA")    fig=`<path d="M110 22 L165 168 L138 168 L128 138 L92 138 L82 168 L55 168 Z M100 112 L120 112 L110 78 Z" fill="#bae6fd" stroke="#0369a1" stroke-width="3.5" fill-rule="evenodd"/>`;
  else if(tipo==="paralelogramo") fig=`<polygon points="55,45 205,45 165,150 15,150" fill="#fde68a" stroke="#b45309" stroke-width="3.5"/>`;

/** Ilustración de traslación, rotación o reflexión sobre una cuadrícula. */
function svgTransformacion(tipo){
  const c=24, cols=13, filas=8, mx=8, my=8;
  let grid="";
  for(let f=0;f<filas;f++) for(let k=0;k<cols;k++)
    grid += `<rect x="${mx+k*c}" y="${my+f*c}" width="${c}" height="${c}" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>`;
  const P = (col,fil)=>[mx+col*c, my+fil*c];
  const flecha = (x1,y1,x2,y2,color)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="3"
      marker-end="url(#pf)" stroke-dasharray="7 5"/>`;
  const defs = `<defs><marker id="pf" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#dc2626"/></marker></defs>`;
  // Figura base: una "L" de 3 celdas
  const formaL = (col,fil,color,extra)=>{
    const [x,y]=P(col,fil);
    return `<g ${extra||""}><path d="M${x} ${y} h${c} v${c*2} h${c} v${c} h${-c*2} Z" fill="${color}" stroke="#1e293b" stroke-width="2.4"/></g>`;
  };
  let cuerpo="", nota="";
  if(tipo==="traslacion"){
    cuerpo = formaL(1,2,"#93c5fd") + formaL(8,2,"#86efac") + flecha(P(3.4,3.5)[0],P(3.4,3.5)[1],P(7.6,3.5)[0],P(7.6,3.5)[1],"#dc2626");
    nota = "Se desliza 7 casillas a la derecha: misma forma y misma orientación.";
  } else if(tipo==="reflexion"){
    const [ex]=P(6.5,0);
    cuerpo = formaL(3,2,"#93c5fd") +
      `<g transform="translate(${2*ex},0) scale(-1,1)">${formaL(3,2,"#86efac")}</g>` +
      `<line x1="${ex}" y1="${my}" x2="${ex}" y2="${my+filas*c}" stroke="#dc2626" stroke-width="3.5" stroke-dasharray="8 5"/>`;
    nota = "Se refleja respecto de la línea roja, como en un espejo: queda al revés.";
  } else { // rotacion
    const [gx,gy]=P(4,5);
    cuerpo = formaL(2,2,"#93c5fd") +
      `<g transform="rotate(90 ${gx} ${gy})">${formaL(2,2,"#86efac")}</g>` +
      `<circle cx="${gx}" cy="${gy}" r="6" fill="#dc2626"/>
       <path d="M ${gx+52} ${gy-14} A 54 54 0 0 1 ${gx+14} ${gy+52}" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#pf)"/>`;
    nota = "Gira 90° alrededor del punto rojo.";
  }
  return `<div style="text-align:center;max-width:100%">
    <svg viewBox="0 0 ${cols*c+mx*2} ${filas*c+my*2}" width="${Math.min(cols*c+mx*2,420)}" style="max-width:100%"
      role="img" aria-label="${tipo}">${defs}${grid}${cuerpo}</svg>
    <div class="mini-nota" style="margin-top:4px;font-weight:bold">${nota}</div></div>`;
}

/** Figura irregular sobre cuadrícula, para contar área y perímetro. */
function svgFiguraCeldas(celdas, cols, filas, opt){
  opt = opt || {};
  const c = opt.celda || 30, mx=10, my=10;
  const set = new Set(celdas);
  let out="";
  for(let f=0;f<filas;f++) for(let k=0;k<cols;k++){
    const on=set.has(f+","+k);
    out += `<rect x="${mx+k*c}" y="${my+f*c}" width="${c}" height="${c}"
      fill="${on?(opt.color||'#a5b4fc'):'#f8fafc'}" stroke="${on?'#3730a3':'#cbd5e1'}" stroke-width="${on?2:1}"/>`;
  }
  const leyenda = opt.leyenda ? `<text x="${mx+cols*c/2}" y="${my+filas*c+19}" text-anchor="middle" font-size="13"
      font-weight="bold" fill="#475569">${opt.leyenda}</text>` : "";
  return `<svg viewBox="0 0 ${cols*c+mx*2} ${filas*c+my*2+(opt.leyenda?24:0)}" width="${Math.min(cols*c+mx*2,400)}" role="img"
    aria-label="Figura en cuadrícula">${out}${leyenda}</svg>`;
}

/** Tabla posicional UM C D U para sumas y restas. */
function svgPosicional(a, b, signo){
  const cols=["UM","C","D","U"], c=44, mx=30, my=12;
  const dig = n => String(n).padStart(4," ").split("");
  const A=dig(a), B=dig(b);
  let out="";
  cols.forEach((t,i)=> out += `<rect x="${mx+i*c}" y="${my}" width="${c}" height="30" fill="#cbd5e1" stroke="#475569" stroke-width="1.3"/>
     <text x="${mx+i*c+c/2}" y="${my+21}" text-anchor="middle" font-size="15" font-weight="bold" fill="#12203a">${t}</text>`);
  [A,B].forEach((fila,r)=>{
    fila.forEach((d,i)=> out += `<rect x="${mx+i*c}" y="${my+30+r*38}" width="${c}" height="38" fill="#fff" stroke="#475569" stroke-width="1.3"/>
      <text x="${mx+i*c+c/2}" y="${my+30+r*38+26}" text-anchor="middle" font-size="20" font-weight="bold" fill="#12203a">${d.trim()}</text>`);
  });
  out += `<text x="${mx-18}" y="${my+30+38+26}" font-size="26" font-weight="bold" fill="#dc2626">${signo}</text>`;
  for(let i=0;i<4;i++) out += `<rect x="${mx+i*c}" y="${my+106}" width="${c}" height="38" fill="#fef9c3" stroke="#475569" stroke-width="1.3"/>`;
  return `<svg viewBox="0 0 ${mx+4*c+16} ${my+152}" width="${mx+4*c+16}" role="img" aria-label="Tabla posicional">${out}</svg>`;
}

/** Recta numérica con una marca. */
function svgRecta(min, max, marca, paso){
  const W=420, mx=26, largo=W-mx*2, y=54;
  const pos = v => mx + (v-min)/(max-min)*largo;
  let ticks="";
  for(let v=min; v<=max; v+=paso){
    ticks += `<line x1="${pos(v)}" y1="${y-9}" x2="${pos(v)}" y2="${y+9}" stroke="#475569" stroke-width="2"/>
      <text x="${pos(v)}" y="${y+30}" text-anchor="middle" font-size="13" fill="#334155">${v.toLocaleString('es-CL')}</text>`;
  }
  const m = marca!=null ? `<circle cx="${pos(marca)}" cy="${y}" r="8" fill="#dc2626"/>
     <text x="${pos(marca)}" y="${y-18}" text-anchor="middle" font-size="15" font-weight="bold" fill="#dc2626">?</text>` : "";
  return `<svg viewBox="0 0 ${W} 76" width="${W}" style="max-width:100%" role="img" aria-label="Recta numérica">
    <line x1="${mx}" y1="${y}" x2="${W-mx}" y2="${y}" stroke="#1e40af" stroke-width="3"/>${ticks}${m}</svg>`;
}

    <h3>Sumar usando la tabla posicional</h3>
    <p>Se suma <b>columna por columna</b>, empezando siempre por las <b>unidades</b> (la derecha).
    Si una columna pasa de 9, se <b>reserva</b> (se lleva) 1 a la columna siguiente.</p>

      <div class="paso">D: 5 + 5 = 10 → escribo 0 y <b>llevo 1</b></div>
      <div class="paso">C: 2 + 7 + 1 = 10 → escribo 0 y <b>llevo 1</b></div>
      <div class="paso">UM: 1 + 3 + 1 = 5</div>
      <div class="paso"><b>Resultado: 5.004</b></div>
    </div>

    <h3>Restar con canje (pedir prestado)</h3>
    <p>Si arriba hay menos que abajo, se <b>pide prestada</b> 1 unidad a la posición vecina de la izquierda,
    que vale 10 en la columna donde llega.</p>

    <h3>Multiplicar es sumar grupos iguales</h3>
    <p><span class="num">4 × 6</span> significa "4 grupos de 6": 6 + 6 + 6 + 6 = 24.</p>
    <h3>Propiedades que hay que saberse de memoria</h3>
    <table>
      <tr><th>Propiedad</th><th>Qué dice</th><th>Ejemplo</th></tr>
      <tr><td>Elemento neutro</td><td>Multiplicar por <b>1</b> deja el número igual</td><td>942 × 1 = 942</td></tr>
      <tr><td>Elemento absorbente</td><td>Multiplicar por <b>0</b> siempre da <b>0</b></td><td>332 × 0 = 0</td></tr>
      <tr><td>Conmutativa</td><td>El orden no cambia el resultado</td><td>7 × 8 = 8 × 7</td></tr>
      <tr><td>Distributiva</td><td>Se puede repartir en partes más fáciles</td><td>6 × 14 = 6×10 + 6×4 = 84</td></tr>
    </table>
    <div class="error-comun">⚠️ <b>El error más repetido en las pruebas:</b> confundir el 0 y el 1.
    Con el <b>0</b> todo desaparece (× 0 = 0). Con el <b>1</b> todo queda igual (× 1 = el mismo número).
    Ojo: eso es en la <b>multiplicación</b>. En la <b>suma</b> es al revés: + 0 deja igual.</div>

    <h3>Dividir es repartir en partes iguales</h3>
    <p><span class="num">85 : 5</span> pregunta: "¿en cuántos grupos de 5 puedo repartir 85?" o "¿cuánto le toca a cada uno si reparto 85 entre 5?".</p>
    <div class="ejemplo"><b>Ejemplo: 92 : 4</b>
      <div class="paso">Reparto las decenas: 9 decenas entre 4 → 2 decenas a cada uno (8 decenas usadas), sobra 1 decena.</div>
      <div class="paso">Esa decena que sobra son 10 unidades; junto con las 2 unidades hacen 12.</div>
      <div class="paso">12 : 4 = 3</div>
      <div class="paso"><b>Resultado: 23</b> (comprobación: 23 × 4 = 92 ✅)</div>
    </div>
    <div class="resumen"><b>Resumen:</b> multiplicar y dividir son operaciones inversas.
    Si 92 : 4 = 23, entonces 23 × 4 = 92. ¡Siempre comprueba multiplicando!</div>
    <div class="dato">💡 <b>Dato curioso:</b> la tabla del 9 tiene truco. Los resultados 09, 18, 27, 36, 45, 54, 63, 72, 81, 90:
    las decenas suben de 1 en 1 y las unidades bajan de 1 en 1. ¡Y las cifras de cada resultado siempre suman 9!</div>`,

    <h3>La regla de oro</h3>
    <p class="centro"><span class="num" style="font-size:1.25rem">1 m = 100 cm</span></p>
    <ul>
      <li>De <b>metros a centímetros</b>: se <b>multiplica por 100</b> (el número se hace más grande porque el cm es más chico).</li>
      <li>De <b>centímetros a metros</b>: se <b>divide por 100</b>.</li>
    </ul>
    <div class="ejemplo"><b>Ejemplos:</b>
      <div class="paso">45 m → 45 × 100 = <b>4.500 cm</b></div>
      <div class="paso">1.200 cm → 1.200 : 100 = <b>12 m</b></div>
    </div>
    <div class="dato">💡 <b>Truco rapidísimo:</b> para pasar de m a cm, ¡solo agrega dos ceros!
    Para pasar de cm a m, tapa los dos últimos dígitos: lo que queda son los metros y lo tapado son los centímetros que sobran.</div>

    <h3>Separar en metros y centímetros</h3>
    <div class="ejemplo"><b>Ejemplo: 417 cm</b>
      <div class="paso">Tapo los dos últimos dígitos: 4 | 17</div>
      <div class="paso">Quedan <b>4 m</b> y sobran <b>17 cm</b></div>
      <div class="paso"><b>417 cm = 4 m + 17 cm</b></div>
    </div>
    <div class="resumen"><b>Resumen:</b> m → cm se multiplica por 100 · cm → m se divide por 100.
    Para comparar dos medidas, primero déjalas en la misma unidad.</div>

    <h3>¿Cuándo uso cada unidad?</h3>

  teoria:`
    <h3>¿Qué es el perímetro?</h3>
    <p>El <b>perímetro</b> es lo que mide el <b>borde</b> de una figura: es el camino que recorres si caminas por todo el contorno
    y vuelves al punto de partida. Se calcula <b>sumando todos los lados</b>.</p>
    <div class="dato">💡 <b>Para no olvidarlo nunca:</b> "perímetro" viene del griego <i>peri</i> (alrededor) y <i>metron</i> (medida):
    ¡la medida de alrededor! Piensa en la reja que rodea una cancha.</div>

    <h3>Fórmulas rápidas</h3>
    <table>
      <tr><th>Figura</th><th>Fórmula</th><th>Ejemplo</th></tr>
      <tr><td>Cuadrado</td><td>P = lado × 4</td><td>lado 5 cm → 5 × 4 = 20 cm</td></tr>
      <tr><td>Rectángulo</td><td>P = (base + altura) × 2</td><td>6 m y 4 m → (6+4) × 2 = 20 m</td></tr>
      <tr><td>Cualquier figura</td><td>P = suma de todos los lados</td><td>3+4+5 = 12 cm</td></tr>
    </table>
    <div class="ejemplo"><b>Ejemplo paso a paso:</b> rectángulo de 13 m de base y 3 m de altura.
      <div class="paso">Los lados son: 13, 3, 13 y 3</div>
      <div class="paso">13 + 3 + 13 + 3 = 32</div>
      <div class="paso">O más rápido: (13 + 3) × 2 = 16 × 2 = 32</div>
      <div class="paso"><b>Perímetro = 32 m</b></div>
    </div>
    <div class="resumen"><b>Resumen:</b> perímetro = borde = suma de los lados. Se mide en <b>cm</b> o <b>m</b> (unidades simples, sin cuadradito).</div>
    <div class="error-comun">⚠️ <b>Error común:</b> confundir perímetro con área. Perímetro se mide en <b>cm</b>; área en <b>cm²</b>.
    Otro error: en un rectángulo sumar solo dos lados. ¡Tiene cuatro!</div>`,

    <h3>¿Qué es la simetría?</h3>
    <p>Una figura es <b>simétrica</b> cuando se puede doblar por una línea y las dos mitades <b>calzan exactamente</b>,
    una sobre la otra. Esa línea se llama <b>eje de simetría</b>.</p>
    <div class="dato">💡 <b>Prueba del doblez:</b> imagina que la figura es de papel. Si al doblarla por una línea
    las dos partes coinciden perfectitas, esa línea es un eje de simetría. Si sobra o falta un pedazo, no lo es.</div>

    <h3>¿Cuántos ejes tiene cada figura?</h3>
    <table>
      <tr><th>Figura</th><th>Ejes de simetría</th></tr>
      <tr><td>Cuadrado</td><td><b>4</b> (2 rectos y 2 diagonales)</td></tr>
      <tr><td>Rectángulo</td><td><b>2</b> (vertical y horizontal)</td></tr>
      <tr><td>Triángulo equilátero</td><td><b>3</b></td></tr>
      <tr><td>Triángulo isósceles</td><td><b>1</b></td></tr>
      <tr><td>Triángulo escaleno</td><td><b>0</b></td></tr>
      <tr><td>Círculo</td><td><b>Infinitos</b></td></tr>
      <tr><td>Paralelogramo (que no sea rombo ni rectángulo)</td><td><b>0</b></td></tr>
    </table>
    <div class="error-comun">⚠️ <b>Error común:</b> creer que la diagonal del <b>rectángulo</b> es eje de simetría.
    ¡No lo es! Si doblas un rectángulo por su diagonal, las mitades no calzan. En el <b>cuadrado</b> sí,
    porque todos sus lados miden lo mismo.</div>
    <div class="resumen"><b>Resumen:</b> eje de simetría = línea de doblez donde las dos mitades calzan.
    Cuadrado 4, rectángulo 2, círculo infinitos, triángulo escaleno 0.</div>
    <h3>Simetría a tu alrededor</h3>
    <p>Las mariposas, las hojas, tu cara, muchas letras (A, H, M, O, T, U, V, W, X) y hasta la bandera de Chile tienen simetría.
    Otras letras, como la F, la R o la J, no tienen ningún eje.</p>`,

{
  id:"transf", icono:"🔄", nombre:"Traslación, rotación y reflexión", titulo:"Mago de los Movimientos",
  color:"#9333ea",
  teoria:`
    <h3>Tres formas de mover una figura</h3>
    <p>En las tres, la figura <b>no cambia de tamaño ni de forma</b>: solo cambia de lugar o de posición.</p>

    <h3>1. Traslación ➡️ (deslizar)</h3>
    <p>La figura se <b>desliza</b> en línea recta: hacia arriba, abajo, derecha o izquierda. Queda <b>igual y mirando para el mismo lado</b>.</p>
    <div class="figura">FIG_TRASLACION</div>
    <p>Se describe diciendo <b>cuántas casillas</b> y <b>en qué dirección</b>: "3 casillas a la derecha y 2 hacia abajo".</p>

    <h3>2. Rotación 🔄 (girar)</h3>
    <p>La figura <b>gira</b> alrededor de un punto (el centro de rotación). Se indica <b>cuántos grados</b> (90°, 180°, 270°, 360°)
    y hacia dónde (a favor o en contra de los punteros del reloj).</p>
    <div class="figura">FIG_ROTACION</div>

    <h3>3. Reflexión 🪞 (espejo)</h3>
    <p>La figura se <b>refleja</b> al otro lado de una recta, como en un espejo. Queda <b>al revés</b>:
    lo que estaba a la derecha aparece a la izquierda.</p>
    <div class="figura">FIG_REFLEXION</div>

    <div class="resumen"><b>Resumen:</b> traslación = deslizar (misma orientación) · rotación = girar (alrededor de un punto)
    · reflexión = espejo (queda invertida). En las tres, tamaño y forma se conservan.</div>
    <div class="dato">💡 <b>Truco para no confundirse:</b> mira tus manos. Tu mano derecha y tu mano izquierda son
    <b>reflexiones</b>: por más que las gires o las deslices, nunca quedan iguales. ¡Eso solo lo hace el espejo!</div>
    <div class="error-comun">⚠️ <b>Error común:</b> decir "rotación" cuando en realidad la figura solo se movió de lugar
    sin girar. Si la figura sigue "mirando" hacia el mismo lado, es traslación.</div>`,
  preguntas:[
    {t:"mc", p:"Observa el dibujo: ¿qué transformación se aplicó a la figura azul para obtener la verde?",
     fig:()=>svgTransformacion("traslacion"),
     o:["Traslación","Rotación","Reflexión","Ampliación"], c:0,
     por:{1:"En una rotación la figura queda girada; aquí sigue mirando igual.",

const ESTADO = {
  xp:0, racha:0, mejorRacha:0, correctas:0, incorrectas:0,
  inicio:Date.now(), medallas:new Set(), nivelesPerfectos:0,
  progreso:{},          // id -> {completado, estrellas, correctas, total}
  memoramaHecho:false, desafio:null
};
NIVELES.forEach(n=> ESTADO.progreso[n.id] = {completado:false, estrellas:0, correctas:0, total:0});

const $  = id => document.getElementById(id);
const el = (tag, cls, html)=>{ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; };

/** Mezcla aleatoria (Fisher-Yates) */
function mezclar(arr){
  const a = arr.slice();
  for(let i=a.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

const ANIMOS_OK  = ["¡Excelente!","¡Muy bien!","¡Perfecto!","¡Lo lograste!","¡Genial!","¡Correctísimo!","¡Crack!","¡Increíble!"];
const ANIMOS_MAL = ["¡Casi!","Uy, no era esa…","¡Tranquilo, se aprende!","No pasa nada, sigue.","¡Ojo con este!"];
const azar = a => a[Math.floor(Math.random()*a.length)];

/** Normaliza una respuesta escrita para compararla */
function normaliza(s){
  return String(s).toLowerCase().trim()
    .replace(/\s+/g,"").replace(/\./g,"").replace(/,/g,"")
    .replace(/cm2|cm²/g,"").replace(/m2|m²/g,"")
    .replace(/°|grados|cm|mts|m\b|pesos|\$/g,"");
}

function mostrar(idPantalla){
  document.querySelectorAll(".pantalla").forEach(p=>p.classList.remove("activa"));
  $(idPantalla).classList.add("activa");
  window.scrollTo({top:0, behavior:"smooth"});
}

function sumarXP(n){ ESTADO.xp += n; actualizarHUD(); }

function actualizarHUD(){
  const totalNiveles = NIVELES.length;
  const hechos = NIVELES.filter(n=>ESTADO.progreso[n.id].completado).length;
  const pct = Math.round(hechos/totalNiveles*100);
  $("hud-xp").textContent = ESTADO.xp;
  $("hud-estrellas").textContent = NIVELES.reduce((s,n)=>s+ESTADO.progreso[n.id].estrellas,0);
  $("hud-racha").textContent = ESTADO.racha;
  $("hud-medallas").textContent = ESTADO.medallas.size;
  $("hud-pct").textContent = pct + "%";
  $("barra-global").firstElementChild.style.width = pct + "%";
}

function ganarMedalla(id){
  if(ESTADO.medallas.has(id)) return;
  const m = MEDALLAS.find(x=>x.id===id); if(!m) return;
  ESTADO.medallas.add(id);
  actualizarHUD();
  toast(`🏅 ¡Medalla desbloqueada! <b>${m.n}</b><br><span style="font-size:.86rem">${m.d}</span>`);
}

let toastTimer=null;
function toast(html){
  let t = $("toast");
  if(!t){ t = el("div"); t.id="toast";
    t.style.cssText="position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#12203a;color:#fff;"+
      "padding:13px 20px;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:900;max-width:92vw;"+
      "text-align:center;font-weight:bold;line-height:1.35";
    document.body.appendChild(t);
  }
  t.innerHTML = html; t.style.display="block"; t.style.opacity="1";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.style.transition="opacity .5s"; t.style.opacity="0";
    setTimeout(()=>{ t.style.display="none"; t.style.transition=""; },520); }, 3200);
}

function confeti(n){
  const colores=["#f97316","#2563eb","#16a34a","#ec4899","#facc15","#7c3aed"];
  for(let i=0;i<(n||60);i++){
    const c = el("div","confeti");
    c.style.left = Math.random()*100+"vw";
    c.style.background = colores[Math.floor(Math.random()*colores.length)];
    c.style.animationDuration = (2.1+Math.random()*1.9)+"s";
    c.style.animationDelay = (Math.random()*.5)+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 4600);
  }
}

function registrarRespuesta(ok){
  if(ok){
    ESTADO.correctas++; ESTADO.racha++;
    if(ESTADO.racha > ESTADO.mejorRacha) ESTADO.mejorRacha = ESTADO.racha;
    if(ESTADO.racha === 5)  ganarMedalla("racha5");
    if(ESTADO.racha === 10) ganarMedalla("racha10");
    if(ESTADO.racha > 0 && ESTADO.racha % 5 === 0){ sumarXP(15); toast(`🔥 ¡Racha de ${ESTADO.racha}! +15 XP de bonificación`); }
  } else {
    ESTADO.incorrectas++; ESTADO.racha = 0;
  }
  actualizarHUD();
}

function nivelDesbloqueado(i){
  if(i===0) return true;
  return ESTADO.progreso[NIVELES[i-1].id].completado;
}
function todosCompletos(){ return NIVELES.every(n=>ESTADO.progreso[n.id].completado); }

/* ---------- Nivel: teoría / práctica / tarjetas ---------- */
let SESION = null;   // sesión de práctica en curso

function abrirNivel(i){ pintarNivel(i, "aprende"); mostrar("p-nivel"); }

function pintarNivel(i, pestana){
  const n = NIVELES[i], c = $("p-nivel");
  c.innerHTML = "";
  const cab = el("div","card");
  cab.innerHTML = `
    <div class="pregunta-meta"><span>NIVEL ${i+1} · ${n.nombre}</span>
      <span>${"⭐".repeat(ESTADO.progreso[n.id].estrellas)}${"☆".repeat(3-ESTADO.progreso[n.id].estrellas)}</span></div>
    <h2 style="color:${n.color}">${n.icono} ${n.titulo}</h2>
    <div class="tabs">
      <button class="tab ${pestana==="aprende"?"activa":""}" type="button" data-t="aprende">📖 Aprende</button>
      <button class="tab ${pestana==="practica"?"activa":""}" type="button" data-t="practica">🎮 Practica (${n.preguntas.length})</button>
      <button class="tab ${pestana==="tarjetas"?"activa":""}" type="button" data-t="tarjetas">🃏 Tarjetas (${n.flashcards.length})</button>
      <button class="tab" type="button" data-t="volver">🗺️ Mapa</button>
    </div>`;
  c.appendChild(cab);
  cab.querySelectorAll(".tab").forEach(b=>{
    b.onclick = ()=>{
      const t = b.dataset.t;
      if(t==="volver"){ renderMapa(); mostrar("p-mapa"); return; }
      pintarNivel(i, t);
    };
  });

  const cuerpo = el("div"); cuerpo.id = "nivel-cuerpo"; c.appendChild(cuerpo);

  if(pestana==="aprende")      pintarTeoria(i, cuerpo);
  else if(pestana==="practica") iniciarPractica(i, cuerpo);
  else                          pintarFlashcards(n.flashcards, cuerpo, n.nombre);
}

function pintarTeoria(i, cont){
  const n = NIVELES[i];
  let html = n.teoria
    .replace("FIG_TRASLACION", svgTransformacion("traslacion"))
    .replace("FIG_ROTACION",   svgTransformacion("rotacion"))
    .replace("FIG_REFLEXION",  svgTransformacion("reflexion"));
  const d = el("div","card teoria", html);
  cont.appendChild(d);
  const acc = el("div","card centro");
  acc.innerHTML = `<p><b>¿Listo para practicar?</b> Ya leíste la teoría de este nivel.</p>
    <button class="btn verde" type="button" id="ir-practica">🎮 Ir a las actividades</button>`;
  cont.appendChild(acc);
  $("ir-practica").onclick = ()=> pintarNivel(i,"practica");
}

/* ---------- Práctica ---------- */
function iniciarPractica(i, cont){
  const n = NIVELES[i];
  SESION = { nivel:i, lista:mezclar(n.preguntas), idx:0, aciertosPrimera:0, fallos:0, resueltas:0, esDesafio:false };
  pintarPregunta(cont);
}

function pintarPregunta(cont){
  cont = cont || $("nivel-cuerpo");
  const S = SESION;
  if(S.idx >= S.lista.length){ return S.esDesafio ? terminarDesafio() : terminarNivel(); }
  const q = S.lista[S.idx];
  const n = S.esDesafio ? null : NIVELES[S.nivel];
  cont.innerHTML = "";

  const caja = el("div","pregunta-caja");
  const tipoNombre = {mc:"Selección múltiple", vf:"Verdadero o falso", esc:"Completa", rel:"Relaciona", ord:"Ordena"}[q.t];
  const barra = Math.round(S.idx / S.lista.length * 100);
  caja.innerHTML = `
    <div class="pregunta-meta">
      <span>Pregunta ${S.idx+1} de ${S.lista.length}${q.fuente?" · "+q.fuente:""}</span>
      <span class="etiqueta-tipo">${tipoNombre}</span>
    </div>
    <div style="height:9px;background:#e2e8f0;border-radius:99px;margin-bottom:14px;overflow:hidden">
      <i style="display:block;height:100%;width:${barra}%;background:${(n&&n.color)||"#2563eb"};border-radius:99px;transition:width .4s"></i>
    </div>`;

  const enun = el("div","pregunta-texto", q.p || q.consigna);
  caja.appendChild(enun);
  if(q.fig){ const f = el("div","figura", q.fig()); caja.appendChild(f); }

  const zona = el("div"); caja.appendChild(zona);
  const fb = el("div","feedback"); fb.id="fb"; caja.appendChild(fb);
  const pie = el("div","acciones"); pie.id="pie"; caja.appendChild(pie);
  cont.appendChild(caja);

  if(q.t==="mc" || q.t==="vf") pintarOpciones(q, zona);
  else if(q.t==="esc")         pintarEscribir(q, zona);
  else if(q.t==="rel")         pintarRelacionar(q, zona);
  else if(q.t==="ord")         pintarOrdenar(q, zona);
}

function mostrarFeedback(ok, textoOk, textoMal){
  const fb = $("fb");
  fb.className = "feedback " + (ok?"ok":"mal");
  fb.innerHTML = ok
    ? `<span class="cabeza">✅ ${azar(ANIMOS_OK)}</span>${textoOk||""}`
    : `<span class="cabeza">❌ ${azar(ANIMOS_MAL)}</span>${textoMal||""}`;
}

function botonSiguiente(){
  const pie = $("pie"); pie.innerHTML = "";
  const b = el("button","btn verde", SESION.idx+1 >= SESION.lista.length ? "🏁 Ver resultados" : "Siguiente ➡️");
  b.type="button";
  b.onclick = ()=>{ SESION.idx++; pintarPregunta(); };
  pie.appendChild(b);
  b.focus();
}

function cerrarPregunta(acertoPrimera){
  SESION.resueltas++;
  if(acertoPrimera){ SESION.aciertosPrimera++; sumarXP(10); }
  else { SESION.fallos++; sumarXP(3); }
  botonSiguiente();
}

/* --- selección múltiple y verdadero/falso --- */
function pintarOpciones(q, zona){
  const esVF = q.t==="vf";
  const opciones = esVF ? ["Verdadero","Falso"] : q.o;
  const correcta = esVF ? (q.c ? 0 : 1) : q.c;
  const orden = esVF ? [0,1] : mezclar(opciones.map((_,k)=>k));
  const cont = el("div","opciones" + (esVF||opciones.length===2 ? " dos":""));
  let cerrado = false, fallo = false;

  orden.forEach((k, pos)=>{
    const b = el("button","opcion");
    b.type="button";
    b.innerHTML = `<span class="letra">${String.fromCharCode(65+pos)}</span><span>${opciones[k]}</span>`;
    b.onclick = ()=>{
      if(cerrado) return;
      if(k === correcta){
        b.classList.add("correcta"); cerrado = true;
        cont.querySelectorAll("button").forEach(x=>{ x.disabled=true; if(x!==b) x.classList.add("atenuada"); });
        registrarRespuesta(!fallo);
        mostrarFeedback(true, q.fb || "¡Respuesta correcta!");
        cerrarPregunta(!fallo);
      } else {
        b.classList.add("incorrecta"); b.disabled = true;
        if(!fallo){ registrarRespuesta(false); }
        fallo = true;
        const razon = (q.por && q.por[k]) || (esVF ? q.mal : "Esa alternativa no es la correcta.");
        mostrarFeedback(false, "", razon + "<br><b>Inténtalo de nuevo.</b>");
      }
    };
    cont.appendChild(b);
  });
  zona.appendChild(cont);
}

/* --- escribir la respuesta --- */
function pintarEscribir(q, zona){
  const fila = el("div","fila-input");
  const inp = el("input","resp-input"); inp.type="text"; inp.setAttribute("inputmode","text");
  inp.setAttribute("aria-label","Tu respuesta"); inp.placeholder="?";
  const bt = el("button","btn pequeno","Comprobar"); bt.type="button";
  fila.appendChild(inp);
  if(q.unidad) fila.appendChild(el("span","unidad", q.unidad));
  fila.appendChild(bt);
  if(q.pista){ const p = el("button","btn gris pequeno","💡 Pista"); p.type="button";
    p.onclick = ()=>{ toast("💡 " + q.pista); }; fila.appendChild(p); }
  zona.appendChild(fila);

  let fallo=false, cerrado=false;
  const comprobar = ()=>{
    if(cerrado) return;
    const v = normaliza(inp.value);
    if(!v){ toast("✏️ Escribe tu respuesta primero."); return; }
    const ok = q.resp.some(r => normaliza(r) === v);
    if(ok){
      cerrado = true; inp.classList.remove("mal"); inp.classList.add("ok"); inp.disabled=true; bt.disabled=true;
      registrarRespuesta(!fallo);
      mostrarFeedback(true, q.fb || "¡Respuesta correcta!");
      cerrarPregunta(!fallo);
    } else {
      inp.classList.add("mal");
      if(!fallo) registrarRespuesta(false);
      fallo = true;
      mostrarFeedback(false, "", "Esa no es la respuesta. Revisa tu cálculo y vuelve a intentarlo." +
        (q.pista ? " <br><b>Pista:</b> " + q.pista : "") +
        `<br><button class="btn naranjo pequeno" type="button" id="ver-resp">Ver la respuesta</button>`);
      const vr = $("ver-resp");
      if(vr) vr.onclick = ()=>{
        cerrado = true; inp.value = q.resp[0]; inp.disabled=true; bt.disabled=true;
        mostrarFeedback(false, "", `La respuesta correcta es <b>${q.resp[0]}${q.unidad?" "+q.unidad:""}</b>. ${q.fb||""}`);
        cerrarPregunta(false);
      };
    }
  };
  bt.onclick = comprobar;
  inp.addEventListener("keydown", e=>{ if(e.key==="Enter") comprobar(); });
  setTimeout(()=>inp.focus(), 60);
}

/* --- relacionar columnas --- */
function pintarRelacionar(q, zona){
  const izq = mezclar(q.pares.map((p,i)=>({txt:p[0], i})));
  const der = mezclar(q.pares.map((p,i)=>({txt:p[1], i})));
  const cont = el("div","relacionar");
  const colA = el("div","rel-col"), colB = el("div","rel-col");
  cont.appendChild(colA); cont.appendChild(colB); zona.appendChild(cont);
  let selA = null, hechos = 0, fallo = false;

  const armar = (item, col, lado)=>{
    const b = el("button","rel-item", item.txt); b.type="button";
    b.dataset.i = item.i;
    b.onclick = ()=>{
      if(b.classList.contains("usado")) return;
      if(lado==="A"){
        colA.querySelectorAll(".rel-item").forEach(x=>x.classList.remove("sel"));
        b.classList.add("sel"); selA = b;
      } else {
        if(!selA){ toast("👈 Elige primero una opción de la izquierda."); return; }
        if(selA.dataset.i === b.dataset.i){
          selA.classList.remove("sel"); selA.classList.add("usado"); b.classList.add("usado");
          selA = null; hechos++;
          if(hechos === q.pares.length){
            registrarRespuesta(!fallo);
            mostrarFeedback(true, q.fb || "¡Todas las parejas correctas!");
            cerrarPregunta(!fallo);
          } else {
            mostrarFeedback(true, `¡Pareja correcta! Te faltan ${q.pares.length - hechos}.`);
          }
        } else {
          b.classList.add("fallo"); setTimeout(()=>b.classList.remove("fallo"), 420);
          if(!fallo) registrarRespuesta(false);
          fallo = true;
          mostrarFeedback(false, "", "Esa pareja no calza. Vuelve a mirar con calma y prueba otra.");
        }
      }
    };
    col.appendChild(b);
  };
  izq.forEach(x=>armar(x, colA, "A"));
  der.forEach(x=>armar(x, colB, "B"));
}

/* --- ordenar elementos --- */
function pintarOrdenar(q, zona){
  const zonaResp = el("div","orden-zona");
  const banco    = el("div","orden-zona");
  zona.appendChild(el("p","mini-nota","Haz clic en los elementos <b>en el orden correcto</b>. Aparecerán arriba."));
  zona.appendChild(zonaResp); zona.appendChild(banco);
  let puestos = 0, fallo = false;

  mezclar(q.items.map((t,i)=>({t,i}))).forEach(o=>{
    const b = el("button","orden-item", o.t); b.type="button"; b.dataset.i = o.i;
    b.onclick = ()=>{
      if(Number(b.dataset.i) === puestos){
        b.classList.add("puesto"); b.disabled = true;
        b.textContent = (puestos+1) + ". " + o.t;
        zonaResp.appendChild(b);
        puestos++;
        if(puestos === q.items.length){
          registrarRespuesta(!fallo);
          mostrarFeedback(true, q.fb || "¡Orden correcto!");
          cerrarPregunta(!fallo);
        } else {
          mostrarFeedback(true, `¡Bien! Ahora busca el elemento n° ${puestos+1}.`);
        }
      } else {
        b.classList.add("fallo"); setTimeout(()=>b.classList.remove("fallo"), 420);
        if(!fallo) registrarRespuesta(false);
        fallo = true;
        mostrarFeedback(false, "", `Ese no va en el lugar n° ${puestos+1}. Piensa cuál corresponde primero.`);
      }
    };
    banco.appendChild(b);
  });
}

/* ---------- Resultado de nivel ---------- */
function terminarNivel(){
  const S = SESION, n = NIVELES[S.nivel], p = ESTADO.progreso[n.id];
  const total = S.lista.length;
  const pct = Math.round(S.aciertosPrimera/total*100);
  const estrellas = pct>=90 ? 3 : pct>=70 ? 2 : pct>=50 ? 1 : 0;

  const yaEstaba = p.completado;
  p.completado = true;
  p.correctas = Math.max(p.correctas, S.aciertosPrimera);
  p.total = total;
  if(estrellas > p.estrellas) p.estrellas = estrellas;

  let bonos = 25;
  if(pct === 100){ bonos += 50; ESTADO.nivelesPerfectos++; ganarMedalla("perfecto");
    if(ESTADO.nivelesPerfectos >= 3) ganarMedalla("perfecto3"); }
  sumarXP(bonos);
  ganarMedalla("primer_paso");
  if(n.id==="hora")      ganarMedalla("relojero");
  if(n.id==="medicion")  ganarMedalla("medidor");
  if(n.id==="problemas") ganarMedalla("detective");
  if(["numeros","sumres","muldiv"].every(id=>ESTADO.progreso[id].completado)) ganarMedalla("calculista");
  if(["perimetro","area","simetria","transf","angulos"].every(id=>ESTADO.progreso[id].completado)) ganarMedalla("geometra");
  if(todosCompletos()) ganarMedalla("maraton");
  if(estrellas === 3) confeti(70);

  const mensajes = {3:"¡Nivel dominado! Estás listo para la prueba en este tema.",
                    2:"¡Muy bien! Un repasito más y queda perfecto.",
                    1:"¡Buen intento! Vuelve a leer la teoría y juega otra vez.",
                    0:"Este tema necesita más práctica. ¡No te desanimes, vuelve a leer y prueba de nuevo!"};
  const c = $("p-resultado");
  c.innerHTML = `
    <div class="card destacada centro">
      <span class="emoji-grande">${estrellas===3?"🏆":estrellas===2?"🎉":estrellas===1?"👍":"💪"}</span>
      <h2>Nivel ${S.nivel+1} completado</h2>
      <p style="color:${n.color};font-weight:bold;font-size:1.1rem">${n.icono} ${n.titulo}</p>
      <div class="estrellas-grandes">${"⭐".repeat(estrellas)}${"☆".repeat(3-estrellas)}</div>
      <p>${mensajes[estrellas]}</p>
      <div class="stats">
        <div class="stat"><span class="v">${S.aciertosPrimera}/${total}</span><span class="k">A la primera</span></div>
        <div class="stat"><span class="v">${pct}%</span><span class="k">Logro</span></div>
        <div class="stat"><span class="v">${S.fallos}</span><span class="k">Con ayuda</span></div>
        <div class="stat"><span class="v">+${bonos}</span><span class="k">XP de bono</span></div>
      </div>
      <div class="acciones" style="justify-content:center">
        <button class="btn verde" type="button" id="r-siguiente">${S.nivel+1 < NIVELES.length ? "➡️ Siguiente nivel" : "🏁 Ver resumen final"}</button>
        <button class="btn naranjo pequeno" type="button" id="r-repetir">🔁 Repetir este nivel</button>
        <button class="btn pequeno" type="button" id="r-teoria">📖 Releer la teoría</button>
        <button class="btn gris pequeno" type="button" id="r-mapa">🗺️ Mapa</button>
      </div>
    </div>`;
  mostrar("p-resultado");
  $("r-siguiente").onclick = ()=>{
    if(S.nivel+1 < NIVELES.length){ abrirNivel(S.nivel+1); }
    else { renderFinal(); mostrar("p-final"); }
  };
  $("r-repetir").onclick = ()=> pintarNivel(S.nivel,"practica") || mostrar("p-nivel");
  $("r-teoria").onclick  = ()=>{ pintarNivel(S.nivel,"aprende"); mostrar("p-nivel"); };
  $("r-mapa").onclick    = ()=>{ renderMapa(); mostrar("p-mapa"); };
  if(!yaEstaba && todosCompletos()) toast("🏆 ¡Completaste todos los niveles! Ya puedes jugar el Desafío Final.");
}

/* ---------- Flashcards ---------- */
function pintarFlashcards(cards, cont, titulo){
  let lista = mezclar(cards), i = 0, girada = false;
  const caja = el("div","card");
  caja.innerHTML = `<h3>🃏 Tarjetas de repaso · ${titulo}</h3>
    <p class="mini-nota">Toca la tarjeta para ver la respuesta.</p>
    <div class="flash-escena"><div class="flash" id="flash" tabindex="0" role="button" aria-label="Tarjeta de repaso">
      <div class="flash-cara flash-frente"><div class="txt" id="flash-a"></div><div class="pista">Toca para ver la respuesta 👆</div></div>
      <div class="flash-cara flash-atras"><div class="txt" id="flash-b"></div><div class="pista">Toca para volver 🔄</div></div>
    </div></div>
    <div class="acciones" style="justify-content:center">
      <button class="btn pequeno" type="button" id="f-ant">⬅️ Anterior</button>
      <span class="chip" id="f-cont"></span>
      <button class="btn pequeno" type="button" id="f-sig">Siguiente ➡️</button>
      <button class="btn morado pequeno" type="button" id="f-mezclar">🔀 Mezclar</button>
    </div>`;
  cont.appendChild(caja);
  const pinta = ()=>{
    girada = false; $("flash").classList.remove("girada");
    setTimeout(()=>{ $("flash-a").innerHTML = lista[i].a; $("flash-b").innerHTML = lista[i].b; }, girada?260:0);
    $("flash-a").innerHTML = lista[i].a; $("flash-b").innerHTML = lista[i].b;
    $("f-cont").textContent = (i+1) + " / " + lista.length;
  };
  const girar = ()=>{ girada = !girada; $("flash").classList.toggle("girada", girada); };
  $("flash").onclick = girar;
  $("flash").onkeydown = e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); girar(); } };
  $("f-sig").onclick = ()=>{ i = (i+1)%lista.length; pinta(); };
  $("f-ant").onclick = ()=>{ i = (i-1+lista.length)%lista.length; pinta(); };
  $("f-mezclar").onclick = ()=>{ lista = mezclar(lista); i=0; pinta(); toast("🔀 ¡Tarjetas mezcladas!"); };
  pinta();
}

function abrirFlashcardsGlobal(){
  const todas = NIVELES.flatMap(n=>n.flashcards);
  const c = $("p-extra"); c.innerHTML = "";
  const cab = el("div","card");
  cab.innerHTML = `<h2>🃏 Todas las tarjetas de repaso</h2>
    <p class="mini-nota">${todas.length} tarjetas de los ${NIVELES.length} niveles, mezcladas.</p>
    <button class="btn gris pequeno" type="button" id="fg-volver">🗺️ Volver al mapa</button>`;
  c.appendChild(cab);
  pintarFlashcards(todas, c, "repaso completo");
  $("fg-volver").onclick = ()=>{ renderMapa(); mostrar("p-mapa"); };
  mostrar("p-extra");
}

/* ---------- Memorama ---------- */
const PARES_MEMO = [
  ["1 m","100 cm"], ["45 m","4.500 cm"], ["1.200 cm","12 m"], ["Área cuadrado 5 cm","25 cm²"],
  ["Área rect. 6×4 m","24 m²"], ["Perímetro cuadrado 5 cm","20 cm"], ["85 : 5","17"], ["92 : 4","23"],
  ["740 × 5","3.700"], ["Ángulo recto","90°"], ["Ángulo extendido","180°"], ["Ejes del cuadrado","4"]
];
function abrirMemorama(){
  const elegidos = mezclar(PARES_MEMO).slice(0,8);
  const cartas = mezclar(elegidos.flatMap((p,i)=>[{txt:p[0],par:i},{txt:p[1],par:i}]));
  let abierta = null, bloqueo = false, encontrados = 0, intentos = 0;

  const c = $("p-extra"); c.innerHTML = "";
  const cab = el("div","card");
  cab.innerHTML = `<h2>🧠 Memorama matemático</h2>
    <p class="mini-nota">Encuentra las 8 parejas: cada operación con su resultado.
    Intentos: <b id="memo-int">0</b> · Parejas: <b id="memo-par">0</b>/8</p>
    <button class="btn gris pequeno" type="button" id="memo-volver">🗺️ Volver al mapa</button>`;
  c.appendChild(cab);
  const grid = el("div","memo-grid");
  const caja = el("div","card"); caja.appendChild(grid); c.appendChild(caja);

  cartas.forEach(ct=>{
    const b = el("button","memo-carta"); b.type="button";
    b.innerHTML = `<div class="memo-in">
      <div class="memo-cara memo-frente">?</div>
      <div class="memo-cara memo-atras">${ct.txt}</div></div>`;
    b.onclick = ()=>{
      if(bloqueo || b.classList.contains("abierta") || b.classList.contains("hecha")) return;
      b.classList.add("abierta");
      if(!abierta){ abierta = {b, par:ct.par}; return; }
      intentos++; $("memo-int").textContent = intentos;
      if(abierta.par === ct.par){
        b.classList.add("hecha"); abierta.b.classList.add("hecha");
        abierta = null; encontrados++; $("memo-par").textContent = encontrados;
        sumarXP(8); registrarRespuesta(true);
        if(encontrados === 8){
          ESTADO.memoramaHecho = true; ganarMedalla("memorion"); confeti(60);
          toast(`🧠 ¡Memorama completo en ${intentos} intentos! +40 XP`); sumarXP(40);
        }
      } else {
        bloqueo = true; registrarRespuesta(false);
        setTimeout(()=>{ b.classList.remove("abierta"); abierta.b.classList.remove("abierta"); abierta=null; bloqueo=false; }, 850);
      }
    };
    grid.appendChild(b);
  });
  $("memo-volver").onclick = ()=>{ renderMapa(); mostrar("p-mapa"); };
  mostrar("p-extra");
}

/* ---------- Desafío final ---------- */
function iniciarDesafio(){
  const banco = NIVELES.flatMap(n => n.preguntas.map(q => Object.assign({}, q, {_nivel:n.nombre, _id:n.id})));
  const seleccion = mezclar(banco).slice(0, 25);
  SESION = { nivel:-1, lista:seleccion, idx:0, aciertosPrimera:0, fallos:0, resueltas:0,
             esDesafio:true, inicio:Date.now(), fallosPorTema:{} };
  const c = $("p-extra"); c.innerHTML = "";
  const cab = el("div","card destacada");
  cab.innerHTML = `<h2>🏁 Desafío Final</h2>
    <p>25 preguntas mezcladas de <b>todos</b> los temas de la prueba. ¡Demuestra todo lo que aprendiste!</p>
    <p class="mini-nota">Tiempo: <span class="cronometro" id="crono">00:00</span></p>`;
  c.appendChild(cab);
  const cuerpo = el("div"); cuerpo.id="desafio-cuerpo"; c.appendChild(cuerpo);
  mostrar("p-extra");
  pintarPreguntaDesafio();
  clearInterval(window._cronoInt);
  window._cronoInt = setInterval(()=>{
    if(!SESION || !SESION.esDesafio) return clearInterval(window._cronoInt);
    const s = Math.floor((Date.now()-SESION.inicio)/1000);
    const cr = $("crono"); if(cr) cr.textContent = String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
  }, 500);
}
function pintarPreguntaDesafio(){ pintarPregunta($("desafio-cuerpo")); }

function terminarDesafio(){
  clearInterval(window._cronoInt);
  const S = SESION;
  const seg = Math.floor((Date.now()-S.inicio)/1000);
  const pct = Math.round(S.aciertosPrimera/S.lista.length*100);
  sumarXP(pct >= 80 ? 120 : 60);
  if(pct >= 80){ ganarMedalla("campeon"); confeti(90); }
  const c = $("p-extra");
  c.innerHTML = `
    <div class="card destacada centro">
      <span class="emoji-grande">${pct>=80?"👑":pct>=60?"🎉":"💪"}</span>
      <h2>Desafío Final terminado</h2>
      <div class="stats">
        <div class="stat"><span class="v">${S.aciertosPrimera}/${S.lista.length}</span><span class="k">A la primera</span></div>
        <div class="stat"><span class="v">${pct}%</span><span class="k">Logro</span></div>
        <div class="stat"><span class="v">${String(Math.floor(seg/60)).padStart(2,"0")}:${String(seg%60).padStart(2,"0")}</span><span class="k">Tiempo</span></div>
      </div>
      <p>${pct>=80?"¡Estás más que listo para la prueba! 🎓":pct>=60?"¡Vas muy bien! Repasa los temas que te costaron.":"Repasa la teoría de los niveles y vuelve a intentarlo. ¡Tú puedes!"}</p>
      <div class="acciones" style="justify-content:center">
        <button class="btn verde" type="button" id="d-final">🏁 Ver resumen completo</button>
        <button class="btn naranjo pequeno" type="button" id="d-otra">🔁 Otra vez</button>
        <button class="btn gris pequeno" type="button" id="d-mapa">🗺️ Mapa</button>
      </div>
    </div>`;
  $("d-final").onclick = ()=>{ renderFinal(); mostrar("p-final"); };
  $("d-otra").onclick  = ()=> iniciarDesafio();
  $("d-mapa").onclick  = ()=>{ renderMapa(); mostrar("p-mapa"); };
}

/* ---------- Pantalla final con estadísticas y recomendaciones ---------- */
function renderFinal(){
  const seg = Math.floor((Date.now()-ESTADO.inicio)/1000);
  const min = Math.floor(seg/60);
  const totalPreg = ESTADO.correctas + ESTADO.incorrectas;
  const pct = totalPreg ? Math.round(ESTADO.correctas/totalPreg*100) : 0;
  const estrellas = NIVELES.reduce((s,n)=>s+ESTADO.progreso[n.id].estrellas,0);
  const maxEstrellas = NIVELES.length*3;

  let rango = "Aprendiz 🌱";
  if(ESTADO.xp > 350)  rango = "Explorador 🧭";
  if(ESTADO.xp > 700)  rango = "Experto 🎓";
  if(ESTADO.xp > 1200) rango = "Maestro Matemático 🏆";
  if(ESTADO.xp > 1800) rango = "Leyenda de 4° Básico 👑";

  // Temas débiles: niveles completados con menos de 3 estrellas, o no jugados
  const debiles = NIVELES.filter(n=>{
    const p = ESTADO.progreso[n.id];
    return !p.completado || p.estrellas < 3;
  });
  const fuertes = NIVELES.filter(n=>ESTADO.progreso[n.id].estrellas === 3);

  const recos = debiles.length ? `
    <h3>📌 Qué repasar antes de la prueba</h3>
    <ul>${debiles.map(n=>{
      const p = ESTADO.progreso[n.id];
      const estado = !p.completado ? "todavía no lo juegas" :
                     p.estrellas===2 ? "te falta poquito" :
                     p.estrellas===1 ? "necesita repaso" : "necesita bastante repaso";
      return `<li><b>${n.icono} ${n.nombre}</b> — ${estado}. Lee de nuevo la pestaña <i>Aprende</i> del nivel ${NIVELES.indexOf(n)+1} y repite las actividades.</li>`;
    }).join("")}</ul>`
    : `<div class="resumen"><b>¡Increíble!</b> Sacaste 3 estrellas en todos los niveles.
       Repasa con las tarjetas el día antes de la prueba y descansa bien. 🎓</div>`;

  const c = $("p-final");
  c.innerHTML = `
    <div class="card destacada centro">
      <span class="emoji-grande">${pct>=85?"🏆":pct>=70?"🎉":"💪"}</span>
      <h2>¡Resumen de tu estudio!</h2>
      <p style="font-size:1.15rem"><b>Rango alcanzado:</b> ${rango}</p>
      <div class="estrellas-grandes">${estrellas} / ${maxEstrellas} ⭐</div>
    </div>

    <div class="card">
      <h3>📊 Tus estadísticas</h3>
      <div class="stats">
        <div class="stat"><span class="v">${ESTADO.xp}</span><span class="k">XP total</span></div>
        <div class="stat"><span class="v">${ESTADO.correctas}</span><span class="k">Correctas</span></div>
        <div class="stat"><span class="v">${ESTADO.incorrectas}</span><span class="k">Errores</span></div>
        <div class="stat"><span class="v">${pct}%</span><span class="k">Aciertos</span></div>
        <div class="stat"><span class="v">${ESTADO.mejorRacha}</span><span class="k">Mejor racha</span></div>
        <div class="stat"><span class="v">${min} min</span><span class="k">Tiempo de estudio</span></div>
        <div class="stat"><span class="v">${NIVELES.filter(n=>ESTADO.progreso[n.id].completado).length}/${NIVELES.length}</span><span class="k">Niveles</span></div>
        <div class="stat"><span class="v">${ESTADO.medallas.size}/${MEDALLAS.length}</span><span class="k">Medallas</span></div>
      </div>
    </div>

    <div class="card">
      <h3>🏅 Medallas</h3>
      <div class="medallas">
        ${MEDALLAS.map(m=>`<div class="medalla ${ESTADO.medallas.has(m.id)?"":"gris"}">
          <span class="m-em">${m.em}</span><span><b>${m.n}</b><span class="mini-nota">${m.d}</span></span></div>`).join("")}
      </div>
    </div>

    <div class="card">
      <h3>🎯 Nivel por nivel</h3>
      <table style="width:100%;border-collapse:collapse">
        ${NIVELES.map((n,i)=>{
          const p = ESTADO.progreso[n.id];
          return `<tr style="border-bottom:1px solid var(--borde)">
            <td style="padding:7px 4px">${n.icono} <b>${n.nombre}</b></td>
            <td style="padding:7px 4px;text-align:right;white-space:nowrap">
              ${p.completado ? `${p.correctas}/${p.total}` : "<span class='mini-nota'>sin jugar</span>"}
              &nbsp; ${"⭐".repeat(p.estrellas)}${"☆".repeat(3-p.estrellas)}</td></tr>`;
        }).join("")}
      </table>
    </div>

    <div class="card">
      ${recos}
      ${fuertes.length ? `<h3>💪 Tus temas más fuertes</h3><p>${fuertes.map(n=>n.icono+" "+n.nombre).join(" · ")}</p>` : ""}
      <div class="aviso">📝 <b>Consejo para el día de la prueba:</b> lee cada enunciado dos veces, subraya los datos,
      revisa las unidades (cm, m, cm², m², $) y comprueba tus operaciones antes de entregar.</div>
    </div>

    <div class="card centro">
      <div class="acciones" style="justify-content:center">
        <button class="btn verde" type="button" id="f-mapa">🗺️ Volver al mapa</button>
        <button class="btn morado pequeno" type="button" id="f-cards">🃏 Repasar con tarjetas</button>
        <button class="btn naranjo pequeno" type="button" id="f-reiniciar">🔄 Volver a jugar desde cero</button>
      </div>
    </div>
    <p class="pie">Guía interactiva creada a partir de la <i>Guía de apoyo para la evaluación de agosto</i>.<br>
    Matemática · 4° Básico · Funciona sin internet.</p>`;
  $("f-mapa").onclick = ()=>{ renderMapa(); mostrar("p-mapa"); };
  $("f-cards").onclick = ()=> abrirFlashcardsGlobal();
  $("f-reiniciar").onclick = ()=>{ if(confirm("¿Quieres empezar de nuevo desde cero?")) reiniciar(); };
  if(pct>=85) confeti(80);
}

/* ---------- Reinicio ---------- */
function reiniciar(){
  clearInterval(window._cronoInt);
  ESTADO.xp=0; ESTADO.racha=0; ESTADO.mejorRacha=0; ESTADO.correctas=0; ESTADO.incorrectas=0;
  ESTADO.medallas = new Set(); ESTADO.nivelesPerfectos=0; ESTADO.memoramaHecho=false;
  ESTADO.inicio = Date.now(); SESION = null;
  NIVELES.forEach(n=> ESTADO.progreso[n.id] = {completado:false, estrellas:0, correctas:0, total:0});
  actualizarHUD();
  renderBienvenida();
  mostrar("p-bienvenida");
  toast("🔄 ¡Progreso reiniciado! A jugar de nuevo.");
}

/* ---------- Arranque ---------- */
$("btn-inicio").onclick = ()=>{
  clearInterval(window._cronoInt);
  if(NIVELES.some(n=>ESTADO.progreso[n.id].completado) || ESTADO.xp>0){ renderMapa(); mostrar("p-mapa"); }
  else { renderBienvenida(); mostrar("p-bienvenida"); }
};
renderBienvenida();
actualizarHUD();
</script>
